<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottica Bonardi — Dashboard</title>
<link rel="icon" type="image/png" sizes="447x447" href="logo.png?v=2">
<link rel="shortcut icon" type="image/png" href="logo.png?v=2">
<link rel="apple-touch-icon" href="logo.png?v=2">
<meta name="theme-color" content="#8d0439">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0a0507;--bg2:#160a10;--gl:rgba(255,255,255,.055);--b:rgba(255,255,255,.09);--bb:rgba(255,255,255,.2);--t:#f7eef1;--m:rgba(236,214,222,.55);--d:rgba(236,214,222,.3);--ac:#ec7ba0;--acl:rgba(236,123,160,.14);--acs:rgba(236,123,160,.07);--cy:#67e8f9;--em:#4ade80;--am:#fbbf24;--vi:#c084fc;--ro:#f87171;--gr:#4ade80;--grl:rgba(74,222,128,.16);--pri-u:#f87171;--pri-a:#fbbf24;--pri-m:#c084fc;--pri-o:#4ade80;--brand:#8d0439;--r:18px}
html.light{--bg:#f7f1f3;--bg2:#ffffff;--gl:rgba(141,4,57,.03);--b:rgba(80,12,36,.12);--bb:rgba(80,12,36,.26);--t:#2a0a16;--m:rgba(80,22,42,.62);--d:rgba(80,22,42,.4);--ac:#8d0439;--acl:rgba(141,4,57,.1);--acs:rgba(141,4,57,.05);--cy:#0891b2;--em:#15803d;--am:#b45309;--vi:#7e22ce;--ro:#b91c1c;--gr:#15803d;--grl:rgba(21,128,61,.12);--pri-u:#b91c1c;--pri-a:#b45309;--pri-m:#7e22ce;--pri-o:#15803d;--brand:#8d0439}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .35s ease,color .35s ease}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 100% 80% at -8% -8%,rgba(220,90,130,.18) 0%,transparent 52%),radial-gradient(ellipse 80% 60% at 108% 108%,rgba(74,222,128,.12) 0%,transparent 50%),radial-gradient(ellipse 60% 45% at 52% 115%,rgba(192,132,252,.1) 0%,transparent 48%),radial-gradient(ellipse 40% 30% at 105% 10%,rgba(103,232,249,.07) 0%,transparent 40%),#0a0507}
.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(236,123,160,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(236,123,160,.025) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 40%,transparent 100%)}
html{scroll-behavior:smooth}
.shell{display:flex;min-height:100dvh;position:relative;z-index:1}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sb{width:214px;flex-shrink:0;display:flex;flex-direction:column;background:rgba(7,8,15,.82);backdrop-filter:blur(60px) saturate(160%);-webkit-backdrop-filter:blur(60px) saturate(160%);position:sticky;top:0;height:100dvh;overflow:hidden;transition:width cubic-bezier(.32,.72,0,1) .4s;border-right:0.5px solid rgba(236,123,160,.08);will-change:width}
.sb.collapsed{width:60px}
.sb-logo{padding:18px 16px 16px;border-bottom:0.5px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;position:relative;min-height:72px}
.sb-icon{width:36px;height:36px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),rgba(141,4,57,.7));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 16px rgba(236,123,160,.2),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .2s cubic-bezier(.32,.72,0,1)}
.sb-icon:hover{transform:scale(1.07)}
.sb-text{overflow:hidden;transition:opacity .25s ease,transform .25s ease}
.sb.collapsed .sb-text{opacity:0;transform:translateX(-8px);pointer-events:none}
.sb-logo h1{font-size:13px;font-weight:600;white-space:nowrap}
.sb-logo p{font-size:10px;color:var(--m);margin-top:1px;white-space:nowrap}

/* hamburger toggle */
.sb-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:rgba(255,255,255,.06);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5px;transition:background .2s,right .4s cubic-bezier(.32,.72,0,1);z-index:2}
.sb-toggle:hover{background:rgba(236,123,160,.15)}
.sb.collapsed .sb-toggle{right:50%;transform:translate(50%,-50%)}
.hb{width:13px;height:1.5px;background:var(--m);border-radius:2px;transition:all .35s cubic-bezier(.32,.72,0,1);transform-origin:center}
.sb.collapsed .hb:nth-child(1){transform:rotate(45deg) translate(4.2px,4.2px)}
.sb.collapsed .hb:nth-child(2){opacity:0;transform:scaleX(0)}
.sb.collapsed .hb:nth-child(3){transform:rotate(-45deg) translate(4.2px,-4.2px)}

/* nav buttons */
.nb{display:flex;align-items:center;gap:10px;padding:9px 20px;background:none;border:none;cursor:pointer;color:var(--m);font-size:13px;font-family:'Sora',sans-serif;width:100%;text-align:left;transition:color .2s,background .2s;position:relative;white-space:nowrap}
.nb:hover{color:var(--t);background:rgba(255,255,255,.04)}
.nb.active{color:var(--ac);font-weight:500}
.nb.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:linear-gradient(180deg,var(--ac),rgba(236,123,160,.15));border-radius:0 2px 2px 0}
.nb-ic{font-size:15px;width:18px;text-align:center;flex-shrink:0;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.nb:hover .nb-ic{transform:scale(1.15)}
.nb-label{transition:opacity .2s ease,transform .2s ease}
.sb.collapsed .nb-label{opacity:0;transform:translateX(-6px);pointer-events:none}
.sb.collapsed .nb{justify-content:center;padding:10px 0}

/* stagger reveal on expand */
.sb:not(.collapsed) .nb{animation:nbReveal .35s cubic-bezier(.32,.72,0,1) both}
.sb:not(.collapsed) .nb:nth-child(1){animation-delay:.04s}
.sb:not(.collapsed) .nb:nth-child(2){animation-delay:.08s}
.sb:not(.collapsed) .nb:nth-child(3){animation-delay:.12s}
.sb:not(.collapsed) .nb:nth-child(4){animation-delay:.16s}
.sb:not(.collapsed) .nb:nth-child(5){animation-delay:.20s}
.sb:not(.collapsed) .nb:nth-child(6){animation-delay:.24s}
.sb:not(.collapsed) .nb:nth-child(7){animation-delay:.28s}
@keyframes nbReveal{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

.sb-nav{padding:10px 0;flex:1;overflow:hidden}
.sb-vista{padding:12px 14px 18px;border-top:0.5px solid rgba(255,255,255,.06);margin-top:auto;overflow:hidden;transition:opacity .25s ease}
.sb.collapsed .sb-vista{opacity:0;pointer-events:none}
.sb-vista-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--d);margin-bottom:10px}
.sede-pills{display:flex;gap:4px;flex-wrap:wrap}
.sp{padding:5px 10px;border-radius:8px;border:0.5px solid var(--b);background:none;cursor:pointer;font-size:11px;font-weight:500;font-family:'Sora',sans-serif;color:var(--m);transition:all .15s}
.sp:hover{color:var(--t);border-color:var(--bb)}
.sp.s-agg.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--t)}
.sp.s-spl.on{background:rgba(236,123,160,.12);border-color:rgba(236,123,160,.3);color:var(--ac)}
.sp.s-b1.on{background:rgba(236,123,160,.15);border-color:rgba(236,123,160,.35);color:var(--ac)}
.sp.s-b2.on{background:rgba(48,209,88,.15);border-color:rgba(48,209,88,.35);color:var(--em)}
.sp.s-b3.on{background:rgba(255,159,10,.15);border-color:rgba(255,159,10,.35);color:var(--am)}
.main{flex:1;padding:26px 26px 60px;min-width:0;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.page-title{font-size:19px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.pt-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:100px;background:rgba(236,123,160,.1);border:0.5px solid rgba(236,123,160,.2);color:var(--ac)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--t);font-family:'Sora',sans-serif;outline:none;cursor:pointer;min-width:110px;transition:all .15s ease}
.sel option{background:#0f1829}
.sel-brand{min-width:160px;border-color:rgba(191,90,242,.3);background:rgba(191,90,242,.06)}
.tpill{display:flex;background:rgba(255,255,255,.05);border-radius:9px;border:0.5px solid var(--b);overflow:hidden}
.tp{padding:5px 13px;font-size:12px;font-weight:500;background:none;border:none;cursor:pointer;color:var(--m);font-family:'Sora',sans-serif;transition:all .15s ease}
.tp.on{background:rgba(236,123,160,.14);color:var(--ac);border-color:rgba(236,123,160,.28)}
.g{background:linear-gradient(158deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.04) 100%);backdrop-filter:blur(48px) saturate(200%);-webkit-backdrop-filter:blur(48px) saturate(200%);border:0.5px solid rgba(255,255,255,.1);border-top:0.5px solid rgba(255,255,255,.18);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 64px rgba(0,0,0,.7),0 0 0 0.5px rgba(236,123,160,.05);transition:box-shadow .3s,border-color .3s}
.g:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 28px 72px rgba(0,0,0,.75),0 0 32px rgba(236,123,160,.08);border-color:rgba(255,255,255,.18)}
.kg{display:grid;gap:12px;margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.kc{padding:22px 22px 18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kc:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.kc::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.kl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--d);margin-bottom:10px;font-weight:500}
.kv{font-size:28px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;color:var(--t)}
.ks{font-size:11px;color:var(--m);margin-top:4px}
.ki{position:absolute;right:14px;top:16px;font-size:24px;opacity:.1}
.kv-split{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.kv-s-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv-s-label{font-size:10px;color:var(--m);flex-shrink:0;min-width:50px}
.kv-s-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace}
.kv-s-bar{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.kv-s-fill{height:100%;border-radius:2px}
.gcy{background:linear-gradient(135deg,#a5b4fc,rgba(236,123,160,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gam{background:linear-gradient(135deg,#fbbf24,rgba(251,191,36,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gvi{background:linear-gradient(135deg,#c084fc,rgba(192,132,252,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gem{background:linear-gradient(135deg,#4ade80,rgba(74,222,128,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gro{background:linear-gradient(135deg,#f87171,rgba(248,113,113,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;margin-top:5px}
.up{background:rgba(74,222,128,.14);color:#4ade80;border:0.5px solid rgba(74,222,128,.35)}.dn{background:rgba(248,113,113,.14);color:#f87171;border:0.5px solid rgba(248,113,113,.35)}
.card{padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.ct{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--m);display:flex;align-items:center;gap:7px}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dcy{background:var(--ac)}.dam{background:var(--am)}
.dvi{background:var(--vi)}.dem{background:var(--em)}.dro{background:var(--ro)}
.cw{position:relative;height:220px}.cw-lg{height:260px}.cw-sm{height:175px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g13{display:grid;grid-template-columns:1.65fr 1fr;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:0.5px solid var(--b)}
.tab{padding:6px 16px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--m);font-family:'Sora',sans-serif;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.on{color:var(--t);font-weight:500;border-bottom-color:var(--t)}
.abar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.srch{background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--t);font-family:'Sora',sans-serif;outline:none;width:190px}
.srch::placeholder{color:var(--d)}
.tw{border-radius:var(--r);overflow:hidden}
.th2{padding:14px 18px;border-bottom:0.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--d);border-bottom:0.5px solid rgba(255,255,255,.05);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--m)}
th.sorted{color:var(--ac)}
td{padding:9px 12px;border-bottom:0.5px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.mn{font-family:'DM Mono',monospace;font-size:12px}
.bc-tag{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.03em;color:var(--ac);cursor:pointer;padding:2px 6px;border-radius:6px;border:0.5px solid rgba(236,123,160,.25);background:rgba(236,123,160,.06);transition:background .15s}
.bc-tag:hover{background:rgba(236,123,160,.14)}
.mn-hi{color:var(--am);font-weight:600}.mn-lo{color:var(--d)}.mn-gr{color:#4ade80;font-weight:700}.mn-ro{color:#f87171;font-weight:700}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap}
.pcy{background:rgba(90,200,250,.15);color:var(--cy);border:0.5px solid rgba(90,200,250,.2)}
.pam{background:rgba(255,159,10,.15);color:var(--am);border:0.5px solid rgba(255,159,10,.2)}
.pem{background:rgba(48,209,88,.15);color:var(--em);border:0.5px solid rgba(48,209,88,.2)}
.pvi{background:rgba(191,90,242,.15);color:var(--vi);border:0.5px solid rgba(191,90,242,.2)}
.pro{background:rgba(255,69,58,.15);color:var(--ro);border:0.5px solid rgba(255,69,58,.2)}
.pci{background:rgba(255,69,58,.15);color:var(--ro);border:0.5px solid rgba(255,69,58,.2)}
.pdm{background:rgba(255,255,255,.05);color:var(--m);border:0.5px solid rgba(255,255,255,.1)}
.sdiv{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--d);margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:0.5px;background:rgba(255,255,255,.06)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid rgba(255,255,255,.04)}
.srow:last-child{border-bottom:none}
.slb{font-size:12px;font-weight:500;min-width:90px}
.sbw{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.sbar{height:100%;border-radius:3px;background:rgba(255,255,255,.07);border-radius:4px}
.s1c{background:linear-gradient(90deg,var(--ac),rgba(236,123,160,.55))}
.s2c{background:linear-gradient(90deg,var(--cy),rgba(90,200,250,.6))}
.s3c{background:linear-gradient(90deg,var(--em),rgba(48,209,88,.6))}
.sv{font-size:11px;font-family:'DM Mono',monospace;color:var(--m);min-width:54px;text-align:right}
.sp2{font-size:10px;color:var(--d);min-width:30px;text-align:right}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.04)}
.prow:last-child{border-bottom:none}
.prk{font-size:11px;color:var(--d);font-family:'DM Mono',monospace;width:18px;flex-shrink:0}
.pi{flex:1;min-width:0}
.pn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{font-size:11px;color:var(--m)}
.pbw{width:68px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;flex-shrink:0}
.pbr{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ac),rgba(236,123,160,.5))}
.pv{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;color:var(--em);min-width:58px;text-align:right;flex-shrink:0}
.pag{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:0.5px solid var(--b);font-size:12px;color:var(--m);flex-wrap:wrap}
.pbtn{padding:4px 10px;border-radius:8px;border:0.5px solid var(--b);background:none;cursor:pointer;font-size:12px;color:var(--m);font-family:'Sora',sans-serif;transition:all .15s ease}
.pbtn:hover{background:rgba(255,255,255,.06);color:var(--t);transform:translateY(-1px)}
.pbtn:active{transform:translateY(0) scale(.98)}
.pbtn.active{background:rgba(236,123,160,.14);color:var(--ac);border-color:rgba(236,123,160,.3)}
.cav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
/* UPLOAD ZONE */
.upload-zone{border:1.5px dashed rgba(236,123,160,.2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(236,123,160,.02);margin-bottom:14px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:rgba(236,123,160,.4);background:rgba(236,123,160,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:28px;margin-bottom:8px}
.upload-title{font-size:14px;font-weight:500;color:var(--ac);margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--m)}
.upload-spec{font-size:11px;color:var(--d);margin-top:6px;font-family:'DM Mono',monospace}
.file-loaded{border-color:rgba(48,209,88,.4);background:rgba(48,209,88,.04)}
.file-loaded .upload-title{color:var(--em)}
.monthpick::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
.monthpick{min-width:145px}
/* PRIORITY BADGES */
.pri-U{background:rgba(251,113,133,.15);color:#fb7185;border:0.5px solid rgba(251,113,133,.35)}
.pri-A{background:rgba(251,191,36,.12);color:#fbbf24;border:0.5px solid rgba(251,191,36,.3)}
.pri-M{background:rgba(191,90,242,.1);color:#bf5af2;border:0.5px solid rgba(191,90,242,.25)}
.pri-O{background:rgba(48,209,88,.1);color:#30d158;border:0.5px solid rgba(48,209,88,.2)}
.pri-N{background:rgba(255,255,255,.06);color:var(--m);border:0.5px solid rgba(255,255,255,.12)}
/* BRAND FILTER PILL */
.bfpill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:var(--r);background:rgba(191,90,242,.08);border:0.5px dashed rgba(191,90,242,.4);margin-bottom:12px;font-size:12px;color:var(--vi)}
.bfpill button{margin-left:auto;padding:3px 10px;border-radius:8px;border:0.5px solid rgba(191,90,242,.4);background:none;cursor:pointer;font-size:11px;color:var(--vi);font-family:'Sora',sans-serif}
.filter-pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);font-size:11px;color:var(--m)}
.fp-strong{color:var(--t)}
.quickbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qbtn{padding:6px 12px;border-radius:999px;border:0.5px solid var(--b);background:rgba(255,255,255,.04);cursor:pointer;font-size:11px;font-weight:500;color:var(--m);font-family:'Sora',sans-serif;transition:all .15s}
.qbtn:hover{color:var(--t);border-color:var(--bb)}
.qbtn.on{background:rgba(90,200,250,.14);border-color:rgba(90,200,250,.32);color:var(--cy)}
.forn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.forn-card{padding:14px;border-radius:14px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);cursor:pointer;transition:transform .15s,border-color .15s,background .15s;min-width:0}
.forn-card:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18)}
.forn-card.on{border-color:rgba(48,209,88,.35);background:linear-gradient(135deg,rgba(90,200,250,.08),rgba(48,209,88,.08))}
.forn-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.forn-name{font-size:12px;font-weight:600;line-height:1.3;word-break:break-word}
.forn-tag{font-size:10px;color:var(--d);white-space:nowrap}
.forn-val{font-size:18px;font-weight:700;letter-spacing:-.5px;line-height:1.05}
.forn-sub{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--m);font-family:'DM Mono',monospace}
.forn-last{margin-top:8px;font-size:10px;color:var(--d)}
.forn-bar{margin-top:10px;height:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.forn-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cy),var(--em))}
/* AGING ROW COLORS */
.row-U td{background:rgba(251,113,133,.03)!important}
.row-A td{background:rgba(251,191,36,.025)!important}
.row-M td{background:rgba(191,90,242,.02)!important}
.row-U:hover td,.row-A:hover td,.row-M:hover td{filter:brightness(1.15)}
/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.marg-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.06)}
.marg-fill-c{background:rgba(251,113,133,.5)}
.marg-fill-m{background:rgba(48,209,88,.5)}
.fi{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* stagger entrances */
.fi:nth-child(2){animation-delay:.05s}.fi:nth-child(3){animation-delay:.1s}.fi:nth-child(4){animation-delay:.15s}.fi:nth-child(5){animation-delay:.2s}.fi:nth-child(6){animation-delay:.25s}.fi:nth-child(7){animation-delay:.3s}
.kg>.g{animation:fi .5s cubic-bezier(.32,.72,0,1) both}
.kg>.g:nth-child(2){animation-delay:.06s}.kg>.g:nth-child(3){animation-delay:.12s}.kg>.g:nth-child(4){animation-delay:.18s}
.kv,.kv-s-val,td{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ── TOAST ─────────────────────────────────────────────────────── */
#toasts{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:14px;background:linear-gradient(158deg,rgba(255,255,255,.1),rgba(255,255,255,.05));backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:0.5px solid rgba(255,255,255,.16);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);font-size:12px;font-weight:500;color:var(--t);max-width:340px;animation:toastIn .35s cubic-bezier(.32,.72,0,1) both;pointer-events:auto}
html.light .toast{background:rgba(255,255,255,.92);border-color:rgba(15,23,42,.12);box-shadow:0 16px 40px rgba(15,23,42,.18)}
.toast.out{animation:toastOut .3s ease both}
.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.toast-ok .toast-dot{background:var(--em);box-shadow:0 0 8px var(--em)}
.toast-err .toast-dot{background:var(--ro);box-shadow:0 0 8px var(--ro)}
.toast-info .toast-dot{background:var(--ac);box-shadow:0 0 8px var(--ac)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(8px) scale(.96)}}
/* ── LIGHT THEME COMPONENT OVERRIDES ───────────────────────────── */
html.light body{background:var(--bg)}
html.light .bg{background:radial-gradient(ellipse 100% 80% at -8% -8%,rgba(236,123,160,.1) 0%,transparent 52%),radial-gradient(ellipse 80% 60% at 108% 108%,rgba(22,163,74,.07) 0%,transparent 50%),radial-gradient(ellipse 60% 45% at 52% 115%,rgba(147,51,234,.06) 0%,transparent 48%),#f2f4fa}
html.light .bg::after{background-image:linear-gradient(rgba(141,4,57,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(141,4,57,.04) 1px,transparent 1px)}
html.light .sb{background:rgba(255,255,255,.78);border-right:0.5px solid rgba(15,23,42,.08)}
html.light .sb-logo,html.light .sb-vista{border-color:rgba(15,23,42,.07)}
html.light .sb-toggle{background:rgba(15,23,42,.06)}
html.light .hb{background:rgba(30,41,59,.55)}
html.light .nb:hover{background:rgba(15,23,42,.045)}
html.light .g{background:linear-gradient(158deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.75) 100%);border:0.5px solid rgba(15,23,42,.1);border-top-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 44px rgba(15,23,42,.1),0 0 0 0.5px rgba(141,4,57,.04)}
html.light .g:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 20px 52px rgba(15,23,42,.14),0 0 24px rgba(141,4,57,.06);border-color:rgba(15,23,42,.14)}
html.light .kc::after{background:linear-gradient(90deg,transparent,rgba(15,23,42,.06),transparent)}
html.light .sel,html.light .tpill,html.light .qbtn{background:rgba(15,23,42,.04)}
html.light .sel option{background:#fff;color:#0f172a}
html.light .tp.on{background:rgba(141,4,57,.1)}
html.light .up{background:rgba(21,128,61,.1);color:#15803d;border-color:rgba(21,128,61,.3)}
html.light .dn{background:rgba(185,28,28,.08);color:#b91c1c;border-color:rgba(185,28,28,.3)}
html.light .gcy{background:linear-gradient(135deg,#8d0439,#c04a72);-webkit-background-clip:text;background-clip:text}
html.light .gem{background:linear-gradient(135deg,#15803d,#16a34a);-webkit-background-clip:text;background-clip:text}
html.light .gam{background:linear-gradient(135deg,#b45309,#d97706);-webkit-background-clip:text;background-clip:text}
html.light .gvi{background:linear-gradient(135deg,#7e22ce,#9333ea);-webkit-background-clip:text;background-clip:text}
html.light .gro{background:linear-gradient(135deg,#b91c1c,#dc2626);-webkit-background-clip:text;background-clip:text}
html.light ::-webkit-scrollbar-thumb{background:rgba(15,23,42,.18)}
html.light .ai-model-sel option{background:#fff;color:#0f172a}
html.light .sb-icon{box-shadow:0 0 16px rgba(141,4,57,.18),inset 0 1px 0 rgba(255,255,255,.3)}
/* theme switch */
.theme-sw{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:7px 10px;border-radius:10px;border:0.5px solid var(--b);background:rgba(255,255,255,.04);cursor:pointer;font-size:11px;font-weight:500;color:var(--m);font-family:'Sora',sans-serif;transition:all .2s}
.theme-sw:hover{color:var(--t);border-color:var(--bb)}
html.light .theme-sw{background:rgba(15,23,42,.04)}
.theme-track{width:30px;height:16px;border-radius:999px;background:rgba(236,123,160,.25);position:relative;flex-shrink:0;transition:background .25s}
html.light .theme-track{background:rgba(141,4,57,.3)}
.theme-knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.32,.72,0,1);box-shadow:0 1px 4px rgba(0,0,0,.4)}
html.light .theme-knob{transform:translateX(14px)}
/* AI Advisor: rinforza il contrasto dei pulsanti "Analisi rapide" e del
   campo domanda, che in chiaro risultavano troppo tenui */
html.light .ai-qbtn{background:rgba(141,4,57,.08);border-color:rgba(141,4,57,.22);color:#8d0439}
html.light .ai-qbtn:hover{background:rgba(141,4,57,.16)}
html.light #ai-inp{background:rgba(15,23,42,.04);border-color:rgba(15,23,42,.14)}
html.light #ai-inp:focus{border-color:rgba(141,4,57,.45);background:rgba(141,4,57,.04)}
html.light .ai-foot{border-top-color:rgba(15,23,42,.08)}
html.light .ai-ctx-card,html.light .ai-prompts-card{background:rgba(15,23,42,.025);border-color:rgba(15,23,42,.09)}
@media(max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.g2,.g3,.g13{grid-template-columns:1fr}.forn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.sb{display:none}.forn-grid{grid-template-columns:1fr}}
/* ── AI Advisor page ─────────────────────────────────────────────────────── */
.ai-page{display:flex;flex-direction:column;height:calc(100vh - 120px);max-height:calc(100vh - 120px);}
.ai-page-hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.ai-hero{display:flex;align-items:center;gap:14px;}
.ai-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#8d0439);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 3px rgba(236,123,160,.2);}
.ai-model-sel{font-size:11px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.07);border:0.5px solid rgba(255,255,255,.14);color:var(--m);cursor:pointer;font-family:inherit;}
.ai-model-sel option{background:#0a0a14;color:#fff;}
.ai-body{display:flex;gap:16px;flex:1;min-height:0;}
.ai-sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
.ai-ctx-card{background:var(--gl);border:0.5px solid var(--b);border-radius:var(--r);padding:14px;}
.ai-ctx-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--d);margin-bottom:10px;}
.ai-ctx-row{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:6px;}
.ai-ctx-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ai-prompts-card{background:var(--gl);border:0.5px solid var(--b);border-radius:var(--r);padding:14px;flex:1;}
.ai-qbtn{display:block;width:100%;text-align:left;font-size:12px;padding:8px 11px;border-radius:10px;background:rgba(236,123,160,.08);border:0.5px solid rgba(236,123,160,.18);color:var(--ac);cursor:pointer;margin-bottom:6px;transition:background .15s;line-height:1.3;}
.ai-qbtn:hover{background:rgba(236,123,160,.18);}
.ai-qbtn:last-child{margin-bottom:0;}
.ai-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;background:var(--gl);border:0.5px solid var(--b);border-top:0.5px solid rgba(255,255,255,.16);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 64px rgba(0,0,0,.4);}
.ai-msgs{flex:1;overflow-y:auto;padding:20px 22px 12px;display:flex;flex-direction:column;gap:14px;min-height:0;}
.ai-msgs::-webkit-scrollbar{width:4px}.ai-msgs::-webkit-scrollbar-track{background:transparent}.ai-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.ai-table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:340px}
.ai-table th{text-align:left;padding:6px 12px;background:rgba(236,123,160,.12);color:var(--ac);font-weight:700;white-space:nowrap;border-bottom:1px solid rgba(236,123,160,.25)}
.ai-table td{padding:6px 12px;border-bottom:0.5px solid var(--b);font-family:'DM Mono',monospace;white-space:nowrap}
.ai-table tr:last-child td{border-bottom:none}
html.light .ai-table th{background:rgba(141,4,57,.1);color:#8d0439;border-bottom-color:rgba(141,4,57,.25)}
.ai-msg{display:flex;gap:10px;align-items:flex-start;}
.ai-msg.user{flex-direction:row-reverse;}
.ai-msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.ai-msg.bot .ai-msg-av{background:linear-gradient(135deg,var(--ac),#8d0439);color:#fff;}
.ai-msg.user .ai-msg-av{background:rgba(255,255,255,.12);color:var(--m);}
.ai-bubble{font-size:13.5px;line-height:1.6;padding:11px 15px;border-radius:16px;max-width:82%;word-break:break-word;}
.ai-msg.bot .ai-bubble{background:linear-gradient(135deg,rgba(236,123,160,.12) 0%,rgba(236,123,160,.07) 100%);border:0.5px solid rgba(236,123,160,.2);color:var(--t);border-radius:4px 16px 16px 16px;}
.ai-msg.user .ai-bubble{background:linear-gradient(135deg,#8d0439,#b1245f);color:#fff;border-radius:16px 4px 16px 16px;box-shadow:0 4px 16px rgba(141,4,57,.35);}
.ai-bubble b,.ai-bubble strong{color:#c4b5fd;font-weight:700;}
.ai-msg.user .ai-bubble strong{color:#fff;}
.ai-bubble code{font-family:'DM Mono',monospace;font-size:11.5px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px;}
.ai-bubble ul{margin:6px 0 6px 18px;padding:0;}
.ai-bubble li{margin:3px 0;}
.ai-bubble p{margin:0 0 6px;}
.ai-cursor{display:inline-block;width:2px;height:15px;background:var(--ac);margin-left:2px;vertical-align:text-bottom;animation:blink .7s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.ai-typing{display:flex;gap:5px;align-items:center;padding:12px 15px;}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);animation:bounce .9s ease-in-out infinite;}
.ai-typing span:nth-child(2){animation-delay:.15s;}
.ai-typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}
.ai-foot{flex-shrink:0;border-top:0.5px solid rgba(255,255,255,.07);padding:14px 18px 16px;}
.ai-inp-row{display:flex;gap:10px;align-items:flex-end;}
#ai-inp{flex:1;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.14);border-radius:14px;color:var(--t);font-size:13.5px;font-family:inherit;padding:11px 15px;resize:none;outline:none;line-height:1.45;max-height:120px;overflow-y:auto;transition:border-color .15s,background .15s;}
#ai-inp::placeholder{color:var(--d);}
#ai-inp:focus{border-color:rgba(236,123,160,.5);background:rgba(236,123,160,.05);}
#ai-send{width:40px;height:40px;border-radius:50%;background:var(--ac);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,transform .15s,background .15s;box-shadow:0 4px 14px rgba(236,123,160,.35);}
#ai-send:hover{transform:scale(1.08);background:#c04a72;}
#ai-send:disabled{opacity:.3;cursor:not-allowed;transform:none;}
@media(max-width:700px){.ai-sidebar{display:none;}.ai-page{height:auto;}}

// ═══ TOAST NOTIFICHE ════════════════════════════════════════════════════════
function toast(msg,type='ok',ms=3500){
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box);}
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span class="toast-dot"></span><span>${msg}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},ms);
}

// ═══ PERSISTENZA AUTOMATICA (IndexedDB) ═════════════════════════════════════
// I dataset caricati vengono salvati sul dispositivo: alla prossima apertura
// non serve ricaricare i file Excel.
const IDB_NAME='ottica-bonardi',IDB_STORE='datasets';
function idbOpen(){return new Promise((res,rej)=>{
  const q=indexedDB.open(IDB_NAME,1);
  q.onupgradeneeded=()=>q.result.createObjectStore(IDB_STORE);
  q.onsuccess=()=>res(q.result);
  q.onerror=()=>rej(q.error);
});}
function idbSet(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).put(v,k);
  tx.oncomplete=()=>{db.close();res();};
  tx.onerror=()=>{db.close();rej(tx.error);};
}));}
function idbGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
  q.onsuccess=()=>{db.close();res(q.result);};
  q.onerror=()=>{db.close();rej(q.error);};
}));}
function idbDel(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).delete(k);
  tx.oncomplete=()=>{db.close();res();};
  tx.onerror=()=>{db.close();rej(tx.error);};
}));}

let LOCAL_SAVED_AT=null,CLOUD_SAVED_AT=null,CLOUD_AVAILABLE=null;

// LIVE_CLI.byCode e LIVE_CLI_ANAG.byName sono indici di lookup ricostruibili
// dall'array sorgente: non li serializziamo (dimezza il peso dei dati).
const DATASET_KEYS=['mag','vend','acq','cli','cliAnag'];
function datasetValue(key){
  if(key==='mag') return LIVE_MAG;
  if(key==='vend') return LIVE_VEND;
  if(key==='acq') return LIVE_ACQ;
  if(key==='cli') return LIVE_CLI?{cliList:LIVE_CLI.cliList,totalCli:LIVE_CLI.totalCli,totalOrdini:LIVE_CLI.totalOrdini,hasOrders:LIVE_CLI.hasOrders,hasEta:LIVE_CLI.hasEta}:null;
  if(key==='cliAnag') return LIVE_CLI_ANAG?{list:LIVE_CLI_ANAG.list,total:LIVE_CLI_ANAG.total,hasEta:LIVE_CLI_ANAG.hasEta}:null;
  return null;
}
function applyDataset(key,v){
  if(v==null)return false;
  if(key==='mag'){LIVE_MAG=v;return true;}
  if(key==='vend'){LIVE_VEND=v;return true;}
  if(key==='acq'){LIVE_ACQ=v;return true;}
  if(key==='cli'){LIVE_CLI={...v,byCode:Object.fromEntries(v.cliList.map(c=>[c.cod,c]))};return true;}
  if(key==='cliAnag'){LIVE_CLI_ANAG={...v,byName:Object.fromEntries(v.list.map(c=>[normName(c.cog,c.nom),c]))};return true;}
  return false;
}
function snapshotMeta(){
  return {v:2,savedAt:new Date().toISOString(),
    names:{mag:UPLOAD_NAME,magShort:UPLOAD_NAME_SHORT,vend:UPLOAD_NAME_VEND,acq:UPLOAD_NAME_ACQ,cli:UPLOAD_NAME_CLI,cliAnag:UPLOAD_NAME_CLI_ANAG}};
}
function applyMeta(m){
  if(!m||!m.names)return;
  UPLOAD_NAME=m.names.mag||UPLOAD_NAME;UPLOAD_NAME_SHORT=m.names.magShort||UPLOAD_NAME_SHORT;
  UPLOAD_NAME_VEND=m.names.vend||UPLOAD_NAME_VEND;UPLOAD_NAME_ACQ=m.names.acq||UPLOAD_NAME_ACQ;
  UPLOAD_NAME_CLI=m.names.cli||UPLOAD_NAME_CLI;UPLOAD_NAME_CLI_ANAG=m.names.cliAnag||UPLOAD_NAME_CLI_ANAG;
}
// Formato locale (IndexedDB): un unico oggetto con tutti i dataset dedotti —
// va bene perché IndexedDB non ha il limite dei 25MB per valore del KV.
function snapshotData(){
  const s=snapshotMeta();
  DATASET_KEYS.forEach(k=>s[k]=datasetValue(k));
  return s;
}
function applySnapshot(s){
  if(!s)return false;
  let n=0;
  DATASET_KEYS.forEach(k=>{ if(applyDataset(k,s[k])) n++; });
  applyMeta(s);
  return n;
}
let PERSIST_T=null,LAST_CHANGED_KEY=null;
function persistData(silent){
  clearTimeout(PERSIST_T);
  const changedKey=LAST_CHANGED_KEY;LAST_CHANGED_KEY=null;
  PERSIST_T=setTimeout(async()=>{
    try{
      const s=snapshotData();
      await idbSet('snapshot',s);
      LOCAL_SAVED_AT=s.savedAt;
      if(!silent)toast('💾 Dati salvati sul dispositivo — non serve ricaricarli','ok');
    }catch(e){console.warn('persist failed',e);}
    // sincronizza automaticamente col cloud, come un vero backend — silenzioso
    // se il KV non è configurato (nessun fastidio finché non lo attivi). Se
    // sappiamo quale dataset è appena cambiato sincronizziamo solo quello
    // (molto più leggero), altrimenti risincronizziamo tutto.
    if(changedKey) cloudSaveOne(changedKey,true); else cloudSaveAll(true);
  },400);
}
async function restoreData(){
  try{
    const s=await idbGet('snapshot');
    const n=applySnapshot(s);
    if(n){
      LOCAL_SAVED_AT=s.savedAt;renderPage();
      toast(`✅ ${n} dataset ripristinati automaticamente (${fmtSavedAt(s.savedAt)})`,'ok',4500);
      return;
    }
  }catch(e){console.warn('restore failed',e);}
  // Nessun dato locale: prova il cloud, poi il dataset reale precaricato di fabbrica.
  try{
    const n=await cloudLoadAll(true);
    if(n){persistData(true);renderPage();
      toast(`☁️ ${n} dataset caricati dal cloud (${fmtSavedAt(CLOUD_SAVED_AT)})`,'ok',4500);
      return;}
  }catch(e){console.warn('cloud restore skipped',e);}
  try{
    let n=0;
    const metaR=await fetch('default-data/meta.json');
    if(metaR.ok) applyMeta(await metaR.json());
    for(const k of DATASET_KEYS){
      const r=await fetch(`default-data/${k}.json`);
      if(r.ok && applyDataset(k, await r.json())) n++;
    }
    if(n){renderPage();persistData(true);
      toast(`✅ Dati reali precaricati (${fmtN(n)} dataset) — Ottica Bonardi 3 sedi`,'ok',4500);
      cloudSaveAll(true); // semina il cloud al primo avvio, se il KV è configurato
    }
  }catch(e){console.warn('default data load skipped',e);}
}
async function clearSavedData(){
  try{await idbDel('snapshot');LOCAL_SAVED_AT=null;
    LIVE_MAG=LIVE_VEND=LIVE_ACQ=LIVE_CLI=LIVE_CLI_ANAG=null;
    UPLOAD_NAME=UPLOAD_NAME_VEND=UPLOAD_NAME_ACQ=UPLOAD_NAME_CLI=UPLOAD_NAME_CLI_ANAG=null;UPLOAD_NAME_SHORT='';
    renderPage();toast('🗑️ Dati locali eliminati','info');
  }catch(e){toast('Errore eliminazione: '+e.message,'err');}
}
const fmtSavedAt=iso=>{try{return new Date(iso).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};

// ═══ CLOUD SYNC (Cloudflare KV, una chiave per dataset via /api/data/<key>) ═
// Ogni dataset è salvato separatamente: sincronizzare un solo file appena
// caricato non richiede di rispedire tutti gli altri, e nessun valore KV
// rischia di superare il limite di 25MB anche con lo storico clienti intero.
// silent=true → sincronizzazione automatica in background: nessun toast se
// il KV non è ancora configurato (comportamento opzionale, non bloccante).
async function cloudPut(key,value){
  const r=await fetch(`/api/data/${key}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});
  const j=await r.json();
  if(!r.ok)throw new Error(j.hint||j.error||('HTTP '+r.status));
  return j;
}
async function cloudSaveAll(silent){
  try{
    if(!silent)toast('☁️ Salvataggio su Cloudflare…','info',2000);
    const active=DATASET_KEYS.filter(k=>datasetValue(k)!=null);
    let bytes=0;
    for(const k of active){ const j=await cloudPut(k,datasetValue(k)); bytes+=j.bytes; }
    await cloudPut('meta',snapshotMeta());
    CLOUD_SAVED_AT=new Date().toISOString();CLOUD_AVAILABLE=true;
    toast(silent?`☁️ Sincronizzato sul cloud — accessibile da ogni dispositivo`:`☁️ Salvato su cloud (${(bytes/1048576).toFixed(1)} MB, ${active.length} dataset) — accessibile da ogni dispositivo`,'ok',silent?2800:4500);
    if(!silent)renderPage();
  }catch(e){
    CLOUD_AVAILABLE=false;
    if(!silent)toast('⚠️ Cloud: '+e.message,'err',5000);
  }
}
// Sincronizza SOLO il dataset appena caricato: molto più leggero di un
// salvataggio completo, usato automaticamente dopo ogni singolo upload.
async function cloudSaveOne(key,silent){
  try{
    const v=datasetValue(key);if(v==null)return;
    await cloudPut(key,v);
    await cloudPut('meta',snapshotMeta());
    CLOUD_SAVED_AT=new Date().toISOString();CLOUD_AVAILABLE=true;
    if(!silent)toast(`☁️ ${key} sincronizzato sul cloud`,'ok',2500);
  }catch(e){
    CLOUD_AVAILABLE=false;
    if(!silent)toast('⚠️ Cloud: '+e.message,'err',5000);
  }
}
async function cloudLoadAll(quiet){
  const r=await fetch('/api/data');
  if(r.status===404) throw new Error('Nessun dato salvato sul cloud');
  const j=await r.json();
  if(!r.ok) throw new Error(j.hint||j.error||('HTTP '+r.status));
  if(j.meta) applyMeta(j.meta);
  const present=DATASET_KEYS.filter(k=>j.present&&j.present[k]);
  let n=0;
  await Promise.all(present.map(async k=>{
    const kr=await fetch(`/api/data/${k}`);
    if(kr.ok && applyDataset(k, await kr.json())) n++;
  }));
  if(n) CLOUD_SAVED_AT=j.meta?.savedAt||new Date().toISOString();
  return n;
}
async function cloudLoad(){
  try{
    toast('☁️ Caricamento dal cloud…','info',2000);
    const n=await cloudLoadAll(false);
    if(!n)throw new Error('Nessun dataset trovato sul cloud');
    persistData(true);
    renderPage();
    toast(`☁️ ${n} dataset caricati dal cloud (${fmtSavedAt(CLOUD_SAVED_AT)})`,'ok',4500);
  }catch(e){toast('⚠️ Cloud: '+e.message,'err',5000);}
}
async function cloudDelete(){
  try{
    const r=await fetch('/api/data',{method:'DELETE'});
    const j=await r.json();
    if(!r.ok)throw new Error(j.hint||j.error);
    CLOUD_SAVED_AT=null;renderPage();toast('🗑️ Dati cloud eliminati','info');
  }catch(e){toast('⚠️ Cloud: '+e.message,'err');}
}
window.cloudSave=()=>cloudSaveAll(false);window.cloudLoad=cloudLoad;window.cloudDelete=cloudDelete;window.clearSavedData=clearSavedData;

// ═══ EXCEL PARSER ═══════════════════════════════════════════════════════════
function parseExcel(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {raw:false, dateNF:'yyyy-mm-dd'});
      if(!raw.length) throw new Error("File vuoto");
      processUpload(raw, file.name);
    } catch(err){
      alert("Errore lettura file: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function processUpload(raw, name){
  const VALID_TYPES = ["Montature vista","Occhiali sole","montature vista","occhiali sole"];
  // Filtra e normalizza
  const rows = raw.filter(r => {
    const tp = String(r['Tipo prodotto']||r['tipo prodotto']||'').trim();
    return VALID_TYPES.some(v=>tp.toLowerCase()===v.toLowerCase());
  });
  if(!rows.length){ alert("Nessun prodotto valido trovato. Verificare le colonne: Tipo prodotto = 'Montature vista' o 'Occhiali sole'"); return; }

  // Aggrega per filiale+marchio+modello+tipo+fornitore
  const agg = {};
  rows.forEach(r => {
    const fil = String(r['Filiale']||r['filiale']||'').trim().toUpperCase().replace(/^NEGOZIO\s*/i,'');
    const mar = String(r['Marchio']||r['marchio']||'').trim();
    const mod = String(r['Modello']||r['modello']||'').trim();
    const tp  = String(r['Tipo prodotto']||'').trim();
    const forn= cleanSupplierName(r['Fornitore']||'');
    const bc  = String(r['Codice a barre']||r['Barcode']||r['EAN']||r['GTIN']||r['barcode']||r['ean']||'').trim();
    const qty = parseFloat(String(r['Quantità magazzino']||r['Quantita magazzino']||0).replace(',','.')) || 0;
    const val = parseFloat(String(r['Valore magazzino']||0).replace(',','.')) || 0;
    const cos = parseFloat(String(r['Costo medio']||r['Prezzo acquisto']||0).replace(',','.')) || 0;
    let dt = r['Data entrata magazzino']||r['Data entrata']||r['Data Entrata']||r['Data ult. acq']||r['Data ult acq']||r['Data ultimo acquisto']||r['DataEntrata']||r['data_entrata']||'';
    if(dt instanceof Date) dt = dt.toISOString().slice(0,10);
    else if(typeof dt === 'number') dt = excelSerialToISO(dt);
    else if(typeof dt === 'string') dt = normalizeDateValue(dt);
    const cat = tp.toLowerCase().includes('vista') ? 'M' : 'S';
    // Se barcode presente lo usa come chiave univoca (1 SKU = 1 riga per filiale)
    const key = bc ? `${bc}|${fil}` : `${fil}|${mar}|${mod}|${cat}|${forn}`;
    if(!agg[key]) agg[key]={f:fil,m:mar.slice(0,22),mod:mod.slice(0,18),cat,forn:forn||'Senza fornitore',bc,q:0,v:0,c:0,cn:0,d:'',mesi:0,anno:0,pri:'O'};
    agg[key].q += qty; agg[key].v += val; agg[key].c += cos; agg[key].cn++;
    if(dt && (!agg[key].d || dt > agg[key].d)) agg[key].d = dt;
  });

  const allRows = Object.values(agg).map(r => {
    r.v = Math.round(r.v*100)/100;
    r.c = Math.round((r.c/r.cn)*100)/100;
    if(r.d){
      const yr=parseInt(r.d.slice(0,4)),mo=parseInt(r.d.slice(5,7))||1;
      r.mesi = Math.max(0,(2026-yr)*12+(5-mo));
      r.anno = yr;
      r.pri = yr<2020?'U':yr<2023?'A':yr<2024?'M':'O';
    }
    return r;
  });

  // Ricalcola MAG struttura
  const byBrand={}, byForn={}, catA={}, catB={};
  let vA=0,vB=0,pA=0,pB=0;
  allRows.forEach(r => {
    if(r.f==='A'){vA+=r.v;pA+=r.q;} else {vB+=r.v;pB+=r.q;}
    byBrand[r.m]=(byBrand[r.m]||0)+r.v;
    byForn[r.forn]=(byForn[r.forn]||0)+r.v;
    const ck=r.cat==='M'?'Montature':'Sole';
    if(r.f==='A')catA[ck]=(catA[ck]||0)+r.v; else catB[ck]=(catB[ck]||0)+r.v;
  });
  const topBrand=Object.entries(byBrand).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const topForn=Object.entries(byForn).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Smaltimento: prodotti comuni A e B
  const aMap={},bMap={};
  allRows.filter(r=>r.f==='A').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat; aMap[k]=(aMap[k]||{...r,qA:0});aMap[k].qA+=r.q;});
  allRows.filter(r=>r.f==='B').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat; bMap[k]=(bMap[k]||{...r,qB:0});bMap[k].qB+=r.q;});
  const smalt=Object.keys(aMap).filter(k=>bMap[k]).map(k=>({m:aMap[k].m,mod:aMap[k].mod,cat:aMap[k].cat==='M'?'Montature vista':'Occhiali sole',qA:aMap[k].qA,qB:bMap[k].qB,c:aMap[k].c})).sort((a,b)=>(b.qA+b.qB)-(a.qA+a.qB)).slice(0,40);

  LIVE_MAG = {
    kpi:{A:{pezzi:pA,valore:Math.round(vA*100)/100},B:{pezzi:pB,valore:Math.round(vB*100)/100},C:{pezzi:0,valore:0}},
    brand:topBrand.map(x=>({n:x[0],v:Math.round(x[1]*100)/100})),
    forn:topForn.map(x=>({n:x[0],v:Math.round(x[1]*100)/100})),
    smalt,
    cat:{A:{...catA},B:{...catB}},
    rows:allRows.sort((a,b)=>b.v-a.v)
  };

  // Ricalcola AG
  const byAnno={};
  allRows.filter(r=>r.anno>0).forEach(r=>{const y=String(r.anno);if(!byAnno[y])byAnno[y]={v:0,n:0,pz:0};byAnno[y].v+=r.v;byAnno[y].n++;byAnno[y].pz+=r.q;});
  Object.keys(byAnno).forEach(k=>{byAnno[k].v=Math.round(byAnno[k].v*100)/100;});
  const def={v:0,n:0,pz:0};
  const stats={
    U:allRows.filter(r=>r.anno>0&&r.anno<2020).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    A:allRows.filter(r=>r.anno>=2020&&r.anno<2023).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    M:allRows.filter(r=>r.anno>=2023&&r.anno<2024).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    O:allRows.filter(r=>r.anno>=2024).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
  };
  ['U','A','M','O'].forEach(k=>{stats[k].v=Math.round(stats[k].v*100)/100;});
  LIVE_AG = {rows:allRows.filter(r=>r.anno>0).sort((a,b)=>a.anno-b.anno||a.d.localeCompare(b.d)), byAnno, stats};

  UPLOAD_NAME = name;
  UPLOAD_NAME_SHORT = name.length>30 ? name.slice(0,27)+'…' : name;
  Object.assign(ST,{magPage:0,agPage:0,magBrand:'all',magSed:'all',magCat:'all',magForn:'all',magDateFrom:'',magDateTo:'',magFocus:'all',magSearch:'',agPri:'all',agSed:'all',agSearch:''});
  renderPage();
  LAST_CHANGED_KEY='mag';persistData();
}

// ═══ VENDITE PARSER ═════════════════════════════════════════════════════════
function parseVendite(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {raw:true});
      if(!raw.length) throw new Error("File vuoto");
      processVendite(raw, file.name);
    } catch(err){ alert("Errore lettura vendite: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function processVendite(raw, name){
  const rows = raw.filter(r => (r['Tipo operazione']||'').trim() === 'VEN');

  // Righe compatte per filtri dinamici
  const compactRows = rows.map(r => {
    let dt = r['data di vendita']||r['Data']||r['Data vendita']||r['Data di vendita'];
    if(dt instanceof Date){
      // usa ora locale per evitare shift UTC
      const p=n=>String(n).padStart(2,'0');
      dt=`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
    } else if(typeof dt==='number') dt=excelSerialToISO(dt);
    else if(typeof dt==='string') dt=normalizeDateValue(dt);
    else dt=null;
    // scarta date palesemente errate
    if(dt && parseInt(dt.slice(0,4)) < 2019) dt=null;
    const yr = dt ? parseInt(dt.slice(0,4)) : null;
    const mo = dt ? parseInt(dt.slice(5,7)) : null;
    return {
      tp:  (r['Tipo Prodotto']||'').trim(),
      mar: (r['Marchio']||'').trim(),
      fil: (r['Filiale']||'').trim().toUpperCase(),
      op:  (r['Operatore']||'').trim(),
      pz:  parseFloat(r['Quantità']||1)||1,
      val: parseFloat(r['Prezzo consigliato']||r['Listino vendita']||0)||0,
      acq: parseFloat(r['Prezzo acquisto']||0)||0,
      cli: (r['Codice cliente']||'').trim(),
      mod: (r['Modello']||r['Articolo']||r['Descrizione']||'').trim(),
      diam: (r['Diametro']||r['Diametro mm']||r['Ø']||'').toString().trim(),
      dt, yr, mo
    };
  });

  const clienti = new Set(compactRows.map(r=>r.cli).filter(Boolean));
  const allMarchi = [...new Set(compactRows.filter(r=>r.tp==='Montature vista'||r.tp==='Occhiali sole').map(r=>r.mar).filter(Boolean))].sort();
  const allTipi   = [...new Set(compactRows.map(r=>r.tp).filter(Boolean))].sort();

  const datedCount = compactRows.filter(r=>r.dt).length;
  LIVE_VEND = {
    rows: compactRows,
    clienti: clienti.size,
    allMarchi,
    allTipi,
    hasDate: datedCount > 100,
    datedCount
  };
  UPLOAD_NAME_VEND = name.length>30 ? name.slice(0,27)+'…' : name;
  renderPage();
  LAST_CHANGED_KEY='vend';persistData();
}

function filtVendRows(){
  if(!LIVE_VEND) return [];
  let r = LIVE_VEND.rows;
  if(ST.vendFil!=='all')  r = r.filter(x=>x.fil===ST.vendFil);
  if(ST.vendTp==='MV')    r = r.filter(x=>x.tp==='Montature vista');
  else if(ST.vendTp==='OS') r = r.filter(x=>x.tp==='Occhiali sole');
  else if(ST.vendTp==='FR') r = r.filter(x=>x.tp==='Montature vista'||x.tp==='Occhiali sole');
  else if(ST.vendTp==='LE') r = r.filter(x=>x.tp.startsWith('Lenti'));
  else if(ST.vendTp!=='all') r = r.filter(x=>x.tp===ST.vendTp);
  if(ST.vendMar!=='all')  r = r.filter(x=>x.mar===ST.vendMar);
  if(ST.vendAnno&&ST.vendAnno!=='all'){
    if(ST.vendAnno==='YTD')      r = r.filter(x=>x.yr===CY);
    else if(ST.vendAnno==='last12'){ const cut=toISO(new Date(Date.now()-365*86400000)); r = r.filter(x=>x.dt&&x.dt>=cut); }
    else r = r.filter(x=>x.yr===parseInt(ST.vendAnno));
  }
  return r;
}

function vendKPI(rows){
  const totPz  = rows.reduce((a,r)=>a+r.pz,0);
  // Margine attendibile solo per frame (val>0 AND acq>0)
  const frRows = rows.filter(r=>(r.tp==='Montature vista'||r.tp==='Occhiali sole')&&r.val>0&&r.acq>0);
  const totVal = frRows.reduce((a,r)=>a+r.val,0);
  const totAcq = frRows.reduce((a,r)=>a+r.acq,0);
  const marg   = totVal - totAcq;
  const pctM   = totVal>0 ? marg/totVal*100 : 0;
  // Fatturato listino totale frame (anche senza acquisto)
  const totValAll = rows.filter(r=>r.tp==='Montature vista'||r.tp==='Occhiali sole').reduce((a,r)=>a+r.val,0);
  const clienti = new Set(rows.map(r=>r.cli).filter(Boolean)).size;
  return {totPz:Math.round(totPz), totVal:Math.round(totValAll), marg:Math.round(marg), pctM:Math.round(pctM), clienti};
}

function brandBreakdown(rows, n=10){
  const m={};
  rows.filter(r=>r.tp==='Montature vista'||r.tp==='Occhiali sole').forEach(r=>{
    if(!r.mar) return;
    if(!m[r.mar]) m[r.mar]={pz:0,val:0,acq:0};
    m[r.mar].pz+=r.pz; m[r.mar].val+=r.val; m[r.mar].acq+=r.acq;
  });
  return Object.entries(m).sort((a,b)=>b[1].val-a[1].val).slice(0,n).map(([nm,v])=>({
    n:nm, pz:Math.round(v.pz), val:Math.round(v.val), acq:Math.round(v.acq),
    marg:Math.round(v.val-v.acq), pctM:v.val>0?Math.round((v.val-v.acq)/v.val*100):0
  }));
}

function tipoBreakdown(rows){
  const m={};
  rows.forEach(r=>{
    const k=r.tp||'Altro';
    if(!m[k]) m[k]={pz:0,val:0};
    m[k].pz+=r.pz;
    if(r.tp==='Montature vista'||r.tp==='Occhiali sole') m[k].val+=r.val;
  });
  return Object.entries(m).sort((a,b)=>b[1].pz-a[1].pz).map(([n,v])=>({n,pz:Math.round(v.pz),val:Math.round(v.val)}));
}

// ═══ ACQUISTI PARSER ════════════════════════════════════════════════════════
function parseAcquisti(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {raw:false, dateNF:'yyyy-mm-dd'});
      if(!raw.length) throw new Error("File vuoto");
      processAcquisti(raw, file.name);
    } catch(err){ alert("Errore lettura acquisti: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function processAcquisti(raw, name){
  const byAnno={}, byTipo={};
  let totPz=0, totVal=0, pzA=0, valA=0, pzB=0, valB=0;
  const rows=[];
  raw.forEach(r => {
    let dt = r['Data movimento'];
    if(dt instanceof Date) dt = dt.toISOString().slice(0,10);
    else if(typeof dt === 'string') dt = normalizeDateValue(dt);
    const yr = dt ? dt.slice(0,4) : null;
    const mo = dt ? parseInt(dt.slice(5,7)) : null;
    const tp = (r['Tipo Prodotto']||'').trim();
    const fil= (r['Filiale']||'').trim().toUpperCase();
    const pz = parseFloat(String(r['Quantità']||0).replace(',','.')) || 0;
    const val= parseFloat(String(r['ValoreAcq']||0).replace(',','.')) || 0;
    if(yr){ if(!byAnno[yr]) byAnno[yr]={pz:0,val:0,refs:0}; byAnno[yr].pz+=pz; byAnno[yr].val+=val; byAnno[yr].refs++; }
    if(tp){ if(!byTipo[tp]) byTipo[tp]={pz:0,val:0}; byTipo[tp].pz+=pz; byTipo[tp].val+=val; }
    totPz+=pz; totVal+=val;
    if(fil==='A'){ pzA+=pz; valA+=val; } else if(fil==='B'){ pzB+=pz; valB+=val; }
    if(dt && yr) rows.push({dt, yr:parseInt(yr), mo, pz, val, fil, tp});
  });
  Object.keys(byAnno).forEach(k=>{ byAnno[k].val=Math.round(byAnno[k].val); byAnno[k].pz=Math.round(byAnno[k].pz); });
  LIVE_ACQ = {
    totPz: Math.round(totPz), totVal: Math.round(totVal),
    byAnno, rows,
    byTipo: Object.entries(byTipo).sort((a,b)=>b[1].val-a[1].val).map(([n,v])=>({n,pz:Math.round(v.pz),val:Math.round(v.val)})),
    byFiliale: {A:{pz:Math.round(pzA),val:Math.round(valA)},B:{pz:Math.round(pzB),val:Math.round(valB)}}
  };
  UPLOAD_NAME_ACQ = name.length>30 ? name.slice(0,27)+'…' : name;
  renderPage();
  LAST_CHANGED_KEY='acq';persistData();
}

// ═══ ANAGRAFICA CLIENTI PARSER ══════════════════════════════════════════════
function parseCli(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length) throw new Error("File vuoto");

      // Detect format: orders file (has 'codice scheda cliente') or simple anagrafica
      const hasOrdini=Object.keys(rows[0]).some(k=>k.toLowerCase().includes('scheda')||k.toLowerCase().includes('consegna')||k.toLowerCase().includes('modello'));

      if(hasOrdini){
        // ── Clienti.xlsx: storico ordini ──────────────────────────────────────
        const byCode={};
        rows.forEach(r=>{
          const cod=(r['codice scheda cliente']||r['Codice cliente']||r['Codice']||'').toString().trim();
          if(!cod)return;
          if(!byCode[cod]){
            const cog=(r['Cognome']||'').trim();const nom=(r['Nome']||'').trim();const cog2=(r['Cognome 2']||'').trim();
            byCode[cod]={cod,nome:[cog,cog2,nom].filter(Boolean).join(' ')||cod,
              matchKey:normName(cog,nom),
              filiale:(r['Filiale']||'').trim(),
              nOrdini:0,nVista:0,nSole:0,nLenti:0,
              brands:{},lenti:{},fornitori:{},
              orders:[],totSpeso:0
            };
          }
          const c=byCode[cod];
          let dt='';
          const rawDt=r['Data consegna']||r['Data']||'';
          if(rawDt instanceof Date)dt=rawDt.toISOString().slice(0,10);
          else if(typeof rawDt==='string'&&rawDt.length>=8)dt=rawDt.slice(0,10);
          const modello=(r['Marca modello']||'').trim();
          const isVista=modello.toUpperCase().includes('VISTA');
          const isSole=modello.toUpperCase().includes('SOLE');
          const lenteDx=(r['Prodotto lente Dx']||'').trim();
          const lenteSx=(r['Prodotto lente Sx']||'').trim();
          const marcaDx=(r['Marca lente Dx']||'').trim();
          const marcaSx=(r['Marca lente Sx']||'').trim();
          const fornituraDx=(r['Fornitore Dx']||'').trim();
          const fornitore=(r['Fornitore']||'').trim();
          // Sanity clamp: un ordine di ottica reale non supera qualche migliaio
          // di euro — valori assurdi indicano dati sporchi nel file sorgente
          // (es. un codice/telefono finito per errore nella colonna Totale).
          let totale=parseFloat(r['Totale']||r['Importo totale']||0)||0;
          if(totale>50000||totale<0)totale=0;
          const tipo=parseInt(r['Tipo fornitura']||0)||0;
          // estrai brand dalla prima parte del modello
          const brand=modello.split(/\s+/).slice(0,tipo>=2?2:2).join(' ').replace(/\s*(VISTA|SOLE)$/i,'').trim();
          if(isVista)c.nVista++;
          if(isSole)c.nSole++;
          if(lenteDx||lenteSx)c.nLenti++;
          if(brand&&brand.length>1){c.brands[brand]=(c.brands[brand]||0)+1;}
          if(marcaDx){c.lenti[marcaDx]=(c.lenti[marcaDx]||0)+1;}
          else if(marcaSx){c.lenti[marcaSx]=(c.lenti[marcaSx]||0)+1;}
          if(fornitore)c.fornitori[fornitore]=(c.fornitori[fornitore]||0)+1;
          c.totSpeso+=totale;c.nOrdini++;
          if(c.orders.length<30)c.orders.push({dt,modello,tipo,lenteDx,lenteSx,marcaDx:marcaDx||marcaSx,fornitore:fornituraDx||fornitore,tot:totale});
        });
        const cliList=Object.values(byCode).map(c=>{
          c.orders.sort((a,b)=>a.dt>b.dt?-1:1);
          c.lastDt=c.orders[0]?.dt||'';
          c.firstDt=[...c.orders].reverse()[0]?.dt||'';
          c.brandFav=Object.entries(c.brands).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
          c.lenteFav=Object.entries(c.lenti).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
          c.totSpeso=Math.round(c.totSpeso);
          delete c.brands;delete c.lenti;delete c.fornitori;
          return c;
        });
        LIVE_CLI={byCode,cliList:cliList.sort((a,b)=>b.nOrdini-a.nOrdini),totalCli:cliList.length,totalOrdini:rows.length,hasOrders:true,hasEta:false};
      } else {
        // ── Anagrafica semplice (Data nascita / Sesso) ────────────────────────
        const arr=rows.map(r=>{
          const cod=(r['Codice cliente']||r['CodiceCliente']||r['Codice']||'').toString().trim();
          const nome=(r['Cognome Nome']||r['Cognome']||r['Nome']||'').toString().trim();
          let rawN=r['Data nascita']||r['DataNascita']||r['Anno nascita']||'';
          let nascita=0;
          if(rawN instanceof Date)nascita=rawN.getFullYear();
          else if(typeof rawN==='string'){const m=rawN.match(/(\d{4})/);if(m)nascita=parseInt(m[1]);}
          else if(typeof rawN==='number')nascita=rawN>1900&&rawN<2020?rawN:0;
          const sesso=(r['Sesso']||'').toString().trim().toUpperCase().slice(0,1);
          return{cod,nome,nascita,sesso};
        }).filter(r=>r.cod&&r.nascita>1900&&r.nascita<2020);
        const byCode=Object.fromEntries(arr.map(c=>[c.cod,c]));
        LIVE_CLI={byCode,cliList:arr,totalCli:arr.length,hasOrders:false,hasEta:true};
      }
      UPLOAD_NAME_CLI=file.name.length>30?file.name.slice(0,27)+'…':file.name;
      renderPage();
      LAST_CHANGED_KEY='cli';persistData();
    }catch(err){alert('Errore lettura clienti: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

// Chiave di match nome cliente (Cognome + Nome, normalizzata) usata per

function parseCliAnag(file){

        };
        if(!byName[key]) byName[key]=rec;
        list.push(rec);
      });

      LAST_CHANGED_KEY='cliAnag';persistData();

const fmt=n=>Math.round(n).toLocaleString("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:0});

const fmtShortPz=n=>{n=Math.round(n);if(n>=1000)return(n/1000).toFixed(1).replace('.',',')+'k';return n.toLocaleString("it-IT");}
const fatt=arr=>arr.reduce((a,v)=>a+v.tot,0);

const dLabel=(c,p)=>{if(!p)return null;const d=Math.round((c-p)/p*100);return{d,cls:d>=0?"up":"dn",lbl:(d>=0?"↑":"↓")+Math.abs(d)+"%"};};

// ── RETENTION (condivisa tra Overview e Clienti) ──────────────────────────
// Raggruppa le vendite per cliente e classifica Attivo/A rischio/Perso/Nuovo
// in base a quanto tempo è passato dall'ultima visita, con soglia in giorni.
function computeRetention(retDays,sedeFilter){
  if(!LIVE_VEND||!LIVE_VEND.hasDate) return {retClients:[],nAttivi:0,nRischio:0,nPersi:0,nNuovi:0,nTot:0};
  const now=new Date();
  const srcRows=(sedeFilter&&sedeFilter!=='agg'&&sedeFilter!=='split')?LIVE_VEND.rows.filter(r=>r.fil===sedeFilter):LIVE_VEND.rows;
  const byCode={};
  srcRows.forEach(r=>{
    if(!r.cli||!r.dt)return;
    if(!byCode[r.cli])byCode[r.cli]={cli:r.cli,totVal:0,totPz:0,nLenti:0,nSole:0,nVista:0,dates:new Set(),lastDt:'',firstDt:'9999'};
    const b=byCode[r.cli];
    b.totVal+=r.val;b.totPz+=r.pz;
    b.dates.add(r.dt);
    if(r.dt>b.lastDt)b.lastDt=r.dt;
    if(r.dt<b.firstDt)b.firstDt=r.dt;
    if(r.tp){if(r.tp.startsWith('Lenti'))b.nLenti+=r.pz;else if(r.tp==='Occhiali sole')b.nSole+=r.pz;else if(r.tp==='Montature vista')b.nVista+=r.pz;}
  });
  const retClients=Object.values(byCode).map(b=>{
    const nVisits=b.dates.size;
    const daysSince=b.lastDt?Math.round((now-new Date(b.lastDt))/86400000):9999;
    let status;
    if(nVisits===1)status='nuovo';
    else if(daysSince<=retDays/2)status='attivo';
    else if(daysSince<=retDays)status='rischio';
    else status='perso';
    return{cli:b.cli,totVal:Math.round(b.totVal),totPz:b.totPz,nLenti:b.nLenti,nSole:b.nSole,nVista:b.nVista,nVisits,daysSince,status,lastDt:b.lastDt,firstDt:b.firstDt};
  });
  return{
    retClients,
    nAttivi:retClients.filter(c=>c.status==='attivo').length,
    nRischio:retClients.filter(c=>c.status==='rischio').length,
    nPersi:retClients.filter(c=>c.status==='perso').length,
    nNuovi:retClients.filter(c=>c.status==='nuovo').length,
    nTot:retClients.length
  };
}

// ── DATE / KPI HELPERS ────────────────────────────────────────────────────────
function toISO(d){return d.toISOString().slice(0,10);}
function acqRange(rows,from,to){let val=0,pz=0;for(const r of rows){if(r.dt>=from&&r.dt<=to){val+=r.val;pz+=r.pz;}}return{val:Math.round(val),pz:Math.round(pz)};}
// Filtra le righe in base al selettore sede della sidebar (Aggregate/Per sede/A/B/C).
// "agg" e "split" mostrano il totale combinato; una sede specifica filtra su r.fil.
function sedeRows(rows){
  if(!rows||ST.sedeMode==='agg'||ST.sedeMode==='split')return rows;
  return rows.filter(r=>r.fil===ST.sedeMode);
}
function isoWeekKey(dtStr){
  const d=new Date(dtStr);d.setHours(0,0,0,0);
  const dow=d.getDay()||7;d.setDate(d.getDate()-dow+1);
  const y=d.getFullYear();
  const jan4=new Date(y,0,4);const startW1=new Date(jan4);startW1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  const wn=Math.round((d-startW1)/604800000)+1;
  return `${y}-W${String(wn).padStart(2,'0')}`;
}
function acqKPIs(){
  if(!LIVE_ACQ||!LIVE_ACQ.rows) return null;
  const rows=sedeRows(LIVE_ACQ.rows);
  const now=new Date();
  const today=toISO(now);
  const moNum=CM+1; // 1-indexed
  const moStr=String(moNum).padStart(2,'0');
  const daysInMoCY=new Date(CY,moNum,0).getDate();
  const daysInMoPY=new Date(CY-1,moNum,0).getDate();
  // YTD
  const ytdFrom=`${CY}-01-01`;
  const ytdToPY=`${CY-1}-${today.slice(5)}`;
  const ytd=acqRange(rows,ytdFrom,today);
  const ytdPY=acqRange(rows,`${CY-1}-01-01`,ytdToPY);
  // Month
  const moFrom=`${CY}-${moStr}-01`;
  const moFromPY=`${CY-1}-${moStr}-01`;
  const mo=acqRange(rows,moFrom,today);
  const moPY=acqRange(rows,moFromPY,`${CY-1}-${moStr}-${String(daysInMoPY).padStart(2,'0')}`);
  // Week
  const dow=now.getDay()||7;
  const monThis=new Date(now);monThis.setDate(now.getDate()-dow+1);monThis.setHours(0,0,0,0);
  const monPrev=new Date(monThis);monPrev.setDate(monThis.getDate()-7);
  const sunPrev=new Date(monThis);sunPrev.setDate(monThis.getDate()-1);
  const wk=acqRange(rows,toISO(monThis),today);
  const wkPrev=acqRange(rows,toISO(monPrev),toISO(sunPrev));
  const daysLeft=daysInMoCY-now.getDate();
  return{ytd,ytdPY,mo,moPY,wk,wkPrev,daysLeft,moNum,moStr,moFrom,today};
}
function acqTrend(step,range){
  if(!LIVE_ACQ||!LIVE_ACQ.rows) return{labels:[],vals:[],pzs:[]};
  const rows=sedeRows(LIVE_ACQ.rows);
  const agg={};
  const now=new Date();
  if(step==='A'){
    rows.forEach(r=>{const k=String(r.yr);if(!agg[k])agg[k]={val:0,pz:0};agg[k].val+=r.val;agg[k].pz+=r.pz;});
    const keys=Object.keys(agg).sort();
    return{labels:keys,vals:keys.map(k=>Math.round(agg[k].val)),pzs:keys.map(k=>Math.round(agg[k].pz))};
  }
  if(step==='M'){
    const months=range||48;
    const cut=new Date(now);cut.setMonth(cut.getMonth()-(months-1));cut.setDate(1);
    const cutStr=toISO(cut).slice(0,7);
    rows.forEach(r=>{const k=r.dt.slice(0,7);if(k<cutStr)return;if(!agg[k])agg[k]={val:0,pz:0};agg[k].val+=r.val;agg[k].pz+=r.pz;});
    const keys=Object.keys(agg).sort();
    return{labels:keys.map(k=>{const[y,m]=k.split('-');return MESI[parseInt(m)-1]+"'"+y.slice(2);}),vals:keys.map(k=>Math.round(agg[k].val)),pzs:keys.map(k=>Math.round(agg[k].pz))};
  }
  if(step==='W'){
    const weeks=range||52;
    const cut=new Date(now);cut.setDate(cut.getDate()-7*(weeks-1));
    const cutStr=toISO(cut);

function vendRange(rows, from, to){

function vendKPIs(){
  if(!LIVE_VEND||!LIVE_VEND.hasDate) return null;
  const frRows=sedeRows(LIVE_VEND.rows).filter(r=>r.tp==='Montature vista'||r.tp==='Occhiali sole');
  const now=new Date(); const today=toISO(now);
  const moNum=CM+1; const moStr=String(moNum).padStart(2,'0');
  const daysInMoPY=new Date(CY-1,moNum,0).getDate();
  const daysInMoCY=new Date(CY,moNum,0).getDate();
  const ytd=vendRange(frRows,`${CY}-01-01`,today);
  const ytdPY=vendRange(frRows,`${CY-1}-01-01`,`${CY-1}-${today.slice(5)}`);
  const mo=vendRange(frRows,`${CY}-${moStr}-01`,today);
  // pari data: stesso giorno del mese in anno precedente (non mese intero)
  const todayDay=now.getDate();
  const moPYDay=String(Math.min(todayDay,daysInMoPY)).padStart(2,'0');
  const moPY=vendRange(frRows,`${CY-1}-${moStr}-01`,`${CY-1}-${moStr}-${moPYDay}`);
  // La settimana è ancorata all'ultima data presente nei dati (non a "oggi"):
  // se l'export è più vecchio della settimana corrente, evita di mostrare
  // sempre 0 solo perché il calendario è avanzato oltre i dati disponibili.
  const lastDataDt=frRows.reduce((mx,r)=>r.dt&&r.dt>mx?r.dt:mx,'');
  const wkAnchor=lastDataDt?new Date(lastDataDt):now;
  const dow=wkAnchor.getDay()||7;
  const monThis=new Date(wkAnchor);monThis.setDate(wkAnchor.getDate()-dow+1);monThis.setHours(0,0,0,0);
  const monPrev=new Date(monThis);monPrev.setDate(monThis.getDate()-7);
  const sunPrev=new Date(monThis);sunPrev.setDate(monThis.getDate()-1);
  const wk=vendRange(frRows,toISO(monThis),lastDataDt||today);
  const wkPrev=vendRange(frRows,toISO(monPrev),toISO(sunPrev));
  // KPI periodo selezionato (box 1)
  const periodo=ST.ovPeriodo||'YTD';
  const qRanges={Q1:[`${CY}-01-01`,`${CY}-03-31`],Q2:[`${CY}-04-01`,`${CY}-06-30`],Q3:[`${CY}-07-01`,`${CY}-09-30`],Q4:[`${CY}-10-01`,`${CY}-12-31`]};
  const qRangesPY={Q1:[`${CY-1}-01-01`,`${CY-1}-03-31`],Q2:[`${CY-1}-04-01`,`${CY-1}-06-30`],Q3:[`${CY-1}-07-01`,`${CY-1}-09-30`],Q4:[`${CY-1}-10-01`,`${CY-1}-12-31`]};
  let per,perPY,perLabel;
  if(periodo==='MTD'){per=mo;perPY=moPY;perLabel=`${MESI[CM]} ${CY}`;}

  else if(periodo==='PY'){per=vendRange(frRows,`${CY-1}-01-01`,`${CY-1}-12-31`);perPY=vendRange(frRows,`${CY-2}-01-01`,`${CY-2}-12-31`);perLabel=`${CY-1}`;}
  else{per=ytd;perPY=ytdPY;perLabel='YTD';}
  const moFullPY=vendRange(frRows,`${CY-1}-${moStr}-01`,`${CY-1}-${moStr}-${String(daysInMoPY).padStart(2,'0')}`);
  return{ytd,ytdPY,mo,moPY,moFullPY,wk,wkPrev,daysLeft:daysInMoCY-now.getDate(),per,perPY,perLabel};

  }

    rows.forEach(r=>{if(!r.dt||r.dt<cutStr)return;const k=isoWeekKey(r.dt);if(!agg[k])agg[k]={val:0,pz:0};agg[k].val+=r.val;agg[k].pz+=r.pz;});

  }
  if(step==='D'){
    const days=range||90;
    const cut=new Date(now);cut.setDate(cut.getDate()-(days-1));const cutStr=toISO(cut);
    rows.forEach(r=>{if(!r.dt||r.dt<cutStr)return;if(!agg[r.dt])agg[r.dt]={val:0,pz:0};agg[r.dt].val+=r.val;agg[r.dt].pz+=r.pz;});

function cleanSupplierName(v){
  return String(v||'').replace(/\s+/g,' ').trim();

function excelSerialToISO(n){
  if(!n||n<25569||n>60000) return '';
  const d=new Date(Math.round((n-25569)*86400000));
  return isNaN(d.getTime())?'':d.toISOString().slice(0,10);
}
function normalizeDateValue(v){
  if(!v) return '';
  const s=String(v).trim();
  // yyyy-mm-dd già corretto
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // formato italiano dd/mm/yyyy o dd-mm-yyyy o dd.mm.yyyy
  const mIT=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(mIT) return `${mIT[3]}-${mIT[2].padStart(2,'0')}-${mIT[1].padStart(2,'0')}`;
  // formato corto dd/mm/yy
  const mIT2=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/);
  if(mIT2){const yr=parseInt(mIT2[3])+(parseInt(mIT2[3])<=30?2000:1900);return `${yr}-${mIT2[2].padStart(2,'0')}-${mIT2[1].padStart(2,'0')}`;}
  // serial number Excel come stringa
  if(/^\d+(\.\d*)?$/.test(s)){const iso=excelSerialToISO(parseFloat(s));if(iso)return iso;}
  // yyyy-mm senza giorno
  const mYM=s.match(/^(\d{4})-(\d{2})$/);
  if(mYM) return `${mYM[1]}-${mYM[2]}-01`;
  return '';
}
function monthKey(v){
  const s=normalizeDateValue(v);
  return s ? s.slice(0,7) : '';
}
function monthIndex(v){
  const mk=monthKey(v);
  if(!mk) return null;
  const [y,m]=mk.split('-').map(Number);
  return y*12+(m-1);

function ageMeta(v){
  const mk=monthKey(v);

  if(idx===null) return {month:'',label:'',mesi:null,anno:0,pri:'N'};
  const mesi=Math.max(0,(CY*12+CM)-idx);
  const pri=mesi>=60?'U':mesi>=36?'A':mesi>=24?'M':'O';
  return {month:mk,label:mk,mesi,anno:parseInt(mk.slice(0,4)),pri};
}

// ═══ COUNT-UP ANIMATION SUI KPI ═════════════════════════════════════════════
function animKV(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.kv').forEach(el=>{
    if(el.childElementCount>0||el.dataset.anim)return;
    const txt=el.textContent;
    const m=txt.match(/(\d{1,3}(?:\.\d{3})+|\d+)(,\d+)?/);
    if(!m)return;
    const intPart=m[1].replace(/\./g,''),decPart=(m[2]||'').slice(1);
    const raw=parseFloat(intPart+(decPart?'.'+decPart:''));
    if(!isFinite(raw)||raw===0)return;
    el.dataset.anim='1';
    const dec=decPart.length,t0=performance.now(),dur=650;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
      if(p>=1){el.textContent=txt;return;}
      el.textContent=txt.replace(m[0],(raw*e).toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec}));
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function rOv(){
  const mag=curMAG();
  const magSedi=(ST.sedeMode==='agg'||ST.sedeMode==='split')?['A','B','C']:[ST.sedeMode];
  const valMagTot=magSedi.reduce((a,s)=>a+(mag.kpi[s]?.valore||0),0);
  const pzMagTot=magSedi.reduce((a,s)=>a+(mag.kpi[s]?.pezzi||0),0);
  const hasAcq=!!LIVE_ACQ&&!!LIVE_ACQ.rows;
  const hasVend=!!LIVE_VEND;
  const hasVendDate=hasVend&&LIVE_VEND.hasDate;

  // Prefer vendite KPIs (frames only) when dates available, else acquisti as proxy
  const kpis = hasVendDate ? vendKPIs() : (hasAcq ? acqKPIs() : null);
  const usingProxy = !hasVendDate && hasAcq;

  window.__ov={hasAcq,hasVend,hasVendDate,trendStep:ST.ovTrendStep,trendRange:ST.ovTrendRange,focusMese:ST.ovFocusMese};

  const noDataBanner=(!hasVend&&!hasAcq)?`<div style="background:rgba(236,123,160,.06);border:0.5px solid rgba(236,123,160,.2);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;font-size:12px;color:var(--m);display:flex;align-items:center;gap:10px"><span style="font-size:16px">💡</span>Carica i file Excel dalla sezione <b style="color:var(--ac);cursor:pointer" onclick="nav('dati')">Carica dati</b> per vedere KPI reali.</div>`:"";

  const perVal=kpis?kpis.per.val:0, perPYVal=kpis?kpis.perPY.val:0;
  const perPz=kpis?kpis.per.pz:0, perLabel=kpis?kpis.perLabel:'YTD';
  const moVal=kpis?kpis.mo.val:0, moPYVal=kpis?kpis.moPY.val:0;
  const moPz=kpis?kpis.mo.pz:0;
  const wkVal=kpis?kpis.wk.val:0, wkPrevVal=kpis?kpis.wkPrev.val:0;
  const wkPz=kpis?kpis.wk.pz:0;

  // KPI anno precedente per settimana
  const wkPrevPz=kpis?kpis.wkPrev.pz:0;
  const moPYPz=kpis?kpis.moPY.pz:0;
  const perPYPz=kpis?kpis.perPY.pz:0;

  const moFullPY=kpis?.moFullPY||{val:0,pz:0};
  const daysLeft=kpis?kpis.daysLeft:0;

  // ── Insight: top brand del periodo + confronto sedi (sostituisce l'obiettivo) ──
  const perRowsIns=hasVendDate?(()=>{
    const now2=new Date();
    let from;
    if(ST.ovPeriodo==='MTD')from=`${CY}-${String(CM+1).padStart(2,'0')}-01`;
    else if(['Q1','Q2','Q3','Q4'].includes(ST.ovPeriodo)){const qs={Q1:1,Q2:4,Q3:7,Q4:10};from=`${CY}-${String(qs[ST.ovPeriodo]).padStart(2,'0')}-01`;}
    else if(ST.ovPeriodo==='PY'){from=`${CY-1}-01-01`;}
    else from=`${CY}-01-01`;
    const to=ST.ovPeriodo==='PY'?`${CY-1}-12-31`:toISO(now2);
    return sedeRows(LIVE_VEND.rows).filter(r=>r.dt&&r.dt>=from&&r.dt<=to);
  })():[];
  const topBrandIns=(()=>{
    const m={};
    perRowsIns.filter(r=>r.tp==='Montature vista'||r.tp==='Occhiali sole').forEach(r=>{if(!r.mar)return;if(!m[r.mar])m[r.mar]={pz:0,val:0};m[r.mar].pz+=r.pz;m[r.mar].val+=r.val;});
    const arr=Object.entries(m).sort((a,b)=>b[1].val-a[1].val);
    return arr[0]?{n:arr[0][0],pz:Math.round(arr[0][1].pz),val:Math.round(arr[0][1].val)}:null;

  const sedeInsA=perRowsIns.filter(r=>r.fil==='A').reduce((a,r)=>a+r.pz,0);

    return`

${sorted.map(([tp,pz])=>{

  <div style="height:2px;background:var(--b);border-radius:1px"><div style="height:100%;width:${pct}%;background:var(--ac);border-radius:1px"></div></div>
</div>`;}).join('')}`;
  };

  const clientiPanel=()=>{
    if(!hasVendDate) return`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--d);font-size:12px;flex-direction:column;gap:6px"><span style="font-size:24px;opacity:.3">◎</span><span>Carica vendite.xlsx con le date per vedere la retention clienti</span></div>`;
    const ret=computeRetention((ST.cliRetLost||12)*30,ST.sedeMode);

      ['Nuovi',nNuovi,'#67e8f9']

    return`
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--d)">Clienti · retention</div>
  <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(236,123,160,.12);color:var(--ac);cursor:pointer" onclick="nav('clienti')">${fmtN(nTot)} totali →</span>
</div>
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px">
  <div style="font-size:22px;font-weight:700;color:var(--ac)">${pctFid}%</div>

</div>
${rows.map(([l,v,c])=>{const pct=nTot>0?Math.round(v/nTot*100):0;return`<div style="margin-bottom:7px">

${usingProxy?`<div style="background:rgba(236,123,160,.05);border:0.5px solid rgba(236,123,160,.15);border-radius:var(--r);padding:7px 14px;margin-bottom:10px;font-size:11px;color:var(--d)">⚠ vendite.xlsx senza date — KPI calcolati su acquisti come proxy</div>`:''}

      ${ST.ovFocusMese!==null?`<div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end">${MESI.map((m,i)=>meseBtn(i+1,m)).join('')}</div>`:''}

  </div>
  ${(hasVendDate||hasAcq)?`<div class="cw cw-lg"><canvas id="ch_ov_trend"></canvas></div>`:`<div style="display:flex;align-items:center;justify-content:center;height:120px;color:var(--d);font-size:13px">Carica dati per vedere il trend vendite</div>`}
</div>

      <div style="display:flex;align-items:baseline;gap:12px">
