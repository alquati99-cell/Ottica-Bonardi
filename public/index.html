function rMag(){
  const baseRows=applySharedMagFilters(curMAG().rows.map(enrichMagRow));
  const rows=magFilter();
  const kA=rows.filter(r=>r.f==="A"),kB=rows.filter(r=>r.f==="B");
  const vA=kA.reduce((a,r)=>a+r.v,0),vB=kB.reduce((a,r)=>a+r.v,0);
  const pA=kA.reduce((a,r)=>a+r.q,0),pB=kB.reduce((a,r)=>a+r.q,0);
  const bf=ST.magBrand!=="all";
  const supplierAgg=buildSupplierAgg(rows);
  const stale3=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=3);
  const stale6=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=6);
  const stale12=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=12);
  const stale24=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=24);
  const stale36=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=36);
  const stale60=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=60);
  const missingDates=rows.filter(r=>!r.dMonth).length;
  const oldestRow=rows.filter(r=>r.mesi!==null).sort((a,b)=>b.mesi-a.mesi)[0];
  const latestMonth=rows.reduce((acc,r)=>r.dMonth&&(!acc||r.dMonth>acc)?r.dMonth:acc,'');

  // Grafici
  const topBrand=Object.entries(rows.reduce((o,r)=>{o[r.m]=(o[r.m]||0)+r.v;return o;},{})).sort((a,b)=>b[1]-a[1]).slice(0,bf?10:10);
  const catA={},catB={};
  rows.forEach(r=>{const k=r.cat==="M"?"Montature":"Sole";if(r.f==="A")catA[k]=(catA[k]||0)+r.v;else catB[k]=(catB[k]||0)+r.v;});
  let agPool=baseRows.filter(r=>r.anno>0);
  if(ST.agSed!=="all")agPool=agPool.filter(r=>r.f===ST.agSed);
  if(ST.agSearch){const s=ST.agSearch.toLowerCase();agPool=agPool.filter(r=>r.m.toLowerCase().includes(s)||r.mod.toLowerCase().includes(s)||r.forn.toLowerCase().includes(s)||(r.bc&&r.bc.toLowerCase().includes(s)));}
  const agSummary=buildAgingSummary(agPool);
  window.__mag={rows,topBrand,catA,catB,bf,aging:agSummary};

  // Tabella stock
  let tRows=[...rows];
  tRows.sort((a,b)=>ST.magAsc?(a[ST.magSort]>b[ST.magSort]?1:-1):(a[ST.magSort]<b[ST.magSort]?1:-1));
  const totR=tRows.length,pages=Math.max(1,Math.ceil(totR/PER)),magPageIdx=Math.min(ST.magPage,pages-1);
  const pageR=tRows.slice(magPageIdx*PER,(magPageIdx+1)*PER);
  const smalt=buildSmalt(baseRows.filter(r=>ST.magSed==="all"||r.f===ST.magSed));

  // Tab aging
  let agRows=[...agPool];
  if(ST.agPri!=="all")agRows=agRows.filter(r=>r.pri===ST.agPri);
  agRows.sort((a,b)=>ST.agAsc?(a[ST.agSort]>b[ST.agSort]?1:-1):(a[ST.agSort]<b[ST.agSort]?1:-1));
  const agPages=Math.max(1,Math.ceil(agRows.length/PER)),agPageIdx=Math.min(ST.agPage,agPages-1);
  const agPage=agRows.slice(agPageIdx*PER,(agPageIdx+1)*PER);
  const agValTot=agRows.reduce((a,r)=>a+r.v,0);
  const activeFilters=[];
  if(ST.magBrand!=="all")activeFilters.push(`Marchio: ${ST.magBrand}`);
  if(ST.magSed!=="all")activeFilters.push(`Sede stock: ${ST.magSed}`);
  if(ST.magCat!=="all")activeFilters.push(`Categoria: ${ST.magCat==="M"?"Vista":"Sole"}`);
  if(ST.magForn!=="all")activeFilters.push(`Fornitore: ${ST.magForn}`);
  if(ST.magDateFrom)activeFilters.push(`Ult. acq da ${ST.magDateFrom}`);
  if(ST.magDateTo)activeFilters.push(`Ult. acq a ${ST.magDateTo}`);
  if(ST.magFocus==="3")activeFilters.push("Fermi 3m+");
  if(ST.magFocus==="6")activeFilters.push("Fermi 6m+");
  if(ST.magFocus==="12")activeFilters.push("Fermi 12m+");
  if(ST.magFocus==="24")activeFilters.push("Fermi 24m+");
  if(ST.magFocus==="36")activeFilters.push("Fermi 36m+");

function rCli(){
  const now=new Date();
  const retMonths=ST.cliRetLost||6;
  const retDays=retMonths*30;
  const tab=ST.cliTab||'retention';
  const srch=ST.cliSearch.toLowerCase();

  // ── Retention data from LIVE_VEND ──────────────────────────────────────────
  const hasVend=!!(LIVE_VEND&&LIVE_VEND.hasDate);
  const retention=computeRetention(retDays,ST.sedeMode);
  const {retClients,nAttivi,nRischio,nPersi,nNuovi,nTot}=retention;

  // Recency buckets
  const buckets=[0,0,0,0,0];
  retClients.forEach(c=>{
    if(c.daysSince<=30)buckets[0]++;
    else if(c.daysSince<=90)buckets[1]++;
    else if(c.daysSince<=180)buckets[2]++;
    else if(c.daysSince<=365)buckets[3]++;
    else buckets[4]++;
  });

  // Avg return frequency
  const withMult=retClients.filter(c=>c.nVisits>1&&c.firstDt&&c.lastDt);
  const avgRetM=withMult.length>0?Math.round(withMult.reduce((a,c)=>{

    return a+mo/c.nVisits;
  },0)/withMult.length):null;

  // Fatturato medio per cliente attivo
  const attivi=retClients.filter(c=>c.status==='attivo');
  const avgValA=attivi.length>0?Math.round(attivi.reduce((a,c)=>a+c.totVal,0)/attivi.length):0;

  // ── Enrich retention with names from LIVE_CLI (orders format) ─────────────
  const cliByCode=LIVE_CLI?.byCode||{};
  const cliName=cod=>{const c=cliByCode[cod];return c?.nome||'';};
  const cliSearch2=srch?retClients.filter(c=>{const n=cliName(c.cli).toLowerCase();return c.cli.toLowerCase().includes(srch)||n.includes(srch);}):retClients;

  // ── Fasce età ────────────────────────────────────────────────────────────
  // Due percorsi possibili: 1) anagrafica semplice col codice cliente diretto
  // (vecchio formato), 2) anagrafica età (senza codice) abbinata per nome
  // allo storico ordini, che fa da ponte codice→nome.
  const CYnow=now.getFullYear();
  const hasOrders=!!(LIVE_CLI?.hasOrders&&LIVE_CLI.totalCli>0);
  const hasEtaDirect=!!(LIVE_CLI?.hasEta&&hasVend);
  const hasEtaByName=!!(LIVE_CLI_ANAG&&hasVend&&hasOrders);
  const hasEta=hasEtaDirect||hasEtaByName;
  const brackets=['<25','25–44','45–64','65+'];
  const bracketCfg={
    '<25':{col:'#5ac8fa',bg:'rgba(90,200,250,.13)'},
    '25–44':{col:'#30d158',bg:'rgba(48,209,88,.13)'},
    '45–64':{col:'#ff9f0a',bg:'rgba(255,159,10,.13)'},
    '65+':{col:'#bf5af2',bg:'rgba(191,90,242,.13)'}
  };
  const bracketData=Object.fromEntries(brackets.map(b=>[b,{n:0,totVal:0,nLenti:0,nSole:0,nVista:0,clients:[]}]));
  if(hasEta){
    retClients.forEach(rc=>{

        if(ci&&ci.nascita){eta=CYnow-ci.nascita;sesso=ci.sesso;nome=ci.nome;}

      if(eta===null&&hasEtaByName){

        if(anag){eta=anag.eta;nome=ci.nome;}
      }
      if(eta===null||eta<5||eta>110)return;
      const br=eta<25?'<25':eta<45?'25–44':eta<65?'45–64':'65+';
      const bd=bracketData[br];
      bd.n++;bd.totVal+=rc.totVal;bd.nLenti+=rc.nLenti;bd.nSole+=rc.nSole;bd.nVista+=rc.nVista;
      bd.clients.push({...rc,eta,sesso,nome});

  }
  const drillBr=ST.cliEtaDrill;
  const drillClients=drillBr&&bracketData[drillBr]?bracketData[drillBr].clients:[];

  // ── Sort + filter retention list ───────────────────────────────────────────

  window.__cli={hasVend,hasEta,hasOrders,buckets,nAttivi,nRischio,nPersi,nNuovi,nTot,etaBrackets:brackets,etaData:bracketData};

  // ── Tab: Storico ordini (da Clienti.xlsx) ─────────────────────────────────
  const tStorico=()=>{
    if(!hasOrders)return`<div class="g card fi" style="text-align:center;padding:40px 20px">
      <div style="font-size:32px;margin-bottom:12px">📋</div>

    <div class="g kc"><div class="kl">Ultima visita</div><div class="kv" style="font-size:16px;color:var(--ac)">${drill.lastDt?drill.lastDt.slice(0,7):'—'}</div></div>
    <div class="g kc"><div class="kl">Brand preferito</div><div class="kv" style="font-size:14px;color:var(--am)">${drill.brandFav||'—'}</div></div>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">
    <span style="color:var(--em)"><b>${drill.nLenti}</b> con lenti</span>
    <span style="color:var(--am)"><b>${drill.nSole}</b> sole</span>
    <span style="color:var(--cy)"><b>${drill.nVista}</b> vista</span>
    ${drill.lenteFav?`<span style="color:var(--d)">Lente preferita: <b style="color:var(--m)">${drill.lenteFav}</b></span>`:''}
  </div>
  <table><thead><tr><th>Data</th><th>Modello</th><th>Lente Dx</th><th>Lente Sx</th><th>Fornitore lenti</th><th>€</th></tr></thead>
  <tbody>${drill.orders.map(o=>`<tr>
    <td class="mn" style="color:var(--m)">${o.dt?o.dt.slice(0,10):'—'}</td>
    <td style="font-size:12px;font-weight:500">${o.modello||'—'}</td>
    <td style="font-size:11px;color:var(--em)">${o.lenteDx||'—'}</td>
    <td style="font-size:11px;color:var(--em)">${o.lenteSx||'—'}</td>
    <td style="font-size:11px;color:var(--d)">${o.fornitore||'—'}</td>
    <td class="mn mn-gr">${o.tot>0?fmt(o.tot):'—'}</td>
  </tr>`).join('')}</tbody></table>
</div>`:''
    return`
<div style="font-size:12px;color:var(--m);margin-bottom:4px" class="fi">${fmtN(LIVE_CLI.totalCli)} clienti · ${fmtN(LIVE_CLI.totalOrdini)} ordini totali · Clicca un cliente per il dettaglio</div>
<div class="g card fi">
  <div class="ch">
    <div class="ct">Tutti i clienti (${filtered.length})</div>
  </div>
  <div style="overflow-x:auto">
  <table><thead><tr><th>Nome</th><th>Cod.</th><th>Filiale</th><th>Ordini</th><th>Vista</th><th>Sole</th><th>Lenti</th><th>Brand fav.</th><th>Prima visita</th><th>Ultima visita</th></tr></thead>
  <tbody>${filtered.slice(0,80).map(c=>{const ag=ageLabel(c.lastDt);return`<tr style="cursor:pointer" onclick="ST.cliStoricoDrill=ST.cliStoricoDrill==='${c.cod}'?null:'${c.cod}';renderPage()">
    <td style="font-size:12px;font-weight:500;color:${ST.cliStoricoDrill===c.cod?'var(--ac)':'var(--t)'}">${c.nome}</td>
    <td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--d)">${c.cod}</td>
    <td class="mn" style="color:var(--m)">${c.filiale||'—'}</td>
    <td class="mn" style="font-weight:700;color:var(--t)">${c.nOrdini}</td>
    <td class="mn" style="color:var(--cy)">${c.nVista>0?`<b>${c.nVista}</b>`:'—'}</td>
    <td class="mn" style="color:var(--am)">${c.nSole>0?`<b>${c.nSole}</b>`:'—'}</td>
    <td class="mn" style="color:var(--em)">${c.nLenti>0?`<b>${c.nLenti}</b>`:'—'}</td>

    <td class="mn"><span style="color:${ag.c}">${ag.l}</span></td>

<div class="topbar fi"><div class="page-title">Clienti${hasOrders?` <span class="pt-badge">${fmtN(LIVE_CLI.totalCli)} clienti</span>`:(hasVend?` <span class="pt-badge">${fmtN(nTot)} con date</span>`:'')}</div>
  <div class="controls" style="gap:6px">
    <div class="tpill" style="gap:0">${tabs.map(([k,l])=>`<button class="tp${tab===k?' on':''}" onclick="ST.cliTab='${k}';renderPage()">${l}</button>`).join('')}</div>
    <input id="srch-cli" class="srch" placeholder="Cerca nome o codice…" value="${ST.cliSearch}" oninput="ST.cliSearch=this.value;renderPage()" style="width:190px">

</div>
${splitBar()}
${tab==='retention'?tRetention():tab==='eta'?tEta():tab==='storico'?tStorico():tLista()}`;

// ═══ LENTI ══════════════════════════════════════════════════════════════════
function rLenti(){
  if(!LIVE_VEND){
    return`<div class="topbar fi"><div class="page-title">Lenti <span class="pt-badge">${CY}</span></div></div>
<div class="g card fi" style="text-align:center;padding:40px 20px;color:var(--d)">
  <div style="font-size:32px;margin-bottom:12px">🔬</div>
  <div style="font-size:14px;margin-bottom:6px;color:var(--m)">Nessun dato disponibile</div>
  <div style="font-size:12px">Carica <b style="color:var(--ac);cursor:pointer" onclick="nav('dati')">vendite.xlsx</b> per vedere l'analisi lenti</div>
</div>`;
  }
  const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const hasDate=LIVE_VEND.hasDate;
  const allL=LIVE_VEND.rows.filter(r=>r.tp&&r.tp.startsWith('Lenti'));
  const rows=ST.lentiFil==='all'?allL:allL.filter(r=>r.fil===ST.lentiFil);
  const ytdRows=hasDate?rows.filter(r=>r.dt&&r.dt>=`${CY}-01-01`&&r.dt<=today):rows;

  // KPI totali
  const totPz=ytdRows.reduce((a,r)=>a+r.pz,0);
  const totVal=ytdRows.reduce((a,r)=>a+r.val,0);
  const totAcq=ytdRows.reduce((a,r)=>a+r.acq,0);
  const totMarg=totVal-totAcq;
  const margPct=totVal>0?Math.round(totMarg/totVal*100):0;

  // Previous year same period
  const pytdRows=hasDate?rows.filter(r=>r.dt&&r.dt>=`${CY-1}-01-01`&&r.dt<=`${CY-1}-${today.slice(5)}`):[];
  const pTotPz=pytdRows.reduce((a,r)=>a+r.pz,0);
  const pTotVal=pytdRows.reduce((a,r)=>a+r.val,0);
  const pTotMarg=pytdRows.reduce((a,r)=>a+(r.val-r.acq),0);

  const dV=pTotVal>0?Math.round((totVal-pTotVal)/pTotVal*100):null;
  const dP=pTotPz>0?Math.round((totPz-pTotPz)/pTotPz*100):null;
  const dM=pTotMarg>0?Math.round((totMarg-pTotMarg)/pTotMarg*100):null;
  const chip=(v,suffix='')=>v===null?'':`<span class="delta ${v>=0?'up':'dn'}" style="font-size:10px">${v>=0?'↑':'↓'}${Math.abs(v)}%${suffix}</span>`;

  // Per tipo
  const byTp={};
  ytdRows.forEach(r=>{
    const k=r.tp||'Altro';
    if(!byTp[k])byTp[k]={pz:0,val:0,acq:0};
    byTp[k].pz+=r.pz;byTp[k].val+=r.val;byTp[k].acq+=r.acq;
  });
  const tpSorted=Object.entries(byTp).sort((a,b)=>b[1].pz-a[1].pz);
  const tpLabels=['Mono','Prog','Bifoc','Occup','Acc.','PDC'];
  const tpMap={'Lenti monofocali':'Mono','Lenti progressive':'Prog','Lenti bifocali':'Bifoc','Lenti occupazionali':'Occup','Lenti a supporto accomodativo':'Acc.','Lenti a profondità di campo':'PDC'};
  const shortTp=tp=>tpMap[tp]||tp.replace('Lenti ','').slice(0,6);

  // Per marchio
  const byMar={};
  ytdRows.forEach(r=>{
    const k=r.mar||'N/D';
    if(!byMar[k])byMar[k]={pz:0,val:0,acq:0};
    byMar[k].pz+=r.pz;byMar[k].val+=r.val;byMar[k].acq+=r.acq;
  });
  const marSorted=Object.entries(byMar).sort((a,b)=>b[1].pz-a[1].pz).slice(0,10);

  // Per diametro (se disponibile)
  const hasDiam=allL.some(r=>r.diam&&r.diam!=='');
  const byDiam={};
  if(hasDiam){
    ytdRows.forEach(r=>{
      const k=r.diam||'N/D';
      if(!byDiam[k])byDiam[k]={pz:0,val:0,acq:0};
      byDiam[k].pz+=r.pz;byDiam[k].val+=r.val;byDiam[k].acq+=r.acq;
    });
  }
  const diamSorted=Object.entries(byDiam).sort((a,b)=>b[1].pz-a[1].pz);

  // Per operatore
  const byOp={};
  ytdRows.forEach(r=>{
    const k=r.op||'N/D';
    if(!byOp[k])byOp[k]={pz:0,val:0,acq:0};
    byOp[k].pz+=r.pz;byOp[k].val+=r.val;byOp[k].acq+=r.acq;
  });
  const opSorted=Object.entries(byOp).sort((a,b)=>b[1].pz-a[1].pz).slice(0,8);

  // Per filiale
  const byFil={A:{pz:0,val:0,acq:0},B:{pz:0,val:0,acq:0}};
  ytdRows.forEach(r=>{const k=r.fil==='B'?'B':'A';byFil[k].pz+=r.pz;byFil[k].val+=r.val;byFil[k].acq+=r.acq;});

  // Tutti i tipi di lenti disponibili per selettore
  const allLentiTipi=[...new Set(allL.map(r=>r.tp).filter(Boolean))].sort();

  // Trend mensile con slicer range + tipo
  const trendStep=ST.lentiTrendStep||'M';
  const trendRange=ST.lentiTrendRange||12;
  const trendTpFilter=ST.lentiTrendTp||'all';
  const trendSrc=trendTpFilter==='all'?rows:rows.filter(r=>r.tp===trendTpFilter);
  const trendAgg={};
  if(hasDate){
    let cutStr='';
    if(trendStep==='M'){
      const cut=new Date(now);cut.setMonth(cut.getMonth()-(trendRange-1));cut.setDate(1);
      cutStr=`${cut.getFullYear()}-${String(cut.getMonth()+1).padStart(2,'0')}`;
    } else if(trendStep==='W'){
      const cut=new Date(now);cut.setDate(cut.getDate()-7*(trendRange-1));
      cutStr=toISO(cut);
    } else if(trendStep==='D'){
      const cut=new Date(now);cut.setDate(cut.getDate()-(trendRange-1));
      cutStr=toISO(cut);
    }
    trendSrc.forEach(r=>{
      if(!r.dt)return;
      let k;
      if(trendStep==='M') k=r.dt.slice(0,7);
      else if(trendStep==='W') k=isoWeekKey(r.dt);
      else k=r.dt;
      if(cutStr&&k<cutStr)return;
      if(!trendAgg[k])trendAgg[k]={pz:0,val:0,marg:0};
      trendAgg[k].pz+=r.pz;trendAgg[k].val+=r.val;trendAgg[k].marg+=(r.val-r.acq);
    });
  }
  const trendKeys=Object.keys(trendAgg).sort();
  const trendLabels=trendKeys.map(k=>{
    if(trendStep==='M'){const[y,m]=k.split('-');return MESI[parseInt(m)-1]+"'"+y.slice(2);}
    if(trendStep==='W') return k.replace(/(\d{4})-W/,'W');
    return k.slice(5).replace('-','/');
  });

  const filBtn=f=>`<button class="tp${ST.lentiFil===f?' on':''}" onclick="ST.lentiFil='${f}';renderPage()">${f==='all'?'Tutte':f}</button>`;

  // Percentuale tipo su totale
  const pctTp=tp=>totPz>0?Math.round((byTp[tp]||{pz:0}).pz/totPz*100):0;

  window.__lenti={hasDate,trendKeys,trendLabels,trendAgg,tpSorted,shortTp,marSorted,diamSorted,hasDiam,opSorted,allLentiTipi,trendStep,trendRange,trendTpFilter};

  return`
<div class="topbar fi" style="flex-wrap:wrap;gap:8px">
  <div class="page-title">Lenti <span class="pt-badge">${hasDate?'YTD '+CY:'Totale'}</span></div>
  <div class="tpill" style="gap:0">${filBtn('all')}${filBtn('A')}${filBtn('B')}</div>
</div>

<!-- 4 KPI boxes -->
<div class="kg k4 fi" style="margin-bottom:14px">
  <div class="g kc">
    <div class="kl">Pezzi venduti</div>
    <div class="kv gem">${fmtN(Math.round(totPz))}</div>
    <div class="ks">lenti totali${hasDate?' YTD':''}</div>
    ${chip(dP,' pz')}
  </div>
  <div class="g kc">
    <div class="kl">Fatturato lenti</div>
    <div class="kv gcy">${fmt(totVal)}</div>
    <div class="ks">${totPz>0?fmt(totVal/totPz)+' / pz':''}</div>
    ${chip(dV,' €')}
  </div>
  <div class="g kc">
    <div class="kl">Costo acquisto</div>
    <div class="kv gam">${fmt(totAcq)}</div>
    <div class="ks">${totPz>0?fmt(totAcq/totPz)+' / pz':''}</div>
  </div>
  <div class="g kc">
    <div class="kl">Margine lordo</div>
    <div class="kv" style="color:${margPct>=40?'var(--em)':margPct>=20?'var(--am)':'var(--ro)'}">${fmt(totMarg)}</div>
    <div class="ks" style="color:${margPct>=40?'var(--em)':margPct>=20?'var(--am)':'var(--ro)'}">margine ${margPct}%</div>
    ${chip(dM,' marg')}
  </div>
</div>

<!-- Row 1: tipo breakdown | trend full-width -->
<div style="display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px" class="fi">
  <!-- Breakdown per tipo — barre orizzontali + margine -->
  <div class="g card">
    <div class="ch"><div class="ct"><span class="dot dem"></span>Analisi per tipo lente</div></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${tpSorted.map(([tp,d])=>{
        const pct=totPz>0?Math.round(d.pz/totPz*100):0;
        const marg=d.val>0?Math.round((d.val-d.acq)/d.val*100):0;
        const mc=marg>=40?'var(--em)':marg>=20?'var(--am)':'var(--ro)';
        return`<div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
            <span style="font-size:12px;font-weight:500">${tp.replace('Lenti ','')}</span>
            <div style="display:flex;gap:10px;align-items:baseline">
              <span style="font-size:11px;color:var(--m)">${fmtN(Math.round(d.pz))} pz · ${pct}%</span>
              <span style="font-size:11px;color:${mc};font-family:'DM Mono',monospace">marg ${marg}%</span>
            </div>
          </div>
          <div style="height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--em),rgba(48,209,88,.5));border-radius:3px;transition:width .5s ease"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:3px">
            <span style="font-size:10px;color:var(--d)">${fmt(d.val)} · costo ${fmt(d.acq)}</span>
            <span style="font-size:10px;color:var(--d)">Ø ${d.pz>0?fmt(d.val/d.pz):'-'}/pz</span>
          </div>
        </div>`;
      }).join('<div style="height:0.5px;background:rgba(255,255,255,.05);margin:2px 0"></div>')}
    </div>
  </div>

  <!-- Trend con selettore tipo + range -->
  <div class="g card" style="grid-column:1/-1">
    <div class="ch" style="flex-wrap:wrap;gap:8px">
      <div class="ct"><span class="dot dcy"></span>Andamento lenti${trendTpFilter!=='all'?` · ${trendTpFilter.replace('Lenti ','')}`:''}</div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;margin-left:auto">
        <!-- Step selector -->
        <div style="display:flex;gap:5px;align-items:center">
          <div class="tpill" style="gap:0">
            ${['M','W','D'].map(s=>`<button class="tp${trendStep===s?' on':''}" onclick="ST.lentiTrendStep='${s}';ST.lentiTrendRange=${s==='M'?12:s==='W'?13:30};renderPage()" style="font-size:11px">${s==='M'?'Mese':s==='W'?'Sett.':'Giorno'}</button>`).join('')}
          </div>
          <div class="tpill" style="gap:0">
            ${(trendStep==='M'?[[6,'6m'],[12,'12m'],[24,'24m'],[null,'tutto']]:trendStep==='W'?[[13,'13w'],[26,'26w'],[52,'52w'],[null,'tutto']]:[[30,'30g'],[60,'60g'],[90,'90g'],[null,'tutto']]).map(([v,l])=>`<button class="tp${trendRange===v?' on':''}" onclick="ST.lentiTrendRange=${v===null?'null':v};renderPage()" style="font-size:10px">${l}</button>`).join('')}
          </div>
        </div>
        <!-- Tipo selector -->
        <div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end">
          <button class="tp${trendTpFilter==='all'?' on':''}" onclick="ST.lentiTrendTp='all';renderPage()" style="font-size:10px;padding:3px 8px">Tutte</button>
          ${allLentiTipi.map(tp=>`<button class="tp${trendTpFilter===tp?' on':''}" onclick="ST.lentiTrendTp='${tp}';renderPage()" style="font-size:10px;padding:3px 8px">${tp.replace('Lenti ','')}</button>`).join('')}
        </div>
      </div>
    </div>
    ${hasDate&&trendKeys.length?`<div class="cw cw-lg"><canvas id="ch_lenti_trend"></canvas></div>`:`<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--d);font-size:13px;flex-direction:column;gap:8px"><span style="font-size:28px;opacity:.3">📅</span><span>Dati senza date</span></div>`}
  </div>
</div>

<!-- Row 2: per marchio + per operatore -->
<div class="g2 fi" style="margin-bottom:14px">
  <!-- Top marchi lenti -->
  <div class="g card">
    <div class="ch"><div class="ct"><span class="dot dvi"></span>Top fornitore/marchio</div><div style="font-size:11px;color:var(--d)">${marSorted.length} marchi</div></div>
    <div style="display:flex;flex-direction:column;gap:5px">
      ${marSorted.map(([mar,d],i)=>{
        const pct=totPz>0?Math.round(d.pz/totPz*100):0;
        const marg=d.val>0?Math.round((d.val-d.acq)/d.val*100):0;
        return`<div style="display:grid;grid-template-columns:16px 1fr 70px 50px;gap:8px;align-items:center;padding:5px 0;border-bottom:0.5px solid rgba(255,255,255,.04)">
          <span style="font-size:10px;color:var(--d);font-family:'DM Mono',monospace">${i+1}</span>
          <div>
            <div style="font-size:12px;font-weight:500">${mar}</div>
            <div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${pct}%;background:var(--vi);border-radius:2px"></div></div>
          </div>
          <span style="font-size:11px;color:var(--m);font-family:'DM Mono',monospace;text-align:right">${fmtN(Math.round(d.pz))} pz</span>
          <span style="font-size:11px;color:${marg>=40?'var(--em)':marg>=20?'var(--am)':'var(--ro)'};font-family:'DM Mono',monospace;text-align:right">${marg}%</span>
        </div>`;
      }).join('')}
    </div>
  </div>

  <!-- Per operatore + per filiale -->
  <div style="display:flex;flex-direction:column;gap:14px">
    <!-- Filiale A vs B -->
    <div class="g card" style="padding:16px 18px">
      <div class="ch" style="margin-bottom:12px"><div class="ct"><span class="dot dam"></span>Sede A vs Sede B</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${['A','B'].map(f=>{
          const d=byFil[f];
          const marg=d.val>0?Math.round((d.val-d.acq)/d.val*100):0;
          return`<div style="padding:12px;background:rgba(255,255,255,.04);border-radius:12px;border:0.5px solid rgba(255,255,255,.08)">
            <div style="font-size:10px;color:var(--d);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Sede ${f}</div>
            <div style="font-size:20px;font-weight:700;letter-spacing:-0.5px">${fmtN(Math.round(d.pz))}</div>
            <div style="font-size:11px;color:var(--m);margin-top:2px">pz · ${fmt(d.val)}</div>
            <div style="font-size:11px;color:${marg>=40?'var(--em)':marg>=20?'var(--am)':'var(--ro)'};margin-top:4px">marg ${marg}%</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Top operatori -->

</div>

<!-- Row 3: diametro (se disponibile) + grafico tipi -->
<div class="g2 fi">
  ${hasDiam?`
  <div class="g card">
    <div class="ch"><div class="ct"><span class="dot dem"></span>Analisi per diametro</div><div style="font-size:11px;color:var(--d)">${diamSorted.length} diametri</div></div>

          <div style="font-size:11px;color:var(--m);font-family:'DM Mono',monospace;min-width:45px;text-align:right">${fmtN(Math.round(v.pz))} pz</div>

  <div class="g card" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--d)">

    <div style="font-size:11px;text-align:center;max-width:220px">Aggiungi colonna "Diametro" nel file vendite.xlsx per vedere questa analisi</div>
  </div>`}

  <!-- Donut per tipo -->
  <div class="g card">
    <div class="ch"><div class="ct"><span class="dot dem"></span>Mix tipologia (pezzi)</div></div>
    <div class="cw"><canvas id="ch_lenti_tipi"></canvas></div>
  </div>
</div>`;
}

// ═══ CHARTS INIT ════════════════════════════════════════════════════════════
function initCharts(){
  if(!window.Chart)return;

  // OVERVIEW — trend vendite (reale se hasDate, altrimenti proxy acquisti)
  if(ST.page==="overview"&&window.__ov&&(window.__ov.hasAcq||window.__ov.hasVendDate)){
    const step=window.__ov.trendStep||'M';
    const range=window.__ov.trendRange||null;
    const fm=window.__ov.focusMese;
    const td=fm!=null
      ?((window.__ov.hasVendDate?vendFocusMese(fm):null)||(window.__ov.hasAcq?acqFocusMese(fm):null))
      :((window.__ov.hasVendDate?vendTrend(step,range):null)||acqTrend(step,range));
    if(!td||!td.labels.length) return;
    const showLabels=td.labels.length<=24;
    const showPzLabels=step==='A'||td.labels.length<=12;
    const lblSz=td.labels.length<=12?10:td.labels.length<=18?9:8;
    const ovL=document.documentElement.classList.contains('light');
    const ovGrid=ovL?"rgba(15,23,42,.07)":"rgba(255,255,255,.04)";
    const ovTick=ovL?"rgba(15,23,42,.5)":"rgba(240,244,255,.3)";
    const ovLeg=ovL?"rgba(15,23,42,.6)":"rgba(240,244,255,.45)";
    const ovDlColor=ovL?"rgba(15,23,42,.92)":"rgba(232,237,245,.95)";
    const ovTtBg=ovL?"rgba(255,255,255,.97)":"rgba(8,13,26,.95)";
    const ovTtBd=ovL?"rgba(15,23,42,.14)":"rgba(255,255,255,.1)";
    const ovOpts={
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:28,right:8}},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,position:"top",align:"end",labels:{color:ovLeg,font:{family:"'DM Mono',monospace",size:10},boxWidth:8,padding:10,usePointStyle:true}},
        datalabels:{
          display:ctx=>ctx.datasetIndex===0?showLabels&&ctx.dataset.data[ctx.dataIndex]>0:showPzLabels&&ctx.dataset.data[ctx.dataIndex]>0,
          anchor:ctx=>ctx.datasetIndex===0?'end':'center',
          align:ctx=>ctx.datasetIndex===0?'start':'top',
          offset:ctx=>ctx.datasetIndex===0?6:5,
          color:ovDlColor,
          backgroundColor:ctx=>ctx.datasetIndex===0?(ovL?'rgba(21,128,61,.16)':'rgba(6,30,20,.68)'):(ovL?'rgba(8,145,178,.16)':'rgba(90,200,250,.25)'),
          borderRadius:5,
          padding:{top:2,bottom:2,left:6,right:6},
          font:ctx=>({family:"'DM Mono',monospace",size:ctx.datasetIndex===0?12:11,weight:'600'}),
          formatter:(v,ctx)=>ctx.datasetIndex===0?fmtShort(v):fmtShortPz(v)+' pz'
        },
        tooltip:{backgroundColor:ovTtBg,borderColor:ovTtBd,borderWidth:1,padding:11,titleColor:ovL?"rgba(15,23,42,.92)":"rgba(240,244,255,.9)",bodyColor:ovL?"rgba(15,23,42,.65)":"rgba(240,244,255,.65)",titleFont:{family:"'Sora',sans-serif",size:12,weight:"600"},bodyFont:{family:"'DM Mono',monospace",size:12}}
      },
      scales:{
        x:{grid:{color:ovGrid},ticks:{color:ovTick,font:{family:"'DM Mono',monospace",size:10},maxRotation:45},border:{display:false}},
        y:{position:"left",grid:{color:ovGrid},ticks:{color:ovTick,font:{family:"'DM Mono',monospace",size:10},callback:v=>v===0?'':fmt(v)},border:{display:false}},
        y1:{position:"right",grid:{display:false},ticks:{color:ovL?"rgba(8,145,178,.75)":"rgba(90,200,250,.5)",font:{family:"'DM Mono',monospace",size:10},callback:v=>v===0?'':fmtN(v)+' pz'},border:{display:false}}
      }
    };
    mkChart("ch_ov_trend","bar",td.labels,[
      {type:"bar",label:"Fatturato (€)",data:td.vals,backgroundColor:"rgba(48,209,88,.22)",borderColor:"#30d158",borderWidth:1.5,borderRadius:4,yAxisID:"y"},
      {type:"line",label:"Pezzi",data:td.pzs,borderColor:"#5ac8fa",backgroundColor:"rgba(90,200,250,.08)",borderWidth:2,pointRadius:step==='A'?3:step==='M'?2:1,pointBackgroundColor:"#5ac8fa",tension:0.4,fill:false,yAxisID:"y1"}
    ],ovOpts);
  }

  // VENDITE — grafici (tipo prodotto donut + brand stacked bar)
  if(ST.page==="vendite"&&window.__vend){
    // Donut tipo prodotto
    if(window.__vend.tipoDisp&&window.__vend.tipoDisp.length>0){
      const td=window.__vend.tipoDisp.slice(0,7);
      const tipoColors=["#30d158","rgba(48,209,88,.72)","rgba(16,185,129,.85)","rgba(48,209,88,.5)","rgba(16,185,129,.6)","rgba(48,209,88,.35)","rgba(16,185,129,.38)"];
      const vdonTotal=td.reduce((s,t)=>s+t.pz,0);
      mkChart("ch_vcat","doughnut",td.map(t=>t.n.replace('Montature vista','Montature').replace('Occhiali sole','Sole').replace('Lenti monofocali','Monofoc.').replace('Lenti progressive','Progress.').replace('Lenti bifocali','Bifoc.').replace('Lenti occupazionali','Occup.').replace('Lenti a supporto accomodativo','Acc.').replace('Lenti a profondità di campo','PDC')),[{data:td.map(t=>t.pz),backgroundColor:tipoColors.slice(0,td.length),borderWidth:0,hoverOffset:6}],{...coDon,plugins:{...coDon.plugins,datalabels:{display:ctx=>vdonTotal>0&&(ctx.dataset.data[ctx.dataIndex]/vdonTotal)>=0.05,formatter:v=>Math.round(v/vdonTotal*100)+'%',color:'rgba(7,9,15,.9)',font:{family:"'DM Mono',monospace",size:11,weight:'600'}},tooltip:{...coDon.plugins.tooltip,callbacks:{label:ctx=>` ${ctx.label}: ${fmtN(ctx.raw)} pz`}}}});
    }
    // Stacked bar brand (costo + margine)
    if(window.__vend.brands&&window.__vend.brands.length>0){
      const brs=window.__vend.brands;
      const labels=brs.map(b=>b.n.length>14?b.n.slice(0,13)+'…':b.n);
      const brandOpts={...coLeg,layout:{padding:{top:22}},scales:{...coLeg.scales,x:{...coLeg.scales.x,stacked:true},y:{...coLeg.scales.y,stacked:true,ticks:{...coLeg.scales.y.ticks,callback:v=>v===0?'':fmt(v)}}},plugins:{...coLeg.plugins,datalabels:{display:ctx=>ctx.datasetIndex===1,anchor:'end',align:'end',offset:2,color:'rgba(48,209,88,.95)',font:{family:"'DM Mono',monospace",size:9},formatter:(v,ctx)=>{const acq=ctx.chart.data.datasets[0].data[ctx.dataIndex]||0;const tot=acq+(v>0?v:0);return tot>0?fmtShort(tot):''}},tooltip:{...CO.plugins.tooltip,callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(ctx.raw)}`}}}};
      mkChart("ch_vbrand","bar",labels,[
        {label:"Costo acq.",data:brs.map(b=>b.acq),backgroundColor:"rgba(255,159,10,.25)",borderColor:"rgba(255,159,10,.7)",borderWidth:1,borderRadius:{topLeft:0,topRight:0,bottomLeft:4,bottomRight:4},stack:"s"},
        {label:"Margine",data:brs.map(b=>b.marg>0?b.marg:0),backgroundColor:"rgba(48,209,88,.35)",borderColor:"#30d158",borderWidth:1,borderRadius:{topLeft:4,topRight:4,bottomLeft:0,bottomRight:0},stack:"s"}
      ],brandOpts);
    }
  }

  // MAGAZZINO
  if(ST.page==="magazzino"&&window.__mag){
    const mg=window.__mag;
    // Grafico 1
    if(mg.bf){
      const byMod=Object.entries(mg.rows.reduce((o,r)=>{o[r.mod]=(o[r.mod]||0)+r.v;return o;},{})).sort((a,b)=>b[1]-a[1]).slice(0,10);
      mkChart("ch_mag1","bar",byMod.map(x=>x[0].slice(0,14)),[{data:byMod.map(x=>x[1]),backgroundColor:"rgba(48,209,88,.2)",borderColor:"#30d158",borderWidth:1.5,borderRadius:4}],{...CO,layout:{padding:{top:22}},plugins:{...CO.plugins,datalabels:{display:true,anchor:'end',align:'end',offset:2,color:'rgba(48,209,88,.9)',font:{family:"'DM Mono',monospace",size:9},formatter:v=>fmtShort(v)}}});
    } else {
      const magBrandAlphas=["rgba(48,209,88,.55)","rgba(48,209,88,.46)","rgba(16,185,129,.55)","rgba(48,209,88,.38)","rgba(16,185,129,.42)","rgba(48,209,88,.3)","rgba(16,185,129,.35)","rgba(48,209,88,.22)","rgba(16,185,129,.28)","rgba(48,209,88,.17)"];
      const magBrandBorder=["#30d158","#30d158","rgba(16,185,129,.9)","rgba(48,209,88,.8)","rgba(16,185,129,.8)","rgba(48,209,88,.7)","rgba(16,185,129,.7)","rgba(48,209,88,.6)","rgba(16,185,129,.6)","rgba(48,209,88,.5)"];
      mkChart("ch_mag1","bar",mg.topBrand.map(x=>x[0]),[{data:mg.topBrand.map(x=>x[1]),backgroundColor:magBrandAlphas,borderColor:magBrandBorder,borderWidth:1.5,borderRadius:4}],{...CO,layout:{padding:{top:22}},plugins:{...CO.plugins,datalabels:{display:true,anchor:'end',align:'end',offset:2,color:'rgba(48,209,88,.9)',font:{family:"'DM Mono',monospace",size:9},formatter:v=>fmtShort(v)}}});
    }
    // Grafico 2 categorie
    mkChart("ch_mag2","doughnut",["A · Montature","A · Sole","B · Montature","B · Sole"],[{data:[mg.catA["Montature"]||0,mg.catA["Sole"]||0,mg.catB["Montature"]||0,mg.catB["Sole"]||0],backgroundColor:["#30d158","rgba(48,209,88,.55)","rgba(16,185,129,.8)","rgba(16,185,129,.45)"],borderWidth:0,hoverOffset:6}],coDon);
    // Grafici aging
    if(ST.magTab==="aging"){
      const ag=mg.aging||{byAnno:{},stats:{U:{v:0},A:{v:0},M:{v:0},O:{v:0}}};
      const anni=Object.keys(ag.byAnno).sort();
      const agColors=anni.map(y=>{const n=parseInt(y);return n<2020?"rgba(255,69,58,.5)":n<2023?"rgba(255,159,10,.45)":n<2024?"rgba(48,209,88,.32)":"rgba(48,209,88,.58)";});
      const agBorder=anni.map(y=>{const n=parseInt(y);return n<2020?"#ff453a":n<2023?"rgba(255,159,10,.9)":n<2024?"rgba(48,209,88,.65)":"#30d158";});
      const agMode=ST.agChartMode==="pz";
      const agData=anni.map(y=>agMode?ag.byAnno[y].pz:ag.byAnno[y].v);
      const agOpts={...CO,plugins:{...CO.plugins,tooltip:{...CO.plugins?.tooltip,callbacks:{label:ctx=>agMode?`${Math.round(ctx.raw)} pz`:`€ ${Math.round(ctx.raw).toLocaleString("it-IT")}`}}},scales:{...CO.scales,y:{...CO.scales?.y,ticks:{...CO.scales?.y?.ticks,callback:v=>agMode?v+" pz":"€ "+Math.round(v).toLocaleString("it-IT")}}}};
      mkChart("ch_aging","bar",anni,[{data:agData,backgroundColor:agColors,borderColor:agBorder,borderWidth:1.5,borderRadius:4}],{...agOpts,layout:{padding:{top:24}},plugins:{...agOpts.plugins,datalabels:{display:true,anchor:'end',align:'end',offset:2,color:'rgba(48,209,88,.9)',font:{family:"'DM Mono',monospace",size:10},formatter:v=>agMode?fmtShortPz(v)+' pz':fmtShort(v)}}});
      // Donut priorità
      const stats=ag.stats;
      const priData=agMode?[stats.U.pz,stats.A.pz,stats.M.pz,stats.O.pz]:[stats.U.v,stats.A.v,stats.M.v,stats.O.v];
      const priOpts={...coDon,plugins:{...coDon.plugins,tooltip:{callbacks:{label:ctx=>agMode?`${Math.round(ctx.raw)} pz`:`€ ${Math.round(ctx.raw).toLocaleString("it-IT")}`}}}};
      mkChart("ch_aging_pri","doughnut",["Urgente (>5 anni)","Alta (3-5 anni)","Media (2-3 anni)","OK (<2 anni)"],[{data:priData,backgroundColor:["rgba(255,69,58,.65)","rgba(255,159,10,.55)","rgba(48,209,88,.35)","rgba(48,209,88,.62)"],borderWidth:0,hoverOffset:6}],priOpts);

  if(ST.page==="lenti"&&window.__lenti){

      const showLbl=sz<=24;

      const lnL=document.documentElement.classList.contains('light');

        responsive:true,maintainAspectRatio:false,
        layout:{padding:{top:28,right:8}},
        interaction:{mode:'index',intersect:false},
        plugins:{
          datalabels:{
            display:ctx=>ctx.datasetIndex===0?showLbl&&ctx.dataset.data[ctx.dataIndex]>0:showLbl&&ctx.dataset.data[ctx.dataIndex]>0,
            anchor:ctx=>ctx.datasetIndex===0?'end':'center',
            align:ctx=>ctx.datasetIndex===0?'start':'top',
            offset:ctx=>ctx.datasetIndex===0?6:5,
            color:lnL?"rgba(15,23,42,.92)":'rgba(232,237,245,.95)',
            backgroundColor:ctx=>ctx.datasetIndex===0?(lnL?'rgba(21,128,61,.16)':'rgba(6,30,20,.68)'):(lnL?'rgba(8,145,178,.16)':'rgba(90,200,250,.28)'),
            borderRadius:5,padding:{top:2,bottom:2,left:6,right:6},
            font:ctx=>({family:"'DM Mono',monospace",size:ctx.datasetIndex===0?12:11,weight:'600'}),
            formatter:(v,ctx)=>ctx.datasetIndex===0?fmtShort(v):fmtShortPz(v)+' pz'
          },
          legend:{display:true,position:"top",align:"end",labels:{color:lnL?"rgba(15,23,42,.6)":"rgba(255,255,255,.45)",font:{family:"'DM Mono',monospace",size:10},boxWidth:8,padding:10,usePointStyle:true}},
          tooltip:{backgroundColor:lnL?"rgba(255,255,255,.97)":"rgba(0,0,0,.9)",borderColor:lnL?"rgba(15,23,42,.14)":"rgba(255,255,255,.1)",borderWidth:1,padding:11,titleColor:lnL?"rgba(15,23,42,.92)":"rgba(255,255,255,.9)",bodyColor:lnL?"rgba(15,23,42,.65)":"rgba(255,255,255,.65)",titleFont:{family:"'Sora',sans-serif",size:12,weight:"600"},bodyFont:{family:"'DM Mono',monospace",size:12}}
        },
        scales:{
          x:{grid:{color:lnGrid},ticks:{color:lnTick,font:{family:"'DM Mono',monospace",size:10},maxRotation:45},border:{display:false}},
          y:{grid:{color:lnGrid},ticks:{color:lnTick,font:{family:"'DM Mono',monospace",size:10},callback:v=>v===0?'':fmtShort(v)},border:{display:false}},
          y1:{position:"right",grid:{display:false},ticks:{color:lnL?"rgba(8,145,178,.75)":"rgba(90,200,250,.5)",font:{family:"'DM Mono',monospace",size:10},callback:v=>v===0?'':fmtShortPz(v)+' pz'},border:{display:false}}

        {type:"bar",label:"Fatturato (€)",data:ln.trendKeys.map(k=>Math.round(ln.trendAgg[k].val)),backgroundColor:"rgba(48,209,88,.22)",borderColor:"#30d158",borderWidth:1.5,borderRadius:4,yAxisID:"y"},
        {type:"line",label:"Pezzi",data:ln.trendKeys.map(k=>Math.round(ln.trendAgg[k].pz)),borderColor:"#5ac8fa",backgroundColor:"rgba(90,200,250,.08)",borderWidth:2,pointRadius:ln.trendStep==='A'?3:2,pointBackgroundColor:"#5ac8fa",tension:0.4,fill:false,yAxisID:"y1"}
      ],lentiTrendOpts);
    }
    // Donut tipi
    if(ln.tpSorted.length){
      const lentiColors=["#30d158","rgba(48,209,88,.7)","rgba(48,209,88,.5)","rgba(90,200,250,.7)","rgba(191,90,242,.6)","rgba(255,159,10,.5)"];
      const lentiDonTotal=ln.tpSorted.reduce((s,[,d])=>s+d.pz,0);

        {...coDon,plugins:{...coDon.plugins,
          datalabels:{display:ctx=>lentiDonTotal>0&&(ctx.dataset.data[ctx.dataIndex]/lentiDonTotal)>=0.05,formatter:v=>Math.round(v/lentiDonTotal*100)+'%',color:'rgba(0,0,0,.85)',font:{family:"'DM Mono',monospace",size:11,weight:'600'}},

  if(ST.page==="clienti"&&window.__cli){
    const cl=window.__cli;
    const clL=document.documentElement.classList.contains('light');
    const clGrid=clL?"rgba(15,23,42,.07)":"rgba(255,255,255,.04)";
    const coRet={...CO,plugins:{...CO.plugins,legend:{display:false},datalabels:{display:ctx=>ctx.dataset.data[ctx.dataIndex]>0,anchor:'end',align:'top',offset:2,color:clL?"rgba(15,23,42,.85)":'rgba(232,237,245,.85)',font:{family:"'DM Mono',monospace",size:10,weight:'600'},formatter:v=>v}},layout:{padding:{top:22,right:8}},scales:{x:{...CO.scales?.x,grid:{color:clGrid},ticks:{color:clL?"rgba(15,23,42,.55)":'rgba(255,255,255,.45)',font:{size:10}}},y:{...CO.scales?.y,grid:{color:clGrid},ticks:{color:clL?"rgba(15,23,42,.5)":'rgba(255,255,255,.4)',font:{size:10},callback:v=>v}}}};
    // Recency bar chart
    if(cl.hasVend&&document.getElementById('ch_cli_ret')){

      mkChart("ch_cli_eta","doughnut",cl.etaBrackets,[{data:etaN,backgroundColor:['rgba(90,200,250,.75)','rgba(48,209,88,.75)','rgba(255,159,10,.75)','rgba(191,90,242,.75)'],borderWidth:0,hoverOffset:6}],{...coDon,plugins:{...coDon.plugins,legend:{...coDon.plugins?.legend,position:'right'}}});
    }
    // Età mix bar chart (lenti/sole/vista per bracket)
    if(cl.hasEta&&document.getElementById('ch_cli_eta_mix')){
      const brs=cl.etaBrackets;
      mkChart("ch_cli_eta_mix","bar",brs,[
        {label:'Lenti',data:brs.map(b=>cl.etaData[b].nLenti),backgroundColor:'rgba(48,209,88,.6)',borderRadius:4,borderSkipped:false},
        {label:'Sole',data:brs.map(b=>cl.etaData[b].nSole),backgroundColor:'rgba(255,159,10,.6)',borderRadius:4,borderSkipped:false},
        {label:'Vista',data:brs.map(b=>cl.etaData[b].nVista),backgroundColor:'rgba(90,200,250,.6)',borderRadius:4,borderSkipped:false}
      ],{...CO,plugins:{...CO.plugins,legend:{display:true,labels:{color:clL?'rgba(15,23,42,.65)':'rgba(255,255,255,.65)',font:{size:10},boxWidth:10}},datalabels:{display:false}},scales:{x:{stacked:true,grid:{color:clGrid},ticks:{color:clL?'rgba(15,23,42,.55)':'rgba(255,255,255,.45)',font:{size:10}}},y:{stacked:true,grid:{color:clGrid},ticks:{color:clL?'rgba(15,23,42,.5)':'rgba(255,255,255,.4)',font:{size:10}}}}});
    }

// Chiama /api/ai in streaming; se il modello richiesto fallisce (spesso il
// modello "8B veloce" con prompt molto lunghi/carichi) ritenta UNA volta in
// automatico col modello "70B smart", che regge meglio contesti grandi.
async function callAI(payload,onToken){
  const tryOnce=async(model)=>{
    const resp=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,model})});
    if(!resp.ok){const e=await resp.json().catch(()=>({error:'HTTP '+resp.status}));throw new Error(e.error||('HTTP '+resp.status));}
    const reader=resp.body.getReader();const dec=new TextDecoder();let full='';let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const raw=line.slice(6).trim();if(raw==='[DONE]')break;
        try{const j=JSON.parse(raw);const tok=j.response||'';if(tok){full+=tok;onToken(full);}}catch{}
      }
    }
    if(!full.trim())throw new Error('Risposta vuota dal modello');
    return full;
  };
  const reqModel=payload.model||'fast';
  try{
    return{full:await tryOnce(reqModel),usedFallback:false};
  }catch(err){
    if(reqModel==='smart')throw err;
    onToken('');
    const full=await tryOnce('smart');
    return{full,usedFallback:true};
  }
}

      const root=aiBrandRoot(r.mar);const mar=(r.mar||'').trim();
      if(root){if(!byRootAll[root])byRootAll[root]={labels:{},pz:0,val:0};const a=byRootAll[root];if(mar)a.labels[mar]=(a.labels[mar]||0)+r.pz;a.pz+=r.pz;a.val+=r.val;}
      const mk=(r.mar||'')+' '+(r.mod||'');if(r.mod){if(!byModAll[mk])byModAll[mk]={pz:0,val:0};byModAll[mk].pz+=r.pz;byModAll[mk].val+=r.val;}
    });
    const topRootAll=Object.values(byRootAll).sort((a,b)=>b.pz-a.pz).slice(0,10);
    const topModAll=Object.entries(byModAll).sort((a,b)=>b[1].pz-a[1].pz).slice(0,10);
    if(topRootAll.length)ctx+=`Top marche occhiali per pezzi venduti (storico, linee aggregate): ${topRootAll.map(p=>`${aiPickLabel(p.labels)} ${p.pz}pz (€${Math.round(p.val).toLocaleString('it-IT')})`).join(', ')}\n`;
    if(topModAll.length)ctx+=`Top 10 modelli occhiali più venduti (storico): ${topModAll.map(([n,v])=>`${n.trim()} ${v.pz}pz (€${Math.round(v.val).toLocaleString('it-IT')})`).join(', ')}\n`;
    ctx+='\n';
  } else if(LIVE_VEND){
    ctx+=`=== VENDITE ===\nFile caricato ma senza date (analisi limitata). Clienti unici: ${LIVE_VEND.clienti}\n\n`;
  } else {
    ctx+=`=== VENDITE ===\nFile vendite NON caricato.\n\n`;
  }

  const mag=curMAG();
  const totMag=Object.values(mag.kpi||{}).reduce((a,v)=>a+(v.valore||0),0);
  ctx+=`=== MAGAZZINO ===\n`;
  ctx+=`Valore totale: €${Math.round(totMag).toLocaleString('it-IT')}\n`;
  ctx+=`Per sede: ${Object.entries(mag.kpi||{}).map(([k,v])=>`${k}: €${Math.round(v.valore||0).toLocaleString('it-IT')} (${v.pezzi||0}pz)`).join(' | ')}\n`;
  if(mag.brand?.length)ctx+=`Top brand stock: ${mag.brand.slice(0,8).map(b=>`${b.n} €${Math.round(b.v).toLocaleString('it-IT')}`).join(', ')}\n`;
  if(mag.forn?.length)ctx+=`Top fornitori stock: ${mag.forn.slice(0,5).map(f=>`${f.n} €${Math.round(f.v).toLocaleString('it-IT')}`).join(', ')}\n`;
  // Anzianità stock (U=oltre 3a, A=1-3a, M=6-12m, O=ok recente)
  if(mag.rows?.length){
    const byPri={};mag.rows.forEach(r=>{const k=r.pri||'O';if(!byPri[k])byPri[k]={v:0,q:0};byPri[k].v+=r.v;byPri[k].q+=r.q;});
    const priLbl={U:'oltre 3 anni fermo',A:'1-3 anni fermo',M:'6-12 mesi fermo',O:'recente/ok'};
    ctx+=`Anzianità stock: ${Object.entries(byPri).map(([k,v])=>`${priLbl[k]||k} €${Math.round(v.v).toLocaleString('it-IT')} (${Math.round(v.q)}pz)`).join(' | ')}\n`;
  }
  ctx+='\n';

  if(LIVE_ACQ&&LIVE_ACQ.rows?.length){
    ctx+=`=== ACQUISTI ===\n`;
    ctx+=`Totale storico: €${LIVE_ACQ.totVal.toLocaleString('it-IT')} | ${LIVE_ACQ.totPz.toLocaleString('it-IT')} pz\n`;
    const anniRecenti=Object.entries(LIVE_ACQ.byAnno||{}).sort((a,b)=>b[0]-a[0]).slice(0,4);
    if(anniRecenti.length)ctx+=`Ultimi anni: ${anniRecenti.map(([y,v])=>`${y}: €${Math.round(v.val).toLocaleString('it-IT')} (${Math.round(v.pz)}pz)`).join(' | ')}\n`;
    if(LIVE_ACQ.byTipo?.length)ctx+=`Per tipo prodotto: ${LIVE_ACQ.byTipo.slice(0,6).map(t=>`${t.n} €${t.val.toLocaleString('it-IT')}`).join(', ')}\n`;
    ctx+='\n';
  }

  // === STORICO CLIENTI (ordini, brand preferiti, filiale) ===
  if(LIVE_CLI&&LIVE_CLI.hasOrders){
    ctx+=`=== STORICO CLIENTI ===\n`;
    ctx+=`${fmtN(LIVE_CLI.totalCli)} clienti unici, ${fmtN(LIVE_CLI.totalOrdini)} ordini totali registrati\n`;
    const byBrandCli={};LIVE_CLI.cliList.forEach(c=>{if(!c.brandFav)return;byBrandCli[c.brandFav]=(byBrandCli[c.brandFav]||0)+1;});
    const topBrandCli=Object.entries(byBrandCli).sort((a,b)=>b[1]-a[1]).slice(0,10);
    if(topBrandCli.length)ctx+=`Brand preferiti (n. clienti che lo scelgono come preferito): ${topBrandCli.map(([n,c])=>`${n} (${c})`).join(', ')}\n`;
    const byLenteCli={};LIVE_CLI.cliList.forEach(c=>{if(!c.lenteFav)return;byLenteCli[c.lenteFav]=(byLenteCli[c.lenteFav]||0)+1;});
    const topLenteCli=Object.entries(byLenteCli).sort((a,b)=>b[1]-a[1]).slice(0,6);
    if(topLenteCli.length)ctx+=`Marche lenti preferite: ${topLenteCli.map(([n,c])=>`${n} (${c})`).join(', ')}\n`;
    const topSpender=[...LIVE_CLI.cliList].sort((a,b)=>b.totSpeso-a.totSpeso).slice(0,10).filter(c=>c.totSpeso>0);
    if(topSpender.length)ctx+=`Top 10 clienti per spesa storica: ${topSpender.map(c=>`${c.nome} €${fmtN(c.totSpeso)}`).join(', ')}\n`;
    const topOrdini=[...LIVE_CLI.cliList].sort((a,b)=>b.nOrdini-a.nOrdini).slice(0,10);
    if(topOrdini.length)ctx+=`Top 10 clienti per numero ordini: ${topOrdini.map(c=>`${c.nome} (${c.nOrdini})`).join(', ')}\n`;
    ctx+='\n';
  }

  // === RETENTION (calcolata dalle vendite datate, soglia 12 mesi) ===
  if(LIVE_VEND&&LIVE_VEND.hasDate){
    const ret=computeRetention(360,'agg');
    if(ret.nTot>0){
      const pctFid=Math.round((ret.nAttivi+ret.nRischio)/ret.nTot*100);
      const attivi=ret.retClients.filter(c=>c.status==='attivo');
      const avgValA=attivi.length?Math.round(attivi.reduce((a,c)=>a+c.totVal,0)/attivi.length):0;
      const persi=ret.retClients.filter(c=>c.status==='perso');
      const valPersiTot=Math.round(persi.reduce((a,c)=>a+c.totVal,0));
      ctx+=`=== RETENTION CLIENTI (soglia 12 mesi, su ${fmtN(ret.nTot)} clienti con date) ===\n`;
      ctx+=`Attivi (ultimi 6m): ${fmtN(ret.nAttivi)} | A rischio (6-12m assenti): ${fmtN(ret.nRischio)} | Persi (>12m assenti): ${fmtN(ret.nPersi)} | Nuovi (1 sola visita): ${fmtN(ret.nNuovi)}\n`;
      ctx+=`Tasso di fidelizzazione: ${pctFid}% | Fatturato medio cliente attivo: €${avgValA.toLocaleString('it-IT')}\n`;
      ctx+=`Fatturato storico "congelato" nei clienti persi: €${valPersiTot.toLocaleString('it-IT')} (opportunità di riattivazione)\n`;
      ctx+='\n';
    }
  }

  // === FASCE ETÀ (storico clienti abbinato per nome all'anagrafica età) ===
  if(LIVE_CLI&&LIVE_CLI.hasOrders&&LIVE_CLI_ANAG){
    const CYnow=now.getFullYear();
    const brackets={'<25':0,'25–44':0,'45–64':0,'65+':0};
    let matched=0;
    LIVE_CLI.cliList.forEach(c=>{
      const anag=c.matchKey?LIVE_CLI_ANAG.byName[c.matchKey]:null;
      if(!anag||!anag.eta)return;
      matched++;
      const br=anag.eta<25?'<25':anag.eta<45?'25–44':anag.eta<65?'45–64':'65+';
      brackets[br]++;
    });
    if(matched>0){
      ctx+=`=== FASCE ETÀ CLIENTI (${fmtN(matched)} clienti con età nota) ===\n`;
      ctx+=Object.entries(brackets).map(([b,n])=>`${b} anni: ${fmtN(n)} (${Math.round(n/matched*100)}%)`).join(' | ')+'\n\n';
    }
  }

  return ctx;
}

// ── Ricerca mirata condivisa (client-side "RAG" su dati strutturati) ───────
// Le funzioni buildXxxLookup() qui sotto cercano in tempo reale nell'intero
// archivio caricato (non solo nelle top-10 del riepilogo statico) le entità
// nominate nella domanda, e iniettano i loro dati veri nel prompt di quella
// singola richiesta. La ricerca usa l'intera conversazione recente (non solo
// l'ultimo messaggio): "chi ha comprato di più?" → "quanto ha speso?" deve
// continuare a trovare la stessa persona anche se il nome non è ripetuto.
const AI_STOPWORDS=new Set(['CLIENTE','CLIENTI','VENDITE','MAGAZZINO','ACQUISTI','QUESTO','QUESTA','QUESTI','QUESTE','QUANTO','QUANTI','QUANTE','COME','COSA','CHI','CHE','QUALE','QUALI','QUANDO','PERCHE','DOVE','SONO','ANNO','MESE','OGGI','IERI','TOTALE','FATTURATO','OCCHIALI','LENTI','LENTE','VISTA','SOLE','MARCA','MARCHIO','BRAND','NEGOZIO','SEDE','FILIALE','GRAZIE','CIAO','DIMMI','DAMMI','FAMMI','VOGLIO','VORREI','PUOI','POTRESTI','ABBIAMO','STOCK','PRODOTTO','PRODOTTI','MODELLO','MODELLI','VENDUTO','VENDUTI','VENDUTE','COMPRATO','SPESO','SPESA','CONFRONTO','CONFRONTA','PARAGONE','TABELLA','DIFFERENZA','MEGLIO','PIU','MENO','TRA','LORO','CON','PER','DEL','DELLA','DELLO','DEGLI','DELLE','NON','UNA','UNO','SUL','SULLA','NEL','NELLA','GLI','LEI','LUI','LORO','ORDINI','ORDINE','REGISTRATI','REGISTRATO','VISITE','VISITA','TOTALI'].map(w=>w));
function aiNorm(s){return s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function aiSearchWords(text){
  // Tiene anche le cifre (codici modello tipo "RB2140") oltre alle lettere.
  return aiNorm(text).replace(/[^A-Z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!AI_STOPWORDS.has(w));
}
// Versione più permissiva per marchi/modelli: soglia più bassa (Dior, YSL…
// sono corti) e mantiene i trattini (Ray-Ban) invece di spezzarli in
// frammenti troppo corti per essere cercati.
function aiSearchWordsLoose(text){
  return aiNorm(text).replace(/[^A-Z0-9\s-]/g,' ').split(/\s+/).map(w=>w.replace(/^-+|-+$/g,'')).filter(w=>w.length>=3&&!AI_STOPWORDS.has(w));
}
// Distanza di edit (Levenshtein) per tollerare piccoli refusi nei nomi di
// marca ("guci"→"gucci", "oackley"→"oakley").
function aiLev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);}[prev,cur]=[cur,prev];}
  return prev[n];
}
// Chiave-radice della marca = prima parola normalizzata SENZA trattini
// ("RAY-BAN VISTA" e "RAYBAN" → entrambe "RAYBAN"): aggrega tutte le linee di
// una marca (Vista/Sole/Junior) e le varianti col/senza trattino sotto un
// unico totale quando l'utente nomina la marca ombrello.
function aiBrandRoot(mar){return aiNorm(mar||'').split(/\s+/)[0].replace(/-/g,'');}
function aiBrandLabel(mar){return aiNorm(mar||'').split(/\s+/)[0];} // con trattino, per display
// Sceglie l'etichetta ombrello di una marca da un conteggio {nomeOriginale:pz}:
// meno parole possibile (la linea base, non "X Vista"), a parità più venduta
// (così "Ray-Ban" batte la marca-fantasma "RAYBAN" da 1 pezzo).
function aiPickLabel(counts){
  const e=Object.entries(counts);if(!e.length)return'?';
  e.sort((a,b)=>(a[0].split(/\s+/).length-b[0].split(/\s+/).length)||(b[1]-a[1]));
  return e[0][0];
}
// Radici di marca nominate nella domanda (tollera refusi minori).
function aiMatchBrandRoots(query){
  if(!LIVE_VEND||!query)return[];
  const roots=[...new Set(LIVE_VEND.rows.map(r=>aiBrandRoot(r.mar)).filter(r=>r&&r.length>=3))];
  const tokens=aiSearchWordsLoose(query).map(t=>t.replace(/-/g,''));
  const matched=new Set();
  roots.forEach(root=>{
    for(const t of tokens){
      if(t.length<3)continue;
      if(t===root){matched.add(root);break;}
      if(t.length>=4&&root.startsWith(t)){matched.add(root);break;}
      if(t.length>=4&&root.length>=4&&aiLev(t,root)<=1){matched.add(root);break;}
    }
  });
  return [...matched];
}
// Aggrega le vendite per radice di marca → totali ESATTI (storico + anno
// corrente + per sede). Il calcolo è fatto qui, non lasciato al modello.
function aiSalesByRoot(roots){
  const today=toISO(new Date());
  const agg={};
  LIVE_VEND.rows.forEach(r=>{
    const root=aiBrandRoot(r.mar);
    if(!roots.includes(root))return;
    if(!agg[root])agg[root]={root,labels:{},pz:0,val:0,pzY:0,valY:0,f:{},mods:{}};
    const a=agg[root];
    const mar=(r.mar||'').trim();if(mar)a.labels[mar]=(a.labels[mar]||0)+r.pz;
    a.pz+=r.pz;a.val+=r.val;a.f[r.fil]=(a.f[r.fil]||0)+r.pz;
    const mk=r.mod||'—';if(!a.mods[mk])a.mods[mk]={mod:mk,pz:0,val:0};a.mods[mk].pz+=r.pz;a.mods[mk].val+=r.val;
    if(r.dt&&r.dt>=CY+'-01-01'&&r.dt<=today){a.pzY+=r.pz;a.valY+=r.val;}
  });
  Object.values(agg).forEach(a=>{a.label=aiPickLabel(a.labels);});
  return Object.values(agg).sort((x,y)=>y.pz-x.pz);
}

function buildClientLookup(query){
  if(!LIVE_CLI||!LIVE_CLI.hasOrders||!query)return'';
  const words=aiSearchWords(query);
  if(!words.length)return'';
  const norm=aiNorm;
  // Confronto per parola intera (o prefisso di una parola del nome), non
  // sottostringa libera: altrimenti parole comuni come "che" combaciano per
  // caso dentro nomi come "MiCHEle"/"MiCHEla", falsando la ricerca.
  const scored=LIVE_CLI.cliList.map(c=>{
    const nameWords=norm(c.nome).split(/\s+/);
    const hits=words.filter(w=>nameWords.some(nw=>nw===w||nw.startsWith(w))).length;
    return{c,hits};
  }).filter(x=>x.hits>0).sort((a,b)=>b.hits-a.hits).slice(0,5);
  if(!scored.length)return'';
  // Fatturato/status reali: la stessa fonte (vendite datate) usata dalla
  // scheda cliente in Clienti → Retention, non lo storico ordini (che ha
  // gli importi quasi sempre a zero e darebbe un fatturato fuorviante).
  const ret=(LIVE_VEND&&LIVE_VEND.hasDate)?computeRetention(360,'agg'):null;
  const retByCode=ret?Object.fromEntries(ret.retClients.map(r=>[r.cli,r])):{};
  const statusLbl={attivo:'attivo',rischio:'a rischio abbandono',perso:'perso (assente da tempo)',nuovo:'nuovo (1 sola visita)'};
  let out='\n=== CLIENTI TROVATI (ricerca automatica per nome nella domanda) ===\n';
  scored.forEach(({c})=>{
    const rc=retByCode[c.cod];
    out+=`${c.nome} (cod. ${c.cod}, filiale ${c.filiale||'—'}): ${c.nOrdini} ordini registrati, prima visita ${c.firstDt||'—'}, ultima visita ${c.lastDt||'—'}, brand preferito: ${c.brandFav||'—'}, lente preferita: ${c.lenteFav||'—'}, vista: ${c.nVista||0}, sole: ${c.nSole||0}, lenti: ${c.nLenti||0}`;
    if(rc)out+=` | FATTURATO REALE (da vendite): €${fmtN(rc.totVal)}, ${rc.nVisits} visite registrate, status: ${statusLbl[rc.status]||rc.status}`;
    else out+=` | fatturato non disponibile nelle vendite datate per questo codice cliente`;
    out+='\n';
  });
  out+='(Per il fatturato usa SEMPRE il valore "FATTURATO REALE" quando presente, è quello mostrato nella scheda cliente dell\'app. Se il nome cercato non compare esattamente in questa lista, il cliente NON è nell\'archivio: dillo chiaramente invece di confonderlo con uno dei nomi simili sopra.)\n';
  return out;
}

// Stessa logica di buildClientLookup ma sul magazzino: se l'utente nomina
// un brand/modello nella domanda, cerca le righe reali corrispondenti
// invece di limitarsi alla top-8 marche già presenti nel riepilogo statico.
function buildProductLookup(query){
  const mag=curMAG();
  if(!mag||!mag.rows?.length||!query)return'';
  const norm=aiNorm;
  // Se la domanda nomina delle marche, dai anche lo stock totale per marca
  // (già sommato), oltre ai singoli modelli.
  const roots=aiMatchBrandRoots(query);
  let out='';
  if(roots.length){
    const byRoot={};
    mag.rows.forEach(r=>{const root=aiBrandRoot(r.m);if(!roots.includes(root))return;if(!byRoot[root])byRoot[root]={root,q:0,v:0,f:{}};byRoot[root].q+=r.q;byRoot[root].v+=r.v;byRoot[root].f[r.f]=(byRoot[root].f[r.f]||0)+r.q;});
    const list=Object.values(byRoot).sort((a,b)=>b.v-a.v);
    if(list.length){
      out+='\n=== DATI GIÀ CALCOLATI — STOCK MAGAZZINO PER MARCA (totali esatti, non ricalcolare) ===\n';
      out+='| Marca | Pz in stock | Valore stock | Per sede (pz) |\n|---|---|---|---|\n';
      list.forEach(p=>out+=`| ${p.root} | ${fmtN(p.q)} | €${fmtN(p.v)} | ${Object.entries(p.f).sort((a,b)=>b[1]-a[1]).map(([s,q])=>s+': '+fmtN(q)).join(', ')} |\n`);
    }
  }
  const words=aiSearchWordsLoose(query);
  if(words.length){
    const matches=mag.rows.filter(r=>{const hay=norm((r.m||'')+' '+(r.mod||''));return words.some(w=>hay.includes(w));});
    if(matches.length){
      const agg={};
      matches.forEach(r=>{const k=`${r.m}|${r.mod}`;if(!agg[k])agg[k]={m:r.m,mod:r.mod,q:0,v:0,f:{}};agg[k].q+=r.q;agg[k].v+=r.v;agg[k].f[r.f]=(agg[k].f[r.f]||0)+r.q;});
      const list=Object.values(agg).sort((a,b)=>b.v-a.v).slice(0,12);
      out+='\n=== MODELLI TROVATI IN MAGAZZINO — STOCK PER MODELLO ===\n';
      list.forEach(p=>out+=`${p.m} ${p.mod}: ${p.q} pz in stock, valore €${fmtN(p.v)}, per sede: ${Object.entries(p.f).map(([s,q])=>`${s}: ${q}pz`).join(' | ')}\n`);
    }
  }
  return out;
}

// Ricerca sulle VENDITE (quanti pezzi venduti, non stock). Il sistema
// calcola qui i totali esatti per marca e li fornisce già pronti: il
// modello deve solo riportarli, MAI ricalcolarli o sommare righe a mano.
function buildSalesLookup(query){
  if(!LIVE_VEND||!query)return'';
  // 1) Se la domanda nomina una o più MARCHE → totali per marca (ombrello).
  const roots=aiMatchBrandRoots(query);
  if(roots.length){
    const list=aiSalesByRoot(roots);
    if(!list.length)return'';
    let out='\n=== DATI GIÀ CALCOLATI DAL SISTEMA — VENDITE PER MARCA (totali esatti) ===\n';
    out+='ATTENZIONE: questi totali sono già sommati e corretti dal sistema. Riportali ESATTAMENTE così come sono. NON ricalcolare, NON sommare righe di modelli a mano, NON stimare.\n';
    out+='| Marca | Pz venduti (storico) | Fatturato (storico) | Pz '+CY+' | Fatturato '+CY+' | Per sede (pz) |\n|---|---|---|---|---|---|\n';
    list.forEach(p=>{
      out+=`| ${p.label} | ${fmtN(p.pz)} | €${fmtN(p.val)} | ${fmtN(p.pzY)} | €${fmtN(p.valY)} | ${Object.entries(p.f).sort((a,b)=>b[1]-a[1]).map(([s,q])=>s+': '+fmtN(q)).join(', ')} |\n`;
    });
    list.forEach(p=>{
      const top=Object.values(p.mods).sort((a,b)=>b.pz-a.pz).slice(0,5);
      if(top.length)out+=`Modelli ${p.label} più venduti: ${top.map(m=>`${m.mod} (${fmtN(m.pz)}pz, €${fmtN(m.val)})`).join('; ')}\n`;
    });
    // Ripartizione anno per anno di ogni marca cercata → risponde ai confronti
    // "marca anno X vs anno Y" (es. "Oakley 25 vs 26") con dati esatti per
    // ogni anno, non solo storico+anno corrente.
    const years=[...new Set(LIVE_VEND.rows.map(r=>r.yr).filter(Boolean))].sort();
    if(years.length>1){
      const perYear={};
      LIVE_VEND.rows.forEach(r=>{const root=aiBrandRoot(r.mar);if(!roots.includes(root)||!r.yr)return;(perYear[root]||(perYear[root]={}));(perYear[root][r.yr]||(perYear[root][r.yr]={pz:0,val:0}));perYear[root][r.yr].pz+=r.pz;perYear[root][r.yr].val+=r.val;});
      out+='\nVENDITE PER ANNO (pezzi ed €, dato esatto per ogni anno):\n| Marca | '+years.join(' | ')+' |\n|'+['---'].concat(years.map(()=>'---')).join('|')+'|\n';
      list.forEach(p=>{const cells=years.map(y=>{const d=perYear[p.root]&&perYear[p.root][y];return d?`${fmtN(d.pz)}pz (€${fmtN(d.val)})`:'0';});out+=`| ${p.label} | ${cells.join(' | ')} |\n`;});
    }
    out+='Se l\'utente chiede un confronto tra anni, usa la tabella "VENDITE PER ANNO" con i valori esatti di ciascun anno. Se chiede un confronto tra marche, usa la prima tabella. Non dire mai "non disponibile" per un anno che è presente nella tabella VENDITE PER ANNO.\n';
    return out;
  }
  // 2) Nessuna marca riconosciuta → cerca per modello/codice specifico.
  const words=aiSearchWordsLoose(query);
  if(!words.length)return'';
  const norm=aiNorm;
  const matches=LIVE_VEND.rows.filter(r=>{const hay=norm((r.mar||'')+' '+(r.mod||''));return words.some(w=>hay.includes(w));});
  if(!matches.length)return'';
  const agg={};
  matches.forEach(r=>{const k=`${r.mar||'—'}|${r.mod||'—'}`;if(!agg[k])agg[k]={mar:r.mar||'—',mod:r.mod||'—',pz:0,val:0};agg[k].pz+=r.pz;agg[k].val+=r.val;});
  const list=Object.values(agg).sort((a,b)=>b.pz-a.pz).slice(0,15);
  let out='\n=== DATI GIÀ CALCOLATI — MODELLI TROVATI NELLE VENDITE (totali esatti, non ricalcolare) ===\n';
  out+='| Marca | Modello | Pz venduti | Fatturato |\n|---|---|---|---|\n';
  list.forEach(p=>out+=`| ${p.mar} | ${p.mod} | ${fmtN(p.pz)} | €${fmtN(p.val)} |\n`);
  return out;
}

// Motore analitico deterministico: rileva PERIODO (anno/mese/YTD), TIPO
// (vista/sole/lenti) e INTENTO (classifica modelli/marche, giorno della
// settimana, stagionalità) dalla domanda, e calcola la risposta ESATTA già
// filtrata. Copre le domande "top/classifica ... nel <anno>", "quale giorno
// si vende di più", "andamento per mese" — che il modello da solo sbaglia.
function buildAnalyticsLookup(query){
  if(!LIVE_VEND||!LIVE_VEND.hasDate||!query)return'';
  const q=aiNorm(query);
  const rows=LIVE_VEND.rows;
  const today=toISO(new Date());
  let out='';

  // Periodo — riconosce anche gli anni a 2 cifre ("25"→2025, "26"→2026).
  let from=null,to=null,periodLbl='intero storico';
  let ym=q.match(/\b(20[12]\d)\b/);
  if(!ym){const two=q.match(/\b(2[0-6])\b/);if(two)ym=[two[0],'20'+two[1]];}
  if(/QUESTO MESE|MESE CORRENTE/.test(q)){from=`${CY}-${String(CM+1).padStart(2,'0')}-01`;to=today;periodLbl=`${MESI[CM]} ${CY}`;}
  else if(/ANNO SCORSO|SCORSO ANNO|ANNO PRECEDENTE/.test(q)){from=`${CY-1}-01-01`;to=`${CY-1}-12-31`;periodLbl=`${CY-1}`;}
  else if(/QUEST ANNO|ANNO CORRENTE|\bYTD\b/.test(q)||(ym&&+ym[1]===CY)){from=`${CY}-01-01`;to=today;periodLbl=`${CY} (da inizio anno)`;}
  else if(ym){from=`${ym[1]}-01-01`;to=`${ym[1]}-12-31`;periodLbl=ym[1];}
  else if(/ULTIMI 12|ULTIMO ANNO/.test(q)){const d=new Date();d.setDate(d.getDate()-365);from=toISO(d);to=today;periodLbl='ultimi 12 mesi';}
  const inPeriod=r=>!from||(r.dt&&r.dt>=from&&r.dt<=to);

  // Tipo prodotto
  let typeFilter,typeLbl='';
  if(/MONTATUR|\bVISTA\b/.test(q)&&!/\bSOLE\b/.test(q)){typeFilter=r=>r.tp==='Montature vista';typeLbl=' vista';}
  else if(/\bSOLE\b|DA SOLE/.test(q)&&!/\bVISTA\b/.test(q)){typeFilter=r=>r.tp==='Occhiali sole';typeLbl=' da sole';}
  else if(/\bLENTI\b|LENTE/.test(q)){typeFilter=r=>r.tp&&r.tp.startsWith('Lenti');typeLbl=' lenti';}
  else {typeFilter=r=>r.tp==='Montature vista'||r.tp==='Occhiali sole';}
  const sel=rows.filter(r=>inPeriod(r)&&typeFilter(r));

  // Giorno della settimana
  if(/GIORNO|GIORNI|SETTIMANA|WEEKEND|FERIAL/.test(q)){
    const wd=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    const byWd={};sel.forEach(r=>{if(!r.dt)return;const[y,mo,da]=r.dt.split('-').map(Number);const d=new Date(y,mo-1,da).getDay();byWd[d]=(byWd[d]||0)+r.pz;});
    const tot=Object.values(byWd).reduce((a,b)=>a+b,0);
    if(tot>0){
      out+=`\n=== DATI GIÀ CALCOLATI — VENDITE PER GIORNO DELLA SETTIMANA (${periodLbl}${typeLbl}, pezzi) ===\n| Giorno | Pz venduti | % |\n|---|---|---|\n`;
      [1,2,3,4,5,6,0].forEach(d=>{if(byWd[d])out+=`| ${wd[d]} | ${fmtN(byWd[d])} | ${Math.round(byWd[d]/tot*100)}% |\n`;});
    }
  }

  // Classifica modelli / marche
  const wantsRanking=/CLASSIFIC|\bTOP\b|PIU VENDUT|MENO VENDUT|MIGLIOR|PEGGIOR|BEST SELLER|VENDE DI PIU|VENDONO DI PIU|VENDUTI|VENDUTE/.test(q);
  const wantsBrands=/MARCH|BRAND/.test(q)&&!/MODELL|OCCHIAL/.test(q);
  if(wantsRanking){
    if(wantsBrands){
      const agg={};sel.forEach(r=>{const root=aiBrandRoot(r.mar);if(!root)return;if(!agg[root])agg[root]={labels:{},pz:0,val:0};const a=agg[root];const m=(r.mar||'').trim();if(m)a.labels[m]=(a.labels[m]||0)+r.pz;a.pz+=r.pz;a.val+=r.val;});
      const list=Object.values(agg).sort((a,b)=>b.pz-a.pz).slice(0,10);
      if(list.length){out+=`\n=== DATI GIÀ CALCOLATI — TOP MARCHE${typeLbl.toUpperCase()} (${periodLbl}) ===\n| # | Marca | Pz venduti | Fatturato |\n|---|---|---|---|\n`;list.forEach((p,i)=>out+=`| ${i+1} | ${aiPickLabel(p.labels)} | ${fmtN(p.pz)} | €${fmtN(p.val)} |\n`);}
    } else {
      const agg={};sel.forEach(r=>{if(!r.mod)return;const k=((r.mar||'')+' '+r.mod).trim();if(!agg[k])agg[k]={k,pz:0,val:0};agg[k].pz+=r.pz;agg[k].val+=r.val;});
      const list=Object.values(agg).sort((a,b)=>b.pz-a.pz).slice(0,10);
      if(list.length){out+=`\n=== DATI GIÀ CALCOLATI — TOP 10 MODELLI${typeLbl.toUpperCase()} PIÙ VENDUTI (${periodLbl}) ===\n| # | Modello | Pz venduti | Fatturato |\n|---|---|---|---|\n`;list.forEach((p,i)=>out+=`| ${i+1} | ${p.k} | ${fmtN(p.pz)} | €${fmtN(p.val)} |\n`);}
    }
  }

  // Andamento per mese / stagionalità
  if(/PER MESE|MENSIL|STAGIONAL|MESE MIGLIOR|MESE PEGGIOR|ANDAMENTO MESE/.test(q)){
    const byMo={};sel.forEach(r=>{if(!r.dt)return;byMo[+r.dt.slice(5,7)]=(byMo[+r.dt.slice(5,7)]||0)+r.pz;});
    if(Object.keys(byMo).length){out+=`\n=== DATI GIÀ CALCOLATI — VENDITE PER MESE (${periodLbl}${typeLbl}, pezzi) ===\n| Mese | Pz |\n|---|---|\n`;for(let m=1;m<=12;m++)if(byMo[m])out+=`| ${MESI[m-1]} | ${fmtN(byMo[m])} |\n`;}
  }

  if(out)out='\n(Le sezioni "DATI GIÀ CALCOLATI" qui sotto sono la risposta diretta alla domanda, già filtrate per il periodo/tipo richiesto: usale tali e quali, non ricalcolare.)'+out;
  return out;
}

// ═══ MOTORE DI QUERY GENERICO ("chat con i tuoi dati") ══════════════════════
// L'AI traduce la domanda in una query JSON; QUESTO codice la esegue in modo
// esatto sui dati completi e restituisce il risultato. Così si può rispondere
// a domande arbitrarie senza chiedere al modello di fare aggregazioni (che
// sbaglia). Nessun eval: solo un piccolo interprete sicuro.

// Righe clienti arricchite col fatturato reale (da retention) per le query.
function aiClientiRows(){
  const ret=(LIVE_VEND&&LIVE_VEND.hasDate)?computeRetention(360,'agg'):null;
  const byCode=ret?Object.fromEntries(ret.retClients.map(r=>[r.cli,r])):{};
  return (LIVE_CLI?.cliList||[]).map(c=>{const r=byCode[c.cod]||{};return{
    nome:c.nome,codice:c.cod,filiale:c.filiale,ordini:c.nOrdini||0,vista:c.nVista||0,sole:c.nSole||0,lenti:c.nLenti||0,
    brand:c.brandFav||'',lente:c.lenteFav||'',primavisita:c.firstDt||'',ultimavisita:c.lastDt||'',
    fatturato:r.totVal||0,visite:r.nVisits||0,status:r.status||'sconosciuto'};});
}
// Mappa marca → etichetta ombrello, per raggruppare le linee (Vista/Sole).
let AI_MARCA_MAP=null;
function aiMarcaMap(){
  if(AI_MARCA_MAP)return AI_MARCA_MAP;
  AI_MARCA_MAP={};
  if(LIVE_VEND){
    const roots=[...new Set(LIVE_VEND.rows.map(r=>aiBrandRoot(r.mar)).filter(Boolean))];
    aiSalesByRoot(roots).forEach(p=>{Object.keys(p.mods);});
    // ricostruisci label per root
    const byRoot={};LIVE_VEND.rows.forEach(r=>{const root=aiBrandRoot(r.mar);if(!root)return;const m=(r.mar||'').trim();if(!byRoot[root])byRoot[root]={};if(m)byRoot[root][m]=(byRoot[root][m]||0)+r.pz;});
    Object.entries(byRoot).forEach(([root,labels])=>{const lab=aiPickLabel(labels);Object.keys(labels).forEach(m=>AI_MARCA_MAP[m]=lab);});
  }
  return AI_MARCA_MAP;
}
// Definizione dei dataset interrogabili + accessor dei campi (con sinonimi).
function aiDataset(name){
  const mm=aiMarcaMap();
  if(name==='vendite'){
    if(!LIVE_VEND)return null;
    return{rows:LIVE_VEND.rows,get:(r,f)=>{switch(f){
      case'tipo':case'tp':case'prodotto':case'tipoprodotto':return r.tp;
      case'marca':case'brand':return mm[(r.mar||'').trim()]||r.mar;
      case'linea':return r.mar;
      case'modello':case'mod':case'occhiale':return((r.mar||'')+' '+(r.mod||'')).trim();
      case'filiale':case'sede':case'fil':case'negozio':return r.fil;
      case'operatore':case'op':case'venditore':return r.op;
      case'cliente':case'cli':case'codicecliente':return r.cli;
      case'anno':case'yr':return r.yr;
      case'mese':case'mo':return r.mo;
      case'data':case'dt':return r.dt;
      case'pezzi':case'pz':case'quantita':case'qta':case'venduti':return r.pz;
      case'fatturato':case'valore':case'val':case'ricavo':case'euro':return r.val;
      case'costo':case'acq':case'acquisto':return r.acq;
      default:return r[f];}}};
  }
  if(name==='magazzino'){
    const mag=curMAG();if(!mag||!mag.rows)return null;
    return{rows:mag.rows,get:(r,f)=>{switch(f){
      case'marca':case'brand':return r.m;
      case'modello':case'mod':return r.mod;
      case'categoria':case'cat':case'tipo':return r.cat;
      case'fornitore':case'forn':return r.forn;
      case'filiale':case'sede':case'f':case'negozio':return r.f;
      case'anno':return r.anno;case'anzianita':case'pri':return r.pri;
      case'pezzi':case'pz':case'stock':case'quantita':case'giacenza':return r.q;
      case'valore':case'v':case'euro':return r.v;
      case'costo':case'c':return r.c;
      case'data':case'd':return r.d;
      default:return r[f];}}};
  }
  if(name==='clienti'){
    const rows=aiClientiRows();if(!rows.length)return null;
    return{rows,get:(r,f)=>{const k=f.toLowerCase();return r[k]!==undefined?r[k]:r[f];}};
  }
  return null;
}
function aiCmp(a,b){if(a==null&&b==null)return 0;if(a==null)return -1;if(b==null)return 1;if(typeof a==='number'&&typeof b==='number')return a-b;return String(a).localeCompare(String(b));}
function aiMatchCond(ds,r,c){
  const v=ds.get(r,String(c.field||'').toLowerCase());const val=c.value;
  const num=parseFloat(val);const isNum=typeof v==='number'&&!isNaN(num);
  const U=x=>aiNorm(String(x==null?'':x));
  switch((c.op||'=').toLowerCase()){
    case'=':case'==':case'eq':return isNum?v===num:U(v)===U(val);
    case'!=':case'ne':return isNum?v!==num:U(v)!==U(val);
    case'>':case'gt':return v>num;case'>=':case'gte':return v>=num;
    case'<':case'lt':return v<num;case'<=':case'lte':return v<=num;
    case'contains':case'like':return U(v).includes(U(val));
    case'startswith':return U(v).startsWith(U(val));
    case'in':return (Array.isArray(val)?val:String(val).split(',')).some(x=>U(x)===U(v));
    default:return false;
  }
}
function aiAgg(rows,ds,m){
  const fn=(m.fn||'count').toLowerCase();const field=String(m.field||'').toLowerCase();
  if(fn==='count')return rows.length;
  const vals=rows.map(r=>ds.get(r,field)).filter(v=>v!=null&&v!=='');
  if(fn==='countdistinct'||fn==='distinct')return new Set(vals.map(String)).size;
  const nums=vals.map(Number).filter(v=>!isNaN(v));
  if(fn==='sum')return Math.round(nums.reduce((a,b)=>a+b,0));
  if(fn==='avg'||fn==='media')return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):0;
  if(fn==='min')return nums.length?Math.min(...nums):0;
  if(fn==='max')return nums.length?Math.max(...nums):0;
  return 0;
}
function runDataQuery(spec){
  if(!spec||typeof spec!=='object')return null;
  const ds=aiDataset(String(spec.dataset||'').toLowerCase());
  if(!ds)return null;
  let rows=ds.rows.filter(r=>(spec.where||spec.filter||[]).every(c=>aiMatchCond(ds,r,c)));
  const metrics=(spec.metrics&&spec.metrics.length)?spec.metrics:null;
  const groupBy=spec.groupBy?(Array.isArray(spec.groupBy)?spec.groupBy:[spec.groupBy]).map(g=>String(g).toLowerCase()):null;
  let cols,outRows;
  if(groupBy){
    const groups={};
    rows.forEach(r=>{const kv=groupBy.map(g=>ds.get(r,g));const key=kv.map(String).join(' | ');(groups[key]||(groups[key]={kv,rows:[]})).rows.push(r);});
    const ms=metrics||[{fn:'sum',field:'pezzi',as:'pezzi'},{fn:'sum',field:'fatturato',as:'fatturato'}];
    outRows=Object.values(groups).map(g=>{const o={};groupBy.forEach((gb,i)=>o[gb]=g.kv[i]);ms.forEach(m=>o[m.as||m.fn]=aiAgg(g.rows,ds,m));return o;});
    cols=[...groupBy,...ms.map(m=>m.as||m.fn)];
    const ob=spec.orderBy||spec.sort;const sortKey=ob?(ob.by||ob.field||cols[groupBy.length]):cols[groupBy.length];
    const dir=(ob&&(ob.dir||ob.order)||'desc').toLowerCase()==='asc'?1:-1;
    outRows.sort((a,b)=>dir*aiCmp(a[sortKey],b[sortKey]));
    outRows=outRows.slice(0,spec.limit||20);
  } else if(metrics){
    const o={};metrics.forEach(m=>o[m.as||m.fn]=aiAgg(rows,ds,m));
    cols=metrics.map(m=>m.as||m.fn);outRows=[o];
  } else {
    const sel=spec.select?spec.select.map(s=>String(s).toLowerCase()):null;
    const ob=spec.orderBy||spec.sort;
    if(ob){const k=(ob.by||ob.field);const dir=((ob.dir||ob.order)||'desc').toLowerCase()==='asc'?1:-1;rows=[...rows].sort((a,b)=>dir*aiCmp(ds.get(a,String(k).toLowerCase()),ds.get(b,String(k).toLowerCase())));}
    const lim=spec.limit||15;
    cols=sel||['marca','modello','pezzi','fatturato'];
    outRows=rows.slice(0,lim).map(r=>{const o={};cols.forEach(c=>o[c]=ds.get(r,c));return o;});
  }
  return{cols,rows:outRows,matched:rows.length};
}
// Schema passato al modello nel primo passaggio (traduzione domanda→query).
function aiQuerySchema(){
  const anni=LIVE_VEND?[...new Set(LIVE_VEND.rows.map(r=>r.yr).filter(Boolean))].sort():[];
  return `DATASET DISPONIBILI E CAMPI:
- "vendite" (ogni riga = un articolo venduto): tipo ("Montature vista"|"Occhiali sole"|"Lenti monofocali"|"Lenti progressive"|...), marca, modello, filiale ("A"|"B"), operatore, cliente, anno (${anni.join(',')}), mese (1-12), data, pezzi, fatturato, costo
- "magazzino" (stock attuale): marca, modello, categoria, fornitore, filiale, anzianita, pezzi, valore
- "clienti" (uno per cliente): nome, codice, filiale, ordini, vista, sole, lenti, brand, lente, fatturato, visite, status ("attivo"|"rischio"|"perso"|"nuovo"), primavisita, ultimavisita
FORMATO QUERY (JSON):
{"dataset":"vendite","where":[{"field":"anno","op":"=","value":2026},{"field":"tipo","op":"=","value":"Occhiali sole"}],"groupBy":"modello","metrics":[{"fn":"sum","field":"pezzi","as":"pezzi"},{"fn":"sum","field":"fatturato","as":"fatturato"}],"orderBy":{"by":"pezzi","dir":"desc"},"limit":10}
Operatori where: = != > >= < <= contains startswith in. Funzioni metrics: sum, count, avg, min, max, countDistinct.
ESEMPI:
- "top 10 occhiali da sole venduti nel 2026" → {"dataset":"vendite","where":[{"field":"anno","op":"=","value":2026},{"field":"tipo","op":"=","value":"Occhiali sole"}],"groupBy":"modello","metrics":[{"fn":"sum","field":"pezzi","as":"pezzi"}],"orderBy":{"by":"pezzi","dir":"desc"},"limit":10}
- "quanto ha fatturato la filiale A" → {"dataset":"vendite","where":[{"field":"filiale","op":"=","value":"A"}],"metrics":[{"fn":"sum","field":"fatturato","as":"fatturato"}]}
- "clienti persi che hanno speso più di 500 euro" → {"dataset":"clienti","where":[{"field":"status","op":"=","value":"perso"},{"field":"fatturato","op":">","value":500}],"orderBy":{"by":"fatturato","dir":"desc"},"limit":20}
- "quante montature Gucci abbiamo in magazzino" → {"dataset":"magazzino","where":[{"field":"marca","op":"contains","value":"Gucci"}],"metrics":[{"fn":"sum","field":"pezzi","as":"pezzi"}]}
- "vendite Oakley 2025 vs 2026" (confronto tra anni di una marca) → {"dataset":"vendite","where":[{"field":"marca","op":"contains","value":"Oakley"}],"groupBy":"anno","metrics":[{"fn":"sum","field":"pezzi","as":"pezzi"},{"fn":"sum","field":"fatturato","as":"fatturato"}],"orderBy":{"by":"anno","dir":"asc"}}
NOTA: gli anni a 2 cifre vanno espansi ("25"=2025, "26"=2026). Per confrontare più anni usa groupBy:"anno" così ottieni una riga per anno.`;
}
function aiQueryPlannerPrompt(){
  return `Sei un traduttore da domanda a query sui dati di un negozio di ottica. Dato lo schema e la domanda dell'utente, restituisci ESCLUSIVAMENTE un oggetto JSON valido con la query (nessun testo prima o dopo, niente markdown). Se la domanda NON richiede un calcolo sui dati (saluto, chiacchiera, richiesta di consiglio generico), restituisci esattamente la parola NONE.
${aiQuerySchema()}
Regola: usa SOLO i nomi di campo elencati. Rispondi con il solo JSON o NONE.`;
}
function renderQueryResult(spec,res){
  if(!res||!res.rows||!res.rows.length)return'\n=== RISULTATO QUERY: nessun dato corrisponde ai criteri richiesti ===\n';
  let out='\n=== RISULTATO ESATTO DELLA QUERY (calcolato dal sistema sui dati completi — usa questi numeri, sono corretti) ===\n';
  out+=`(${res.matched} righe corrispondono ai filtri)\n`;
  out+='| '+res.cols.join(' | ')+' |\n|'+res.cols.map(()=>'---').join('|')+'|\n';
  const rawCol=c=>/^(anno|mese|year|month|codice)$/i.test(c);
  res.rows.forEach(r=>{out+='| '+res.cols.map(c=>{const v=r[c];if(v==null)return'—';if(typeof v==='number')return rawCol(c)?String(v):fmtN(v);return v;}).join(' | ')+' |\n';});
  out+='Rispondi alla domanda dell\'utente usando ESATTAMENTE questi risultati. Se ci sono più righe presentali in tabella markdown. Non ricalcolare, non aggiungere numeri non presenti qui.\n';
  return out;
}

function aiMsgHtml(role,text,typing=false){
