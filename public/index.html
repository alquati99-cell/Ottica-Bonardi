<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottica Bonardi — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#080d1a;--gl:rgba(255,255,255,.055);--b:rgba(255,255,255,.1);--bb:rgba(255,255,255,.22);--t:#f0f4ff;--m:rgba(240,244,255,.45);--d:rgba(240,244,255,.2);--cy:#22d3ee;--em:#34d399;--am:#fbbf24;--vi:#a78bfa;--ro:#fb7185;--r:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 20s ease-in-out infinite alternate}
.b1{width:600px;height:600px;background:rgba(34,211,238,.1);top:-200px;right:-80px;animation-duration:22s}
.b2{width:500px;height:500px;background:rgba(139,92,246,.09);bottom:-100px;left:-100px;animation-duration:28s;animation-delay:-10s}
.b3{width:320px;height:320px;background:rgba(251,191,36,.07);top:45%;right:25%;animation-duration:16s;animation-delay:-5s}
.b4{width:380px;height:380px;background:rgba(52,211,153,.07);bottom:5%;right:-60px;animation-duration:24s;animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,70px) scale(1.1)}}
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sb{width:214px;flex-shrink:0;border-right:0.5px solid var(--b);display:flex;flex-direction:column;backdrop-filter:blur(24px);background:rgba(8,13,26,.65);position:sticky;top:0;height:100vh;overflow:hidden}
.sb-logo{padding:20px 20px 18px;border-bottom:0.5px solid var(--b)}
.sb-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--cy),var(--em));display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:9px;box-shadow:0 0 20px rgba(34,211,238,.2)}
.sb-logo h1{font-size:13px;font-weight:600}
.sb-logo p{font-size:10px;color:var(--m);margin-top:1px}
.nb{display:flex;align-items:center;gap:9px;padding:9px 20px;background:none;border:none;cursor:pointer;color:var(--m);font-size:13px;font-family:'Sora',sans-serif;width:100%;text-align:left;transition:color .15s,background .15s;position:relative}
.nb:hover{color:var(--t);background:rgba(255,255,255,.04)}
.nb.active{color:var(--t);font-weight:500}
.nb.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:linear-gradient(180deg,var(--cy),var(--em));border-radius:0 2px 2px 0}
.nb-ic{font-size:14px;width:16px;text-align:center;flex-shrink:0}
.sb-nav{padding:10px 0;flex:1}
.sb-vista{padding:14px 16px 20px;border-top:0.5px solid var(--b);margin-top:auto}
.sb-vista-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--d);margin-bottom:10px}
.sede-pills{display:flex;gap:4px;flex-wrap:wrap}
.sp{padding:5px 10px;border-radius:8px;border:0.5px solid var(--b);background:none;cursor:pointer;font-size:11px;font-weight:500;font-family:'Sora',sans-serif;color:var(--m);transition:all .15s}
.sp:hover{color:var(--t);border-color:var(--bb)}
.sp.s-agg.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--t)}
.sp.s-spl.on{background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(52,211,153,.1),rgba(251,191,36,.1));border-color:rgba(34,211,238,.35);color:var(--cy)}
.sp.s-b1.on{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.4);color:var(--cy)}
.sp.s-b2.on{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.4);color:var(--em)}
.sp.s-b3.on{background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.4);color:var(--am)}
.main{flex:1;padding:26px 26px 60px;min-width:0;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.page-title{font-size:19px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.pt-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:100px;background:rgba(34,211,238,.12);border:0.5px solid rgba(34,211,238,.3);color:var(--cy)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--t);font-family:'Sora',sans-serif;outline:none;cursor:pointer;min-width:110px}
.sel option{background:#0f1829}
.sel-brand{min-width:160px;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.06)}
.tpill{display:flex;background:rgba(255,255,255,.05);border-radius:9px;border:0.5px solid var(--b);overflow:hidden}
.tp{padding:5px 13px;font-size:12px;font-weight:500;background:none;border:none;cursor:pointer;color:var(--m);font-family:'Sora',sans-serif;transition:color .15s,background .15s}
.tp.on{background:rgba(34,211,238,.14);color:var(--cy)}
.g{background:var(--gl);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:0.5px solid var(--b);border-radius:var(--r);box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .2s}
.g:hover{border-color:var(--bb)}
.kg{display:grid;gap:12px;margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.kc{padding:18px 18px 14px;position:relative;overflow:hidden}
.kc::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.kl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--m);margin-bottom:7px}
.kv{font-size:22px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.ks{font-size:11px;color:var(--m);margin-top:4px}
.ki{position:absolute;right:14px;top:16px;font-size:24px;opacity:.1}
.kv-split{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.kv-s-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv-s-label{font-size:10px;color:var(--m);flex-shrink:0;min-width:50px}
.kv-s-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace}
.kv-s-bar{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.kv-s-fill{height:100%;border-radius:2px}
.gcy{background:linear-gradient(135deg,var(--cy),var(--em));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gam{background:linear-gradient(135deg,var(--am),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gvi{background:linear-gradient(135deg,var(--vi),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gem{background:linear-gradient(135deg,var(--em),#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gro{background:linear-gradient(135deg,var(--ro),var(--am));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:100px;margin-top:5px}
.up{background:rgba(52,211,153,.12);color:var(--em)}.dn{background:rgba(251,113,133,.12);color:var(--ro)}
.card{padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.ct{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--m);display:flex;align-items:center;gap:7px}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dcy{background:var(--cy);box-shadow:0 0 6px var(--cy)}.dam{background:var(--am);box-shadow:0 0 6px var(--am)}
.dvi{background:var(--vi);box-shadow:0 0 6px var(--vi)}.dem{background:var(--em);box-shadow:0 0 6px var(--em)}.dro{background:var(--ro);box-shadow:0 0 6px var(--ro)}
.cw{position:relative;height:220px}.cw-lg{height:260px}.cw-sm{height:175px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g13{display:grid;grid-template-columns:1.65fr 1fr;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:0.5px solid var(--b)}
.tab{padding:6px 16px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--m);font-family:'Sora',sans-serif;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.on{color:var(--t);font-weight:500;border-bottom-color:var(--t)}
.abar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.srch{background:rgba(255,255,255,.06);border:0.5px solid var(--b);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--t);font-family:'Sora',sans-serif;outline:none;width:190px}
.srch::placeholder{color:var(--d)}
.tw{border-radius:var(--r);overflow:hidden}
.th2{padding:14px 18px;border-bottom:0.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--d);border-bottom:0.5px solid rgba(255,255,255,.05);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--m)}
th.sorted{color:var(--cy)}
td{padding:9px 12px;border-bottom:0.5px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.mn{font-family:'DM Mono',monospace;font-size:12px}
.mn-hi{color:var(--am);font-weight:500}.mn-lo{color:var(--d)}.mn-gr{color:var(--em);font-weight:500}.mn-ro{color:var(--ro);font-weight:500}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap}
.pcy{background:rgba(34,211,238,.1);color:var(--cy);border:0.5px solid rgba(34,211,238,.2)}
.pam{background:rgba(251,191,36,.1);color:var(--am);border:0.5px solid rgba(251,191,36,.2)}
.pem{background:rgba(52,211,153,.1);color:var(--em);border:0.5px solid rgba(52,211,153,.2)}
.pvi{background:rgba(167,139,250,.1);color:var(--vi);border:0.5px solid rgba(167,139,250,.2)}
.pro{background:rgba(251,113,133,.1);color:var(--ro);border:0.5px solid rgba(251,113,133,.2)}
.pdm{background:rgba(255,255,255,.05);color:var(--m);border:0.5px solid rgba(255,255,255,.1)}
.sdiv{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--d);margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:0.5px;background:rgba(255,255,255,.06)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid rgba(255,255,255,.04)}
.srow:last-child{border-bottom:none}
.slb{font-size:12px;font-weight:500;min-width:90px}
.sbw{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.sbar{height:100%;border-radius:3px}
.s1c{background:linear-gradient(90deg,var(--cy),#0ea5e9)}
.s2c{background:linear-gradient(90deg,var(--em),#059669)}
.s3c{background:linear-gradient(90deg,var(--am),#f97316)}
.sv{font-size:11px;font-family:'DM Mono',monospace;color:var(--m);min-width:54px;text-align:right}
.sp2{font-size:10px;color:var(--d);min-width:30px;text-align:right}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.04)}
.prow:last-child{border-bottom:none}
.prk{font-size:11px;color:var(--d);font-family:'DM Mono',monospace;width:18px;flex-shrink:0}
.pi{flex:1;min-width:0}
.pn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{font-size:11px;color:var(--m)}
.pbw{width:68px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;flex-shrink:0}
.pbr{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--em))}
.pv{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;color:var(--em);min-width:58px;text-align:right;flex-shrink:0}
.pag{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:0.5px solid var(--b);font-size:12px;color:var(--m);flex-wrap:wrap}
.pbtn{padding:4px 10px;border-radius:8px;border:0.5px solid var(--b);background:none;cursor:pointer;font-size:12px;color:var(--m);font-family:'Sora',sans-serif}
.pbtn:hover{background:rgba(255,255,255,.06);color:var(--t)}
.pbtn.active{background:rgba(34,211,238,.14);color:var(--cy);border-color:rgba(34,211,238,.3)}
.cav{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
/* UPLOAD ZONE */
.upload-zone{border:1.5px dashed rgba(34,211,238,.3);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(34,211,238,.03);margin-bottom:14px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--cy);background:rgba(34,211,238,.06)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:28px;margin-bottom:8px}
.upload-title{font-size:14px;font-weight:500;color:var(--cy);margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--m)}
.upload-spec{font-size:11px;color:var(--d);margin-top:6px;font-family:'DM Mono',monospace}
.file-loaded{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.04)}
.file-loaded .upload-title{color:var(--em)}
.monthpick::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
.monthpick{min-width:145px}
/* PRIORITY BADGES */
.pri-U{background:rgba(251,113,133,.15);color:#fb7185;border:0.5px solid rgba(251,113,133,.35)}
.pri-A{background:rgba(251,191,36,.12);color:#fbbf24;border:0.5px solid rgba(251,191,36,.3)}
.pri-M{background:rgba(167,139,250,.1);color:#a78bfa;border:0.5px solid rgba(167,139,250,.25)}
.pri-O{background:rgba(52,211,153,.1);color:#34d399;border:0.5px solid rgba(52,211,153,.2)}
.pri-N{background:rgba(255,255,255,.06);color:var(--m);border:0.5px solid rgba(255,255,255,.12)}
/* BRAND FILTER PILL */
.bfpill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:var(--r);background:rgba(167,139,250,.08);border:0.5px dashed rgba(167,139,250,.4);margin-bottom:12px;font-size:12px;color:var(--vi)}
.bfpill button{margin-left:auto;padding:3px 10px;border-radius:8px;border:0.5px solid rgba(167,139,250,.4);background:none;cursor:pointer;font-size:11px;color:var(--vi);font-family:'Sora',sans-serif}
.filter-pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);font-size:11px;color:var(--m)}
.fp-strong{color:var(--t)}
.quickbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qbtn{padding:6px 12px;border-radius:999px;border:0.5px solid var(--b);background:rgba(255,255,255,.04);cursor:pointer;font-size:11px;font-weight:500;color:var(--m);font-family:'Sora',sans-serif;transition:all .15s}
.qbtn:hover{color:var(--t);border-color:var(--bb)}
.qbtn.on{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.32);color:var(--cy)}
.forn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.forn-card{padding:14px;border-radius:14px;border:0.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);cursor:pointer;transition:transform .15s,border-color .15s,background .15s;min-width:0}
.forn-card:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18)}
.forn-card.on{border-color:rgba(52,211,153,.35);background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(52,211,153,.08))}
.forn-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.forn-name{font-size:12px;font-weight:600;line-height:1.3;word-break:break-word}
.forn-tag{font-size:10px;color:var(--d);white-space:nowrap}
.forn-val{font-size:18px;font-weight:700;letter-spacing:-.5px;line-height:1.05}
.forn-sub{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--m);font-family:'DM Mono',monospace}
.forn-last{margin-top:8px;font-size:10px;color:var(--d)}
.forn-bar{margin-top:10px;height:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.forn-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cy),var(--em))}
/* AGING ROW COLORS */
.row-U td{background:rgba(251,113,133,.03)!important}
.row-A td{background:rgba(251,191,36,.025)!important}
.row-M td{background:rgba(167,139,250,.02)!important}
.row-U:hover td,.row-A:hover td,.row-M:hover td{filter:brightness(1.15)}
/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.fi{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.g2,.g3,.g13{grid-template-columns:1fr}.forn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.sb{display:none}.forn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="shell">
<nav class="sb">
  <div class="sb-logo">
    <div class="sb-icon">👁</div>
    <h1>Ottica Bonardi</h1>
    <p>3 sedi · Cremona</p>
  </div>
  <div class="sb-nav">
    <button class="nb active" onclick="nav('overview')" id="nb-overview"><span class="nb-ic">⬡</span>Overview</button>
    <button class="nb" onclick="nav('vendite')" id="nb-vendite"><span class="nb-ic">◈</span>Vendite</button>
    <button class="nb" onclick="nav('magazzino')" id="nb-magazzino"><span class="nb-ic">◫</span>Magazzino</button>
    <button class="nb" onclick="nav('clienti')" id="nb-clienti"><span class="nb-ic">◎</span>Clienti</button>
  </div>
  <div class="sb-vista">
    <div class="sb-vista-label">Vista dati</div>
    <div class="sede-pills" id="sedePills">
      <button class="sp s-agg on" onclick="setSede('agg')">Aggregate</button>
      <button class="sp s-spl" onclick="setSede('split')">Per sede</button>
      <button class="sp s-b1" onclick="setSede('B1')">A</button>
      <button class="sp s-b2" onclick="setSede('B2')">B</button>
      <button class="sp s-b3" onclick="setSede('B3')">C</button>
    </div>
  </div>
</nav>
<div class="main"><div id="root"></div></div>

      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {raw:false, dateNF:'yyyy-mm-dd'});
      if(!raw.length) throw new Error("File vuoto");
      processUpload(raw, file.name);
    } catch(err){
      alert("Errore lettura file: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function processUpload(raw, name){
  const VALID_TYPES = ["Montature vista","Occhiali sole","montature vista","occhiali sole"];
  // Filtra e normalizza
  const rows = raw.filter(r => {
    const tp = String(r['Tipo prodotto']||r['tipo prodotto']||'').trim();
    return VALID_TYPES.some(v=>tp.toLowerCase()===v.toLowerCase());
  });
  if(!rows.length){ alert("Nessun prodotto valido trovato. Verificare le colonne: Tipo prodotto = 'Montature vista' o 'Occhiali sole'"); return; }

  // Aggrega per filiale+marchio+modello+tipo+fornitore
  const agg = {};
  rows.forEach(r => {
    const fil = String(r['Filiale']||r['filiale']||'').trim().toUpperCase().replace(/^NEGOZIO\s*/i,'');
    const mar = String(r['Marchio']||r['marchio']||'').trim();
    const mod = String(r['Modello']||r['modello']||'').trim();
    const tp  = String(r['Tipo prodotto']||'').trim();
    const forn= cleanSupplierName(r['Fornitore']||'');
    const qty = parseFloat(String(r['Quantità magazzino']||r['Quantita magazzino']||0).replace(',','.')) || 0;
    const val = parseFloat(String(r['Valore magazzino']||0).replace(',','.')) || 0;
    const cos = parseFloat(String(r['Costo medio']||0).replace(',','.')) || 0;
    let dt = r['Data entrata magazzino']||r['Data entrata']||r['Data Entrata']||r['Data ult. acq']||r['Data ult acq']||r['Data ultimo acquisto']||r['DataEntrata']||r['data_entrata']||'';
    if(dt instanceof Date) dt = dt.toISOString().slice(0,10);
    else if(typeof dt === 'number') dt = excelSerialToISO(dt);
    else if(typeof dt === 'string') dt = normalizeDateValue(dt);
    const cat = tp.toLowerCase().includes('vista') ? 'M' : 'S';
    const key = `${fil}|${mar}|${mod}|${cat}|${forn}`;
    if(!agg[key]) agg[key]={f:fil,m:mar.slice(0,22),mod:mod.slice(0,18),cat,forn:forn||'Senza fornitore',q:0,v:0,c:0,cn:0,d:'',mesi:0,anno:0,pri:'O'};
    agg[key].q += qty; agg[key].v += val; agg[key].c += cos; agg[key].cn++;
    if(dt && (!agg[key].d || dt > agg[key].d)) agg[key].d = dt;
  });

  const allRows = Object.values(agg).map(r => {
    r.v = Math.round(r.v*100)/100;
    r.c = Math.round((r.c/r.cn)*100)/100;
    if(r.d){
      const yr=parseInt(r.d.slice(0,4)),mo=parseInt(r.d.slice(5,7))||1;
      r.mesi = Math.max(0,(2026-yr)*12+(5-mo));
      r.anno = yr;
      r.pri = yr<2020?'U':yr<2023?'A':yr<2024?'M':'O';
    }
    return r;
  });

  // Ricalcola MAG struttura
  const byBrand={}, byForn={}, catA={}, catB={};
  let vA=0,vB=0,pA=0,pB=0;
  allRows.forEach(r => {
    if(r.f==='A'){vA+=r.v;pA+=r.q;} else {vB+=r.v;pB+=r.q;}
    byBrand[r.m]=(byBrand[r.m]||0)+r.v;
    byForn[r.forn]=(byForn[r.forn]||0)+r.v;
    const ck=r.cat==='M'?'Montature':'Sole';
    if(r.f==='A')catA[ck]=(catA[ck]||0)+r.v; else catB[ck]=(catB[ck]||0)+r.v;
  });
  const topBrand=Object.entries(byBrand).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const topForn=Object.entries(byForn).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Smaltimento: prodotti comuni A e B
  const aMap={},bMap={};
  allRows.filter(r=>r.f==='A').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat; aMap[k]=(aMap[k]||{...r,qA:0});aMap[k].qA+=r.q;});
  allRows.filter(r=>r.f==='B').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat; bMap[k]=(bMap[k]||{...r,qB:0});bMap[k].qB+=r.q;});
  const smalt=Object.keys(aMap).filter(k=>bMap[k]).map(k=>({m:aMap[k].m,mod:aMap[k].mod,cat:aMap[k].cat==='M'?'Montature vista':'Occhiali sole',qA:aMap[k].qA,qB:bMap[k].qB,c:aMap[k].c})).sort((a,b)=>(b.qA+b.qB)-(a.qA+a.qB)).slice(0,40);

  LIVE_MAG = {
    kpi:{A:{pezzi:pA,valore:Math.round(vA*100)/100},B:{pezzi:pB,valore:Math.round(vB*100)/100},C:{pezzi:0,valore:0}},
    brand:topBrand.map(x=>({n:x[0],v:Math.round(x[1]*100)/100})),
    forn:topForn.map(x=>({n:x[0],v:Math.round(x[1]*100)/100})),
    smalt,
    cat:{A:{...catA},B:{...catB}},
    rows:allRows.sort((a,b)=>b.v-a.v)
  };

  // Ricalcola AG
  const byAnno={};
  allRows.filter(r=>r.anno>0).forEach(r=>{const y=String(r.anno);if(!byAnno[y])byAnno[y]={v:0,n:0,pz:0};byAnno[y].v+=r.v;byAnno[y].n++;byAnno[y].pz+=r.q;});
  Object.keys(byAnno).forEach(k=>{byAnno[k].v=Math.round(byAnno[k].v*100)/100;});
  const def={v:0,n:0,pz:0};
  const stats={
    U:allRows.filter(r=>r.anno>0&&r.anno<2020).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    A:allRows.filter(r=>r.anno>=2020&&r.anno<2023).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    M:allRows.filter(r=>r.anno>=2023&&r.anno<2024).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
    O:allRows.filter(r=>r.anno>=2024).reduce((a,r)=>({v:a.v+r.v,n:a.n+1,pz:a.pz+r.q}),{...def}),
  };
  ['U','A','M','O'].forEach(k=>{stats[k].v=Math.round(stats[k].v*100)/100;});
  LIVE_AG = {rows:allRows.filter(r=>r.anno>0).sort((a,b)=>a.anno-b.anno||a.d.localeCompare(b.d)), byAnno, stats};

  UPLOAD_NAME = name;
  UPLOAD_NAME_SHORT = name.length>30 ? name.slice(0,27)+'…' : name;
  Object.assign(ST,{magPage:0,agPage:0,magBrand:'all',magSed:'all',magCat:'all',magForn:'all',magDateFrom:'',magDateTo:'',magFocus:'all',magSearch:'',agPri:'all',agSed:'all',agSearch:''});
  renderPage();
}

const fmtN=n=>Math.round(n).toLocaleString("it-IT");
const fatt=arr=>arr.reduce((a,v)=>a+v.tot,0);

const dLabel=(c,p)=>{if(!p)return null;const d=Math.round((c-p)/p*100);return{d,cls:d>=0?"up":"dn",lbl:(d>=0?"↑":"↓")+Math.abs(d)+"%"};};
const SC={B1:["#22d3ee","rgba(34,211,238,.18)"],B2:["#34d399","rgba(52,211,153,.18)"],B3:["#fbbf24","rgba(251,191,36,.18)"]};

function cleanSupplierName(v){
  return String(v||'').replace(/\s+/g,' ').trim();
}
function excelSerialToISO(n){
  if(!n||n<25569||n>60000) return '';
  const d=new Date(Math.round((n-25569)*86400000));
  return isNaN(d.getTime())?'':d.toISOString().slice(0,10);
}
function normalizeDateValue(v){
  if(!v) return '';
  const s=String(v).trim();
  // yyyy-mm-dd già corretto
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // formato italiano dd/mm/yyyy o dd-mm-yyyy o dd.mm.yyyy
  const mIT=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(mIT) return `${mIT[3]}-${mIT[2].padStart(2,'0')}-${mIT[1].padStart(2,'0')}`;
  // formato corto dd/mm/yy
  const mIT2=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/);
  if(mIT2){const yr=parseInt(mIT2[3])+(parseInt(mIT2[3])<=30?2000:1900);return `${yr}-${mIT2[2].padStart(2,'0')}-${mIT2[1].padStart(2,'0')}`;}
  // serial number Excel come stringa
  if(/^\d+(\.\d*)?$/.test(s)){const iso=excelSerialToISO(parseFloat(s));if(iso)return iso;}
  // yyyy-mm senza giorno
  const mYM=s.match(/^(\d{4})-(\d{2})$/);
  if(mYM) return `${mYM[1]}-${mYM[2]}-01`;
  return '';
}
function monthKey(v){
  const s=normalizeDateValue(v);
  return s ? s.slice(0,7) : '';
}
function monthIndex(v){
  const mk=monthKey(v);
  if(!mk) return null;
  const [y,m]=mk.split('-').map(Number);
  return y*12+(m-1);
}
function ageMeta(v){
  const mk=monthKey(v);
  const idx=monthIndex(v);
  if(idx===null) return {month:'',label:'',mesi:null,anno:0,pri:'N'};
  const mesi=Math.max(0,(CY*12+CM)-idx);
  const pri=mesi>=60?'U':mesi>=36?'A':mesi>=24?'M':'O';
  return {month:mk,label:mk,mesi,anno:parseInt(mk.slice(0,4)),pri};
}
function enrichMagRow(r){
  const meta=ageMeta(r.d);
  return {...r,forn:cleanSupplierName(r.forn),dMonth:meta.month,dLabel:meta.label,mesi:meta.mesi,anno:meta.anno,pri:meta.pri};
}
function applySharedMagFilters(rows){
  let r=[...rows];
  if(ST.magBrand!=="all")r=r.filter(x=>x.m===ST.magBrand);
  if(ST.magCat!=="all")r=r.filter(x=>x.cat===ST.magCat);
  if(ST.magForn!=="all")r=r.filter(x=>x.forn===ST.magForn);
  const fromIdx=monthIndex(ST.magDateFrom),toIdx=monthIndex(ST.magDateTo);
  if(fromIdx!==null)r=r.filter(x=>{const idx=monthIndex(x.dMonth||x.d);return idx!==null&&idx>=fromIdx;});
  if(toIdx!==null)r=r.filter(x=>{const idx=monthIndex(x.dMonth||x.d);return idx!==null&&idx<=toIdx;});
  if(ST.magFocus==="3")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=3);
  else if(ST.magFocus==="6")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=6);
  else if(ST.magFocus==="12")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=12);
  else if(ST.magFocus==="24")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=24);
  else if(ST.magFocus==="36")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=36);
  else if(ST.magFocus==="60")r=r.filter(x=>typeof x.mesi==="number"&&x.mesi>=60);
  else if(ST.magFocus==="missing")r=r.filter(x=>!x.dMonth);
  return r;
}
function buildSupplierAgg(rows){
  const tot=rows.reduce((a,r)=>a+r.v,0);
  return Object.values(rows.reduce((acc,r)=>{
    const k=r.forn||"Senza fornitore";
    if(!acc[k])acc[k]={n:k,refs:0,q:0,v:0,last:'',share:0};
    acc[k].refs++;
    acc[k].q+=r.q;
    acc[k].v+=r.v;
    if(r.dMonth&&(!acc[k].last||r.dMonth>acc[k].last))acc[k].last=r.dMonth;
    return acc;
  },{})).sort((a,b)=>b.v-a.v).map(r=>({...r,share:tot>0?Math.round(r.v/tot*100):0}));
}
function buildSmalt(rows){
  const aMap={},bMap={};
  rows.filter(r=>r.f==='A').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat;aMap[k]=(aMap[k]||{...r,qA:0});aMap[k].qA+=r.q;});
  rows.filter(r=>r.f==='B').forEach(r=>{const k=r.m+'|'+r.mod+'|'+r.cat;bMap[k]=(bMap[k]||{...r,qB:0});bMap[k].qB+=r.q;});
  return Object.keys(aMap).filter(k=>bMap[k]).map(k=>({m:aMap[k].m,mod:aMap[k].mod,cat:aMap[k].cat==='M'?'Montature vista':'Occhiali sole',qA:aMap[k].qA,qB:bMap[k].qB,c:aMap[k].c})).sort((a,b)=>(b.qA+b.qB)-(a.qA+a.qB)).slice(0,40);
}
function buildAgingSummary(rows){
  const byAnno={},stats={U:{v:0,n:0,pz:0},A:{v:0,n:0,pz:0},M:{v:0,n:0,pz:0},O:{v:0,n:0,pz:0}};
  rows.filter(r=>r.anno>0).forEach(r=>{
    const y=String(r.anno);
    if(!byAnno[y])byAnno[y]={v:0,n:0,pz:0};
    byAnno[y].v+=r.v;byAnno[y].n++;byAnno[y].pz+=r.q;
    if(stats[r.pri]){stats[r.pri].v+=r.v;stats[r.pri].n++;stats[r.pri].pz+=r.q;}
  });
  Object.keys(byAnno).forEach(k=>{byAnno[k].v=Math.round(byAnno[k].v*100)/100;});
  ['U','A','M','O'].forEach(k=>{stats[k].v=Math.round(stats[k].v*100)/100;});
  return {byAnno,stats};
}

function magFilter(){
  let r=applySharedMagFilters(curMAG().rows.map(enrichMagRow));
  if(ST.magSed!=="all")r=r.filter(x=>x.f===ST.magSed);
  if(ST.magSearch){const s=ST.magSearch.toLowerCase();r=r.filter(x=>x.m.toLowerCase().includes(s)||x.mod.toLowerCase().includes(s)||x.forn.toLowerCase().includes(s));}
  return r;
}

  const stale36=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=36);
  const stale60=rows.filter(r=>typeof r.mesi==="number"&&r.mesi>=60);
  const missingDates=rows.filter(r=>!r.dMonth).length;

  const catA={},catB={};

    <option value="A"${ST.agPri==="A"?" selected":""}>🟠 Alta (36-59 mesi)</option>
    <option value="M"${ST.agPri==="M"?" selected":""}>🟡 Media (24-35 mesi)</option>
    <option value="O"${ST.agPri==="O"?" selected":""}>✅ OK (&lt; 24 mesi)</option>
  </select>
  <select class="sel" onchange="ST.agSed=this.value;ST.agPage=0;renderPage()">
    <option value="all"${ST.agSed==="all"?" selected":""}>Sedi A+B</option>
    <option value="A"${ST.agSed==="A"?" selected":""}>Sede A</option>
    <option value="B"${ST.agSed==="B"?" selected":""}>Sede B</option>
  </select>
  <input class="srch" placeholder="Cerca marchio / modello / fornitore…" value="${ST.agSearch}" oninput="ST.agSearch=this.value;ST.agPage=0;renderPage()">
  <span style="margin-left:auto;font-size:12px;color:var(--m)">${fmtN(agRows.length)} ref. · ${fmt(agValTot)}</span>
</div>
<div class="g tw fi">
<table>
  <thead><tr>${ath("f","Sede")}${ath("m","Marchio")}${ath("mod","Modello")}${ath("cat","Cat.")}${ath("d","Data acq.")}${ath("mesi","Mesi in mag.")}${ath("q","Qty")}${ath("v","Valore")}${ath("c","Costo unit.")}${ath("pri","Priorità")}</tr></thead>
  <tbody>${agPage.length===0?`<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--d)">Nessun prodotto</td></tr>`:agPage.map(r=>{
    const pc=r.pri==="U"?"row-U":r.pri==="A"?"row-A":r.pri==="M"?"row-M":"";
    return`<tr class="${pc}">
      <td><span class="pill ${r.f==="A"?"pcy":"pem"}">${r.f}</span></td>
      <td style="font-weight:500">${r.m}</td>
      <td style="font-size:12px;color:var(--m)">${r.mod}</td>
      <td><span class="pill ${r.cat==="M"?"pvi":"pam"}">${r.cat==="M"?"Vista":"Sole"}</span></td>
      <td class="mn${r.pri!=="O"&&r.pri!=="N"?" mn-hi":""}">${r.dLabel||"—"}</td>
      <td class="mn" style="font-weight:600;color:${r.pri==="U"?"var(--ro)":r.pri==="A"?"var(--am)":r.pri==="M"?"var(--vi)":"var(--em)"}">${r.mesi===null?"—":r.mesi}</td>
      <td class="mn">${r.q}</td>
      <td class="mn mn-gr">${fmt(r.v)}</td>
      <td class="mn">${fmt(r.c)}</td>
      <td><span class="pill${r.pri==="U"?" pri-U":r.pri==="A"?" pri-A":r.pri==="M"?" pri-M":" pri-O"}">${PRI_LABEL[r.pri]||"—"}</span></td>
    </tr>`;
  }).join("")}</tbody>
</table>
<div class="pag">
  <span style="flex:1">Pag. ${agPageIdx+1}/${agPages} · ${fmtN(agRows.length)} prodotti</span>
  ${agPageIdx>0?`<button class="pbtn" onclick="ST.agPage=${agPageIdx-1};renderPage()">← Prec.</button>`:""}
  ${Array.from({length:Math.min(agPages,7)},(_,i)=>`<button class="pbtn${agPageIdx===i?" active":""}" onclick="ST.agPage=${i};renderPage()">${i+1}</button>`).join("")}
  ${agPageIdx<agPages-1?`<button class="pbtn" onclick="ST.agPage=${agPageIdx+1};renderPage()">Succ. →</button>`:""}
</div>
</div>`

:`
<div style="font-size:12px;color:var(--m);margin-bottom:12px">Prodotti presenti in entrambe le sedi — candidati al trasferimento verso Sede C.</div>
<div class="g tw fi">
  ${smalt.length===0?`<div style="padding:28px;text-align:center;color:var(--d)">Nessun prodotto comune A+B${bf?" per "+ST.magBrand:""}</div>`:`
  <table><thead><tr><th>Marchio</th><th>Modello</th><th>Cat.</th><th>Qty A</th><th>Qty B</th><th>Tot. A+B</th><th>Costo unit.</th><th>Valore</th></tr></thead>
  <tbody>${smalt.map(r=>{const qt=r.qA+r.qB,urg=qt>=10;return`<tr${urg?' style="background:rgba(251,191,36,.04)"':''}>
    <td style="font-weight:500${urg?';color:var(--am)':''}">${r.m}</td>

// ═══ CLIENTI ════════════════════════════════════════════════════════════════
function rCli(){
  const cData=CLI.map(c=>{const vC=applySedeF(ALL_V).filter(v=>v.cli===c.nome);return{...c,fatt:fatt(vC),nAcq:vC.length,ua:vC[0]?.data||""};}).sort((a,b)=>b.fatt-a.fatt);
  const srch=ST.cliSearch.toLowerCase();
  const filtered=srch?cData.filter(c=>c.nome.toLowerCase().includes(srch)):cData;
  const totF=cData.reduce((a,c)=>a+c.fatt,0);
  const tipoCat=["Vista","Sole","Entrambi","Contatto"];
  window.__cli={tipoCat,tipoDat:tipoCat.map(t=>CLI.filter(c=>c.tipo===t).length)};
  return`
<div class="topbar fi"><div class="page-title">Clienti</div>
  <div class="controls"><input class="srch" placeholder="Cerca…" value="${ST.cliSearch}" oninput="ST.cliSearch=this.value;renderPage()" style="width:190px"></div>
</div>
${splitBar()}
<div class="kg k4 fi">
  <div class="g kc"><div class="kl">Clienti</div><div class="kv gcy">${CLI.length}</div></div>
  <div class="g kc"><div class="kl">Acquisti tot.</div><div class="kv gem">${cData.reduce((a,c)=>a+c.nAcq,0)}</div></div>
  <div class="g kc"><div class="kl">Valore medio</div><div class="kv gam">${fmt(totF/cData.length)}</div></div>
  <div class="g kc"><div class="kl">Fatturato clienti</div><div class="kv gvi">${fmt(totF)}</div></div>
</div>
<div class="g3 fi">
  <div class="g card"><div class="ch"><div class="ct"><span class="dot dvi"></span>Segmentazione</div></div><div class="cw cw-sm"><canvas id="ch_cli_tipo"></canvas></div></div>
  <div class="g card"><div class="ch"><div class="ct"><span class="dot dem"></span>Top clienti</div></div>
    ${cData.slice(0,5).map((c,i)=>`<div class="prow"><div class="prk">0${i+1}</div><div class="pi"><div class="pn">${c.nome}</div><div class="pb">${c.tipo} · ${c.nAcq} acq.</div></div><div class="pbw"><div class="pbr" style="width:${cData[0].fatt>0?Math.round(c.fatt/cData[0].fatt*100):0}%"></div></div><div class="pv">${fmt(c.fatt)}</div></div>`).join("")}
  </div>
  <div class="g card"><div class="ch"><div class="ct"><span class="dot dcy"></span>Trend 12M</div></div><div class="cw cw-sm"><canvas id="ch_cli_trend"></canvas></div></div>
</div>
<div class="g tw fi">
  <div class="th2"><div class="ct"><span class="dot dcy"></span>Anagrafica (${filtered.length})</div></div>
  <table><thead><tr><th>Cliente</th><th>Tipo</th><th>Acquisti</th><th>Fatturato</th><th>Ultimo acq.</th></tr></thead>
  <tbody>${filtered.map(c=>{const av=c.nome.split(" ").map(w=>w[0]).join("").slice(0,2);return`<tr>
    <td><div style="display:flex;align-items:center;gap:9px"><div class="cav" style="background:${c.col[0]};color:${c.col[1]}">${av}</div><span style="font-weight:500">${c.nome}</span></div></td>
    <td><span class="pill ${c.tipo==="Vista"?"pcy":c.tipo==="Sole"?"pam":c.tipo==="Entrambi"?"pvi":"pem"}">${c.tipo}</span></td>
    <td class="mn">${c.nAcq}</td><td class="mn mn-gr">${fmt(c.fatt)}</td>
    <td class="mn" style="color:var(--m)">${c.ua?c.ua.slice(0,7):"—"}</td>
  </tr>`;}).join("")}</tbody></table>
</div>`;
}

// ═══ CHARTS INIT ════════════════════════════════════════════════════════════
function initCharts(){
  if(!window.Chart)return;

  // OVERVIEW
  if(ST.page==="overview"&&window.__ov){
    const m12=window.__ov.m12,tab=window.__ov.tab;
    if(tab==="trend"){
      if(ST.sedeMode==="split"){
        mkChart("ch_ov","line",m12.map(m=>m.lbl),BK.map((k,i)=>({label:SEDI_LBL[i],data:m12.map(m=>fatt(filtY(m.yr,m.me).filter(v=>v.sede===k))),borderColor:SC[k][0],backgroundColor:SC[k][1].replace("18)","07)"),fill:true,tension:.42,pointRadius:3,pointBorderColor:"transparent",pointBackgroundColor:SC[k][0],borderWidth:2})),coLeg);
      } else {
        const bkF=ST.sedeMode==="agg"?null:ST.sedeMode;
        mkChart("ch_ov","line",m12.map(m=>m.lbl),[{data:m12.map(m=>{let v=filtY(m.yr,m.me);if(bkF)v=v.filter(x=>x.sede===bkF);return fatt(v);}),borderColor:"#22d3ee",backgroundColor:"rgba(34,211,238,.07)",fill:true,tension:.42,pointRadius:3,pointBorderColor:"transparent",pointBackgroundColor:"#22d3ee",borderWidth:2}],CO);
      }
    } else if(tab==="mom"){
      const cats=["Montature","Lenti Vista","Occhiali Sole","Lenti Contatto"];
      mkChart("ch_ov","bar",cats,[{label:MESI[CM],data:cats.map(c=>fatt(applySedeF(filtY(CY,CM)).filter(v=>v.cat===c))),backgroundColor:"rgba(34,211,238,.2)",borderColor:"#22d3ee",borderWidth:1.5,borderRadius:5},{label:MESI[CM===0?11:CM-1],data:cats.map(c=>fatt(applySedeF(filtY(CM===0?CY-1:CY,CM===0?11:CM-1)).filter(v=>v.cat===c))),backgroundColor:"rgba(167,139,250,.15)",borderColor:"rgba(167,139,250,.6)",borderWidth:1.5,borderRadius:5}],coLeg);
    } else {
      const m6=Array.from({length:6},(_,i)=>{const d=new Date(CY,CM-5+i,1);return{yr:d.getFullYear(),me:d.getMonth(),lbl:MESI[d.getMonth()]};});
      mkChart("ch_ov","bar",m6.map(m=>m.lbl+" "+m.yr),[{label:String(CY),data:m6.map(m=>fatt(applySedeF(filtY(m.yr,m.me)))),backgroundColor:"rgba(52,211,153,.2)",borderColor:"#34d399",borderWidth:1.5,borderRadius:5},{label:String(CY-1),data:m6.map(m=>fatt(applySedeF(filtY(m.yr-1,m.me)))),backgroundColor:"rgba(251,191,36,.15)",borderColor:"rgba(251,191,36,.6)",borderWidth:1.5,borderRadius:5}],coLeg);
    }
  }

  // VENDITE
  if(ST.page==="vendite"&&window.__vend){
    const m12=window.__vend.m12,tab=window.__vend.tab;
    const bkF=ST.sedeMode==="agg"||ST.sedeMode==="split"?null:ST.sedeMode;
    if(tab==="trend"){
      if(ST.sedeMode==="split"){
        mkChart("ch_vend","line",m12.map(m=>m.lbl),BK.map((k,i)=>({label:SEDI_LBL[i],data:m12.map(m=>fatt(filtY(m.yr,m.me).filter(v=>v.sede===k))),borderColor:SC[k][0],backgroundColor:SC[k][1].replace("18)","07)"),fill:true,tension:.4,pointRadius:3,pointBorderColor:"transparent",pointBackgroundColor:SC[k][0],borderWidth:2})),coLeg);
      } else {
        mkChart("ch_vend","line",m12.map(m=>m.lbl),[{data:m12.map(m=>{let v=filtY(m.yr,m.me);if(bkF)v=v.filter(x=>x.sede===bkF);return fatt(v);}),borderColor:"#22d3ee",backgroundColor:"rgba(34,211,238,.07)",fill:true,tension:.4,pointRadius:3,pointBorderColor:"transparent",pointBackgroundColor:"#22d3ee",borderWidth:2}],CO);
      }
    } else {
      const m6=Array.from({length:6},(_,i)=>{const d=new Date(CY,CM-5+i,1);return{yr:d.getFullYear(),me:d.getMonth(),lbl:MESI[d.getMonth()]};});
      const isYOY=tab==="yoy";
      const cur=m6.map(m=>{let v=filtY(m.yr,m.me);if(bkF)v=v.filter(x=>x.sede===bkF);return fatt(v);});
      const prv=m6.map(m=>{let v=filtY(isYOY?m.yr-1:m.yr,isYOY?m.me:m.me===0?11:m.me-1);if(bkF)v=v.filter(x=>x.sede===bkF);return fatt(v);});
      mkChart("ch_vend","bar",m6.map(m=>m.lbl),[{label:isYOY?String(CY):"Corrente",data:cur,backgroundColor:"rgba(34,211,238,.2)",borderColor:"#22d3ee",borderWidth:1.5,borderRadius:5},{label:isYOY?String(CY-1):"Precedente",data:prv,backgroundColor:"rgba(167,139,250,.15)",borderColor:"rgba(167,139,250,.6)",borderWidth:1.5,borderRadius:5}],coLeg);
    }
    const byCat=["Montature","Lenti Vista","Occhiali Sole","Lenti Contatto","Accessori"].map(c=>fatt(applySedeF(filtY(ST.selAnno,ST.selMese)).filter(v=>v.cat===c)));
    mkChart("ch_vcat","doughnut",["Montature","Lenti Vista","Occhiali Sole","Lenti Contatto","Accessori"],[{data:byCat,backgroundColor:["#a78bfa","#22d3ee","#fbbf24","#34d399","rgba(255,255,255,.12)"],borderWidth:0,hoverOffset:6}],coDon);
  }

  // MAGAZZINO
  if(ST.page==="magazzino"&&window.__mag){
    const mg=window.__mag;
    // Grafico 1
    if(mg.bf){
      const byMod=Object.entries(mg.rows.reduce((o,r)=>{o[r.mod]=(o[r.mod]||0)+r.v;return o;},{})).sort((a,b)=>b[1]-a[1]).slice(0,10);
      mkChart("ch_mag1","bar",byMod.map(x=>x[0].slice(0,14)),[{data:byMod.map(x=>x[1]),backgroundColor:"rgba(167,139,250,.2)",borderColor:"#a78bfa",borderWidth:1.5,borderRadius:4}],CO);
    } else {
      mkChart("ch_mag1","bar",mg.topBrand.map(x=>x[0]),[{data:mg.topBrand.map(x=>x[1]),backgroundColor:["rgba(34,211,238,.2)","rgba(167,139,250,.2)","rgba(52,211,153,.2)","rgba(251,191,36,.2)","rgba(251,113,133,.2)","rgba(34,211,238,.15)","rgba(167,139,250,.15)","rgba(52,211,153,.15)","rgba(251,191,36,.15)","rgba(251,113,133,.15)"],borderColor:["#22d3ee","#a78bfa","#34d399","#fbbf24","#fb7185","#22d3ee","#a78bfa","#34d399","#fbbf24","#fb7185"],borderWidth:1.5,borderRadius:4}],CO);
    }
    // Grafico 2 categorie
    mkChart("ch_mag2","doughnut",["A · Montature","A · Sole","B · Montature","B · Sole"],[{data:[mg.catA["Montature"]||0,mg.catA["Sole"]||0,mg.catB["Montature"]||0,mg.catB["Sole"]||0],backgroundColor:["#22d3ee","rgba(34,211,238,.4)","#34d399","rgba(52,211,153,.4)"],borderWidth:0,hoverOffset:6}],coDon);
    // Grafici aging
    if(ST.magTab==="aging"){
      const ag=mg.aging||{byAnno:{},stats:{U:{v:0},A:{v:0},M:{v:0},O:{v:0}}};
      const anni=Object.keys(ag.byAnno).sort();
      const agColors=anni.map(y=>{const n=parseInt(y);return n<2020?"rgba(251,113,133,.6)":n<2023?"rgba(251,191,36,.6)":n<2024?"rgba(167,139,250,.5)":"rgba(52,211,153,.5)";});
      const agBorder=anni.map(y=>{const n=parseInt(y);return n<2020?"#fb7185":n<2023?"#fbbf24":n<2024?"#a78bfa":"#34d399";});
      mkChart("ch_aging","bar",anni,[{data:anni.map(y=>ag.byAnno[y].v),backgroundColor:agColors,borderColor:agBorder,borderWidth:1.5,borderRadius:4}],CO);
      // Donut priorità
      const stats=ag.stats;
      mkChart("ch_aging_pri","doughnut",["🔴 Urgente (>5 anni)","🟠 Alta (3-5 anni)","🟡 Media (2-3 anni)","✅ OK (<2 anni)"],[{data:[stats.U.v,stats.A.v,stats.M.v,stats.O.v],backgroundColor:["rgba(251,113,133,.6)","rgba(251,191,36,.55)","rgba(167,139,250,.5)","rgba(52,211,153,.45)"],borderWidth:0,hoverOffset:6}],coDon);
    }
  }

  // CLIENTI
  if(ST.page==="clienti"&&window.__cli){
    const cl=window.__cli;
    const m12=Array.from({length:12},(_,i)=>{const d=new Date(CY,CM-11+i,1);return{yr:d.getFullYear(),me:d.getMonth(),lbl:MESI[d.getMonth()]};});
    mkChart("ch_cli_tipo","doughnut",cl.tipoCat,[{data:cl.tipoDat,backgroundColor:["#22d3ee","#fbbf24","#a78bfa","#34d399"],borderWidth:0,hoverOffset:6}],coDon);
    const bkF=ST.sedeMode==="split"||ST.sedeMode==="agg"?null:ST.sedeMode;
    if(ST.sedeMode==="split"){
      mkChart("ch_cli_trend","line",m12.map(m=>m.lbl),BK.map((k,i)=>({label:SEDI_LBL[i],data:m12.map(m=>filtY(m.yr,m.me).filter(v=>v.sede===k).length),borderColor:SC[k][0],backgroundColor:SC[k][1].replace("18)","07)"),fill:true,tension:.4,pointRadius:2,pointBorderColor:"transparent",pointBackgroundColor:SC[k][0],borderWidth:2})),{...coLeg,scales:{...coLeg.scales,y:{...coLeg.scales.y,ticks:{...coLeg.scales.y.ticks,callback:v=>v}}}});
    } else {
      mkChart("ch_cli_trend","line",m12.map(m=>m.lbl),[{data:m12.map(m=>{let v=filtY(m.yr,m.me);if(bkF)v=v.filter(x=>x.sede===bkF);return v.length;}),borderColor:"#22d3ee",backgroundColor:"rgba(34,211,238,.07)",fill:true,tension:.4,pointRadius:2,pointBorderColor:"transparent",pointBackgroundColor:"#22d3ee",borderWidth:2}],{...CO,scales:{...CO.scales,y:{...CO.scales.y,ticks:{...CO.scales.y.ticks,callback:v=>v}}}});
    }
  }
}

window.magSort=col=>{if(ST.magSort===col)ST.magAsc=!ST.magAsc;else{ST.magSort=col;ST.magAsc=false;}renderPage();}
window.agSort=col=>{if(ST.agSort===col)ST.agAsc=!ST.agAsc;else{ST.agSort=col;ST.agAsc=false;}renderPage();}
window.setMagForn=v=>{ST.magForn=ST.magForn===v?'all':v;ST.magPage=0;ST.agPage=0;renderPage();}
window.setMagFocus=v=>{ST.magFocus=v;ST.magPage=0;ST.agPage=0;renderPage();}
window.setMagDateFrom=v=>{ST.magDateFrom=v;if(ST.magDateTo&&v&&ST.magDateTo<v)ST.magDateTo=v;ST.magPage=0;ST.agPage=0;renderPage();}
window.setMagDateTo=v=>{ST.magDateTo=v;if(ST.magDateFrom&&v&&ST.magDateFrom>v)ST.magDateFrom=v;ST.magPage=0;ST.agPage=0;renderPage();}
window.resetMagFilters=()=>{Object.assign(ST,{magBrand:'all',magSed:'all',magCat:'all',magForn:'all',magDateFrom:'',magDateTo:'',magFocus:'all',magSearch:'',magPage:0,agPage:0});renderPage();}

renderPage();
</script>
