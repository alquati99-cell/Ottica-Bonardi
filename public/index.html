// Rende anche le tabelle markdown (| Col | Col |) come <table> vere — servono
// per i confronti "modello A vs modello B" che l'utente chiede all'AI.
function aiMarkdown(t){
  if(!t)return'';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');

  const lines=t.split('\n');
  const tables=[];
  const kept=[];
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  const isSep=l=>/^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(l);
  for(let i=0;i<lines.length;i++){
    if(isRow(lines[i])&&lines[i+1]&&isSep(lines[i+1])){
      const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const head=cells(lines[i]);
      let j=i+2;const rows=[];
      while(j<lines.length&&isRow(lines[j])){rows.push(cells(lines[j]));j++;}
      const idx=tables.length;
      tables.push(`<div style="overflow-x:auto;margin:8px 0"><table class="ai-table"><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      kept.push(`\x00TBL${idx}\x00`);
      i=j-1;
    } else kept.push(lines[i]);
  }
  let html=kept.join('\n')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^#{1,3}\s(.+)$/gm,'<strong>$1</strong>')
    .replace(/^[-•]\s(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p style="margin:6px 0 0">')
    .replace(/\n/g,'<br>');
  tables.forEach((tbl,idx)=>{html=html.replace(`\x00TBL${idx}\x00`,tbl);});
  return html;
}

function scrollAI(){const m=document.getElementById('ai-msgs');if(m)m.scrollTop=m.scrollHeight;}

async function sendAI(prefill){
  const inp=document.getElementById('ai-inp');
  const msg=prefill||(inp?inp.value.trim():'');
  if(!msg||AI_LOADING)return;
  if(inp)inp.value='';

  const msgs=document.getElementById('ai-msgs');
  if(!msgs)return;

  // User bubble
  const{el:uEl}=aiMsgHtml('user',msg);
  msgs.appendChild(uEl);
  scrollAI();

  AI_HISTORY.push({role:'user',content:msg});

  // Typing indicator
  const{el:bEl,bub}=aiMsgHtml('bot','',true);
  msgs.appendChild(bEl);
  scrollAI();

  AI_LOADING=true;
  const sendBtn=document.getElementById('ai-send');
  if(sendBtn)sendBtn.disabled=true;

  // Include anche gli ultimi scambi nella ricerca: una domanda di follow-up
  // ("quanto ha speso?") spesso non ripete il nome dell'entità di cui si
  // sta parlando, che va ripreso dal turno precedente.
  // Clienti: cerca anche nella conversazione recente (i follow-up tipo
  // "quanto ha speso?" non ripetono il nome). Marche/prodotti: cerca solo
  // nel messaggio corrente + ultima domanda utente, per non trascinare
  // marche citate in risposte precedenti in un confronto non richiesto.
  const recentCtx=AI_HISTORY.slice(-5).map(m=>m.content).join(' ')+' '+msg;
  const lastUserMsg=[...AI_HISTORY].reverse().find(m=>m.role==='user')?.content||'';
  const brandCtx=lastUserMsg+' '+msg;
  let sysPrompt=buildAIContext()+buildClientLookup(recentCtx)+buildProductLookup(brandCtx)+buildSalesLookup(brandCtx)+buildAnalyticsLookup(brandCtx);

  // PASSO 1 — l'AI traduce la domanda in una query; il codice la esegue
  // esatta sui dati completi. Se ci riesce, iniettiamo il risultato preciso
  // nel contesto. Così può rispondere a domande arbitrarie senza fare i
  // conti a mano. Se non produce una query valida, si prosegue col contesto
  // standard (nessuna regressione).
  if(LIVE_VEND){
    try{
      bub.innerHTML='<span style="font-size:12px;color:var(--d)">Interrogo i dati…</span>';
      const plan=await callAI({model:'smart',messages:[{role:'system',content:aiQueryPlannerPrompt()},{role:'user',content:(lastUserMsg&&lastUserMsg!==msg?lastUserMsg+' — ':'')+msg}]},()=>{});
      const raw=(plan.full||'').trim();
      if(raw&&!/^NONE/i.test(raw)){
        const m=raw.match(/\{[\s\S]*\}/);
        if(m){const spec=JSON.parse(m[0]);const res=runDataQuery(spec);if(res)sysPrompt+=renderQueryResult(spec,res);}
      }
    }catch(e){console.warn('query planner skipped',e);}
  }

  const payload={
    model:document.getElementById('ai-model-sel')?.value||'fast',
    messages:[{role:'system',content:sysPrompt},...AI_HISTORY.slice(-12)]
  };

  bub.innerHTML='';
  try{
    const{full,usedFallback}=await callAI(payload,partial=>{bub.innerHTML=aiMarkdown(partial)+'<span class="ai-cursor">▋</span>';scrollAI();});
    bub.innerHTML=(aiMarkdown(full)||'(nessuna risposta)')+(usedFallback?`<div style="font-size:10px;color:var(--d);margin-top:6px">↺ passato automaticamente al modello 70B smart</div>`:'');
    AI_HISTORY.push({role:'assistant',content:full});
  }catch(err){
    bub.innerHTML=`<span style="color:var(--ro)">Errore: ${err.message}</span>`;
    if(err.message.includes('fetch')||err.message.includes('network'))
      bub.innerHTML+=`<br><span style="font-size:11px;color:var(--d)">Verifica che l'app sia su Cloudflare Workers (non funziona in locale statico)</span>`;
  }finally{
    AI_LOADING=false;
    if(sendBtn)sendBtn.disabled=false;
    // Remove cursor
    bub.querySelectorAll('.ai-cursor').forEach(e=>e.remove());
    scrollAI();
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&document.activeElement?.id==='ai-inp'){e.preventDefault();sendAI();}
});

</script>
